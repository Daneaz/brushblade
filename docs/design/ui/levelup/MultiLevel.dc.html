<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; }
    sc-for, sc-if { display: contents; }
    a { color: #9B1E22; } a:hover { color: #7A3F5C; }
    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }

    /* iPhone 16 Pro Max 横屏 932×430pt。安全区 左右 59 / 下 21。与 scenes/base.css 同一套 */
    .dev { position: relative; width: 932px; height: 430px; box-sizing: border-box;
      background: #EFE9DA; color: #161B22; overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    .safe { position: absolute; left: 59px; right: 59px; top: 0; bottom: 21px;
      display: flex; flex-direction: column; }
    .guide { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
    .guide i { position: absolute; background: rgba(197,54,55,.20); }
    .guide .gl { left: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gr { right: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gb { left: 0; right: 0; bottom: 21px; height: 1px; }
    .homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px;
      display: flex; justify-content: center; z-index: 60; }
    .homebar > span { width: 128px; border-radius: 2px; background: rgba(22,27,34,.28); }

    .card { background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 12px; box-sizing: border-box; }
    .pill { height: 40px; padding: 0 22px; border: none; border-radius: 20px; cursor: pointer;
      font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; letter-spacing: 2px;
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
    .pill.cinnabar { background: #C53637; color: #fff; box-shadow: 0 3px 10px rgba(155,30,34,.26); }
    .pill.ink { background: #3D4E69; color: #fff; }
    .tap { position: relative; }
    .tap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 44px; transform: translateY(-50%); }

    /* ---- 背景屏(被遮罩压住,只留个轮廓让人知道弹窗是从哪一屏冒出来的) ---- */
    .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font-family: "Noto Serif SC", serif; font-size: 300px; font-weight: 600; line-height: 1;
      color: rgba(94,74,49,.075); pointer-events: none; user-select: none; }
    .bgwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .bgpanel { width: 640px; padding: 18px 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .bgpanel .h { font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 600; letter-spacing: 4px; }
    .bgpanel .sub { font-size: 10.5px; color: #5D646F; letter-spacing: 1px; }
    .bgpanel .n { font-family: "Noto Serif SC", serif; font-size: 34px; font-weight: 600; color: #8A6600; line-height: 1; }
    .bgpanel .row { display: flex; gap: 14px; width: 100%; }
    .bgpanel .row .pill { flex: 1; }
    .bgpanel .chestrow { width: 100%; height: 48px; border-radius: 10px; background: #FFFDF7; border: 1px solid #E7E1D4; }

    .scrim { position: absolute; inset: 0; background: rgba(22,27,34,.55); z-index: 50; }

    /* ---- 升级弹窗 ----
       尺寸口径同 Upgrade.dc.html 的 .sheet(Ui.Sheet):居中宣纸卡 + 1pt 描边。
       600×348 是内容量出来的:头部 74 + 两栏 188 + 按钮 36,再挤就要把五行属性压成两列 */
    .pop { position: absolute; left: 166px; top: 30px; width: 600px; height: 348px;
      box-sizing: border-box; background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 11px;
      padding: 14px 18px 14px; box-shadow: 0 12px 38px rgba(22,27,34,.42);
      display: flex; flex-direction: column; gap: 11px; z-index: 51; }

    /* 头部:等级是这一屏的主角 —— 旧级压灰、新级放大,中间一支箭头 */
    .hd { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .kick { display: flex; align-items: center; gap: 10px;
      font-family: "Noto Serif SC", serif; font-size: 12px; font-weight: 600; letter-spacing: 8px; color: #9B1E22; }
    .kick::before, .kick::after { content: ""; width: 34px; height: 1px; background: #DED7C9; }
    .kick span { margin-right: -8px; }
    .lvrow { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
    .lvrow .was { font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 600; color: #A8A08E; }
    .lvrow .arw { font-size: 14px; color: #7A3F5C; }
    .lvrow .now { font-family: "Noto Serif SC", serif; font-size: 38px; font-weight: 700; color: #161B22; line-height: 1; }
    .lvrow .now i { font-style: normal; font-size: 16px; font-weight: 600; color: #5D646F; margin-right: 2px; }
    .lvrow .jump { align-self: center; height: 18px; padding: 0 8px; border-radius: 9px;
      background: #C53637; color: #fff; font-size: 9.5px; font-weight: 700; letter-spacing: 1px;
      display: inline-flex; align-items: center; }
    .xp { width: 260px; display: flex; align-items: center; gap: 6px; font-size: 9px; color: #676F7A;
      font-variant-numeric: tabular-nums; }
    .xp .t { flex: 1; height: 4px; border-radius: 2px; background: #E4DDCE; overflow: hidden; }
    .xp .t span { display: block; height: 100%; background: #C9A94A; }

    .mods { flex: 1; min-height: 0; display: flex; gap: 14px; }
    .mod { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .mod.stats { flex: 1; }
    .mod.gift { width: 218px; flex: none; }
    /* 小节标题(与卡组右栏 / Upgrade 同一条:标题 + 一条横线) */
    .ttl { flex: none; display: flex; align-items: center; gap: 6px; }
    .ttl b { font-family: "Noto Serif SC", serif; font-size: 10px; font-weight: 600; color: #5D646F; }
    .ttl span { font-size: 9px; color: #A8A08E; }
    .ttl .rule { flex: 1; height: 1px; background: #EDE7DA; }

    /* 属性行:与 Upgrade.dc.html 的 .num 同一种读法「名 旧 → 新 (+差)」 */
    .num { display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 8px;
      border-radius: 7px; background: #F2EEE4; font-variant-numeric: tabular-nums; }
    .num .k { font-size: 9.5px; color: #5D646F; width: 30px; }
    .num .was { font-family: "Noto Serif SC", serif; font-size: 12px; color: #A8A08E; }
    .num .arw { font-size: 9px; color: #A09A8C; }
    .num .now { font-family: "Noto Serif SC", serif; font-size: 14px; font-weight: 600; color: #161B22; }
    .num.hp .now { color: #B02D2E; }
    .num .dlt { margin-left: auto; font-size: 9.5px; font-weight: 700; color: #1B552C; }
    /* 这一级没涨(护甲隔级 +1)—— 行照列,不藏:藏了玩家会以为护甲丢了 */
    .num.same .now { color: #676F7A; }
    .num.same .dlt { color: #928B7B; font-weight: 400; }
    /* 触顶:金系小牌,与主界面「新纪录」同色 */
    .capt { height: 14px; padding: 0 5px; border-radius: 7px; background: #F6EDD5;
      border: 1px solid rgba(201,169,74,.55); color: #8A6600; font-size: 8.5px; font-weight: 700;
      display: inline-flex; align-items: center; letter-spacing: .5px; }

    /* 奖励:单箱一张卡,箱子立绘是主体 */
    .box { position: relative; flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box;
      background: #FFFDF7; border: 1px solid #E7E1D4; border-radius: 10px; padding: 6px 10px 9px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .box::before { content: ""; position: absolute; left: 50%; top: 2px; width: 150px; height: 96px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 22%, transparent), transparent); }
    .box .art { position: relative; width: 90px; height: 90px; display: block; }
    .box .nm { position: relative; display: flex; align-items: center; gap: 6px;
      font-family: "Noto Serif SC", serif; font-size: 14px; font-weight: 600; letter-spacing: 1px; }
    .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--c); display: block; flex: none; }
    .band { height: 16px; padding: 0 6px; border-radius: 8px; background: #EFEADF; border: 1px solid #DED7C9;
      font-family: "Noto Sans SC", sans-serif; font-size: 8.5px; font-weight: 500; color: #5D646F;
      letter-spacing: 0; display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
    .box .yield { font-size: 9.5px; color: #7A7261; font-variant-numeric: tabular-nums; }
    .box .slot { font-size: 9px; color: #676F7A; }
    .box .slot b { color: #1B552C; font-weight: 700; }

    /* 连升多级:同档合并成一行「×N」,档位再多也不会撑破 */
    .glist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 5px; }
    .gl { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px 0 5px; box-sizing: border-box;
      background: #FFFDF7; border: 1px solid #E7E1D4; border-radius: 9px; }
    .gl svg { width: 40px; height: 40px; flex: none; display: block; }
    .gl .t { font-family: "Noto Serif SC", serif; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .gl .d { font-size: 9px; color: #676F7A; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .gl .x { margin-left: auto; font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 700; color: #161B22; }
    .gl .x i { font-style: normal; font-size: 10px; color: #676F7A; margin-right: 1px; }
    .gnote { display: flex; gap: 5px; align-items: flex-start; font-size: 9px; line-height: 1.5; color: #676F7A; margin-top: auto; }
    .gnote b { color: #9B1E22; font-weight: 700; }
    .gnote svg { flex: none; margin-top: 2px; }

    .foot { flex: none; display: flex; justify-content: center; }
    .foot .pill { width: 240px; height: 36px; font-size: 14px; letter-spacing: 6px; }
  </style>
</helmet>
