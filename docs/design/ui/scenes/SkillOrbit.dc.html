<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; }
    sc-for, sc-if { display: contents; }
    a { color: #9B1E22; } a:hover { color: #7A3F5C; }
    .dev { position: relative; width: 932px; height: 430px; box-sizing: border-box;
      background: #F6F1E7; color: #161B22; overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    .stage { position: absolute; inset: 0; overflow: hidden; }
    .stage svg { width: 100%; height: 100%; display: block; }
    .veil { position: absolute; left: 0; right: 0; top: 0; height: 76px;
      background: linear-gradient(#F6F1E7 32%, rgba(246,241,231,0)); pointer-events: none; z-index: 10; }
    .guide { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
    .guide i { position: absolute; background: rgba(197,54,55,.20); }
    .guide .gl { left: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gr { right: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gb { left: 0; right: 0; bottom: 21px; height: 1px; }
    .guide u { position: absolute; font-size: 8px; font-style: normal; letter-spacing: .5px;
      color: rgba(155,30,34,.5); text-decoration: none; }
    .homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px;
      display: flex; justify-content: center; }
    .homebar > span { width: 128px; border-radius: 2px; background: rgba(22,27,34,.28); }
    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    .grow { flex: 1; }
    .tap { position: relative; }
    .tap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 44px; transform: translateY(-50%); }
    .top { position: absolute; left: 59px; right: 59px; top: 0; height: 36px;
      display: flex; align-items: center; gap: 10px; z-index: 20; }
    .top h1 { margin: 0; font-family: "Noto Serif SC", serif; font-size: 19px;
      font-weight: 600; letter-spacing: 3px; }
    .top .sub { font-size: 11px; color: #5D646F; letter-spacing: .5px; }
    .top .sub b { color: #161B22; font-weight: 700; }
    .ink { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 7px;
      background: rgba(239,234,223,.92); border: 1px solid #DED7C9; border-radius: 13px;
      font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .btn-back { height: 30px; padding: 0 14px; border: none; border-radius: 15px; cursor: pointer;
      background: #7A3F5C; color: #fff; font-family: inherit; font-size: 12px; letter-spacing: 1px; }
    .jump { position: absolute; left: 59px; bottom: 27px; display: flex; gap: 6px; z-index: 20; }
    .jump button { height: 32px; padding: 0 13px; border-radius: 16px; cursor: pointer;
      background: rgba(251,248,241,.94); border: 1px solid #DED7C9; color: #5D646F;
      font-family: inherit; font-size: 11.5px; letter-spacing: 1px;
      display: flex; align-items: center; gap: 6px; }
    .jump button.on { background: #161B22; border-color: #161B22; color: #F6F1E7; }
    .jump button .n { font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 12.5px; }
    .jump button .c { font-size: 9.5px; opacity: .72; font-variant-numeric: tabular-nums; }
    .jump .dot { width: 6px; height: 6px; border-radius: 50%; background: #C53637; }
    .mini { position: absolute; right: 59px; bottom: 27px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(251,248,241,.9); border: 1px solid #DED7C9;
      z-index: 20; overflow: hidden; }
    .mini svg { width: 100%; height: 100%; display: block; }
    .hint { position: absolute; right: 59px; bottom: 136px; font-size: 9.5px; color: #696151;
      letter-spacing: .4px; z-index: 20; text-align: right; line-height: 1.65; }
    .sheet { position: absolute; right: 0; top: 0; bottom: 0; width: 396px;
      background: #FBF8F1; border-left: 1px solid #DED7C9; z-index: 40;
      box-shadow: -14px 0 34px rgba(20,20,19,.10);
      display: flex; flex-direction: column; overflow: hidden; }
    .shead { padding: 13px 16px 12px; border-bottom: 1px solid #E7E1D4; position: relative;
      overflow: hidden; }
    .shead .wm { position: absolute; right: -8px; bottom: -30px;
      font-family: "Noto Serif SC", serif; font-size: 92px; font-weight: 600;
      line-height: 1; opacity: .14; }
    .shead > * { position: relative; }
    .spath { font-size: 9.5px; letter-spacing: 1px; }
    .sname { font-family: "Noto Serif SC", serif; font-size: 26px; font-weight: 600;
      letter-spacing: 4px; margin-top: 3px; line-height: 1.1; }
    .schips { position: absolute; right: 16px; top: 14px; display: flex; gap: 5px; }
    .schips span { height: 20px; padding: 0 9px; display: inline-flex; align-items: center;
      border-radius: 10px; font-size: 9.5px; letter-spacing: .5px;
      background: rgba(255,255,255,.68); }
    .sbody { flex: 1; padding: 13px 16px; display: flex; flex-direction: column; gap: 11px;
      min-height: 0; }
    .row { display: flex; align-items: baseline; gap: 8px; }
    .row .k { font-size: 9.5px; color: #676F7A; letter-spacing: 1px; width: 42px; flex: none; }
    .row .v { font-family: "Noto Serif SC", serif; font-size: 17px; font-weight: 600;
      color: #161B22; font-variant-numeric: tabular-nums; }
    .row .v em { font-style: normal; color: #696151; font-size: 14px; }
    .note { font-size: 10.5px; color: #5D646F; line-height: 1.75; letter-spacing: .2px; }
    .note b { color: #161B22; font-weight: 500; }
    .req { display: flex; gap: 7px; }
    .req .c { flex: 1; background: #FFFDF7; border: 1px solid #E7E1D4; border-radius: 8px;
      padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; }
    .req .c .k { font-size: 9px; color: #676F7A; letter-spacing: 1px; }
    .req .c .v { display: flex; align-items: center; gap: 4px;
      font-family: "Noto Serif SC", serif; font-size: 14.5px; font-weight: 600;
      font-variant-numeric: tabular-nums; }
    .req .c.ok .v { color: #1B552C; }
    .req .c.no .v { color: #7A3F5C; }
    .req .c .m { font-size: 8.5px; color: #696151; }
    .sfoot { flex: none; padding: 0 16px 14px; display: flex; gap: 7px; }
    .sbtn { flex: 1; height: 40px; border: none; border-radius: 9px; cursor: pointer;
      font-family: inherit; font-size: 13px; letter-spacing: 1px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; }
    .sbtn.no { background: #DAD7D0; color: #5D646F; cursor: not-allowed; }
    .sbtn.ghost { flex: none; width: 74px; background: transparent; color: #5D646F;
      border: 1px solid #DED7C9; }
  </style>
</helmet>
