<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; }
    sc-for, sc-if { display: contents; }
    a { color: #9B1E22; } a:hover { color: #7A3F5C; }
    /* iPhone 16 Pro Max 横屏 932×430pt。安全区 左右 59 / 下 21（Home Indicator）。
       Unity 逻辑单位换算 ×2.093（CanvasScaler 1600×900 按高匹配 → 实际画布 1950×900）。 */
    .dev {
      position: relative; width: 932px; height: 430px; box-sizing: border-box;
      background: #F6F1E7; color: #161B22; overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .safe {
      position: absolute; left: 59px; right: 59px; top: 0; bottom: 21px;
      display: flex; flex-direction: column;
    }
    .guide { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
    .guide i { position: absolute; background: rgba(197,54,55,.20); }
    .guide .gl { left: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gr { right: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gb { left: 0; right: 0; bottom: 21px; height: 1px; }
    .homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px; display: flex; justify-content: center; }
    .homebar > span { width: 128px; border-radius: 2px; background: rgba(22,27,34,.28); }

    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    .grow { flex: 1; }

    .e-Metal { --el: #B3A382; --elSoft: #EEE3CF; --elFg: #64532C; --glyph: #6B6449; }
    .e-Wood  { --el: #348F4F; --elSoft: #CCE6D0; --elFg: #185C2E; --glyph: #1F6333; }
    .e-Water { --el: #0F74C4; --elSoft: #C8E1FB; --elFg: #0E4F86; --glyph: #0A5E9E; }
    .e-Fire  { --el: #C53637; --elSoft: #FED2CE; --elFg: #862726; --glyph: #B02D2E; }
    .e-Earth { --el: #997C3C; --elSoft: #ECDCBD; --elFg: #634800; --glyph: #82552A; }
    .e-Heart { --el: #9750A7; --elSoft: #ECD5F1; --elFg: #67366D; --glyph: #7E4190; }
    .e-None  { --el: #4F5661; --elSoft: #DAD7D0; --elFg: #5D646F; --glyph: #161B22; }

    .r-White  { --rar: #A19E98; --rarSoft: #EDEAE3; }
    .r-Green  { --rar: #2E9E52; --rarSoft: #E2F2E7; }
    .r-Blue   { --rar: #0F74C4; --rarSoft: #DEEAF7; }
    .r-Purple { --rar: #7945AB; --rarSoft: #EBE2F5; }
    .r-Gold   { --rar: #C9A94A; --rarSoft: #F6EDD5; }
    .r-Orange { --rar: #E1791B; --rarSoft: #FAE7D3; }
    .r-Red    { --rar: #CD262E; --rarSoft: #F9DFDF; }

    /* 字牌（与 Main / Battle 同一套） */
    .tile {
      width: 62px; height: 78px; border-radius: 7px; box-sizing: border-box;
      border: 2px solid var(--rar); background: var(--rarSoft);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    }
    .tile .g { font-family: "Noto Serif SC", serif; font-size: 28px; font-weight: 600; color: var(--glyph); line-height: 1; }
    .tile .py { font-size: 8px; color: #88909C; letter-spacing: .5px; }
    .tile.sel { border-color: #161B22; box-shadow: 0 0 0 2px rgba(22,27,34,.18); }
    .tile.dim { opacity: .42; }

    /* 通用件 */
    .pill {
      height: 40px; padding: 0 22px; border: none; border-radius: 20px; cursor: pointer;
      font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; letter-spacing: 2px;
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
    }
    .pill.cinnabar { background: #C53637; color: #fff; box-shadow: 0 3px 10px rgba(155,30,34,.26); }
    .pill.ink { background: #3D4E69; color: #fff; }
    .pill.jade { background: #2E7D46; color: #fff; }
    .pill.quiet { background: #E4DDCE; color: #2C333D; }
    .chip { height: 18px; padding: 0 8px; display: inline-flex; align-items: center;
      border-radius: 9px; font-size: 9.5px; letter-spacing: .5px; white-space: nowrap; }
    .ingot { display: inline-flex; align-items: center; gap: 5px;
      font-weight: 700; font-variant-numeric: tabular-nums; }
    .card { background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 12px; box-sizing: border-box; }
    .scrim { position: absolute; inset: 0; background: rgba(22,27,34,.55); }
    .k { font-size: 8px; color: #B3AB9B; letter-spacing: .3px; font-variant-numeric: tabular-nums; }

    .dev { background: #F2ECDF; }
    .safe { padding-top: 6px; }
    .top { height: 26px; flex: none; display: flex; align-items: center; gap: 9px; font-size: 10px; color: #5D646F; }
    .top .seg { font-family: "Noto Serif SC", serif; font-size: 13px; font-weight: 600; color: #161B22; letter-spacing: 2px; }
    /* 垂直居中：奇遇没有战场要让位，整块内容居中才不会上半屏挤、下半屏空 */
    .body { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 0; padding-bottom: 10px; }
    /* 阅读顺序是硬要求：标题 → 正文 → 选项 → 说明。
       BattleView 2026-08-20 把正文从屏底搬回战场那一排，就是因为放屏底会变成
       「先看见三个按钮，再把视线甩到屏幕最底边才读得到自己在选什么」。 */
    .h { font-family: "Noto Serif SC", serif; font-size: 19px; font-weight: 600; letter-spacing: 3px; margin-top: 6px; }
    .text { max-width: 560px; margin-top: 8px; font-size: 12px; line-height: 1.65; color: #5D646F; text-align: center; }
    .opts { display: flex; gap: 12px; margin-top: 14px; }
    /* 钮上**只放名称**：钮宽 260 逻辑单位 / 字号 22 只装得下 23 个半宽，
       把效果写进 label 会溢出到钮外被邻钮盖掉（EventLabelWidthTests 钉着这条）。 */
    .opt {
      width: 124px; height: 44px; border-radius: 22px; border: 1.5px solid #DED7C9; cursor: pointer;
      background: #FBF8F1; font-family: "Noto Serif SC", serif;
      /* 2026-09-01 回填：此前写的是 14px（≈29 逻辑单位），与上面注释和
         EventLabelWidthTests 钉死的「字号 22」自相矛盾——实现按测试口径保留了 22。
         按 1pt=2.093 换算，22 ÷ 2.093 ≈ 10.5px。改这个数要连带改测试。 */
      font-size: 10.5px; font-weight: 600;
      color: #2C333D; letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
    }
    .opt.on { background: #C53637; border-color: #C53637; color: #fff; box-shadow: 0 3px 10px rgba(155,30,34,.24); }
    .opt.off { opacity: .4; }
    /* 效果说明只在选中时才出现，且在屏幕最底部的提示行 —— 与战斗屏同一条提示带 */
    .say { height: 26px; flex: none; display: flex; align-items: center; justify-content: center; gap: 9px;
      font-size: 11px; color: #2C333D; }
    .say .lb { font-family: "Noto Serif SC", serif; font-weight: 600; }
    .say .again { color: #9B1E22; font-weight: 700; font-size: 10px; }
    .pool { display: flex; align-items: center; gap: 8px; margin-top: 13px; }
    .pool .lbl { font-size: 8.5px; color: #88909C; letter-spacing: 2px; writing-mode: vertical-rl; height: 54px; }
    .tile.sm { width: 46px; height: 58px; }
    .tile.sm .g { font-size: 21px; }
    .tile.sm .py { font-size: 7px; }
  </style>
</helmet>

<div class="dev">
  <div class="safe">
    <div class="top">
      <span class="seg">「文山」第 26~30 层</span>
      <span>第 27 层</span>
      <span class="grow"></span>
      <span class="ingot"><svg width="15" height="9" viewBox="0 0 56 34" aria-hidden="true"><path d="M8 0 H48 L56 17 L48 34 H8 L0 17 Z" fill="#1A1F2B"></path><path d="M14 8 H42 L47 17 L42 26 H14 L9 17 Z" fill="none" stroke="#9D7B2A" stroke-width="2.5"></path></svg> 340</span>
      <span>字库 7 / 9</span>
    </div>

    <div class="body">
      <div class="h">奇遇 · 字摊</div>
      <div class="text">路旁小摊，摊主捻须：『以物易物，童叟无欺。』</div>

      <div class="opts">
        <button class="opt on">以物易字</button>
        <button class="opt">白讨一字</button>
        <button class="opt">只看不换</button>
      </div>

      <div class="pool">
        <span class="lbl">部件池</span>
        <div class="tile sm r-White e-Metal sel"><span class="g">刂</span><span class="py">dāo</span></div>
        <div class="tile sm r-White e-Wood"><span class="g">木</span><span class="py">mù</span></div>
        <div class="tile sm r-White e-Water"><span class="g">氵</span><span class="py">shuǐ</span></div>
        <div class="tile sm r-White e-Fire"><span class="g">火</span><span class="py">huǒ</span></div>
        <div class="tile sm r-White e-Earth"><span class="g">土</span><span class="py">tǔ</span></div>
      </div>
    </div>

    <div class="say">
      <span class="lb">以物易字</span>
      <span>＝ 舍 1 部件，3 叠字任选一（鑫 / 森 / 淼 / 焱 / 垚）</span>
      <span class="again">｜再点一次确认</span>
    </div>
  </div>

  <div class="guide"><i class="gl"></i><i class="gr"></i><i class="gb"></i></div>
  <div class="homebar"><span></span></div>
</div>

</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 932, "height": 430}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
