<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>领取里程碑</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;600;700&amp;display=swap">
<style>
body { margin: 0; }
sc-for, sc-if { display: contents; }
a { color: #9B1E22; } a:hover { color: #7A3F5C; }
.dev { position: relative; width: 932px; height: 430px; box-sizing: border-box; background: #F6F1E7; color: #161B22; overflow: hidden; font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.serif { font-family: "Noto Serif SC", "Songti SC", serif; }
.homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px; display: flex; justify-content: center; z-index: 60; }
.homebar > span { width: 128px; border-radius: 2px; background: rgba(255,255,255,.4); }
.e-Metal { --el: #B3A381; --elSoft: #EEE3CF; --glyph: #6B6449; --elName: "金"; }
.e-Wood { --el: #348F4F; --elSoft: #CCE6D0; --glyph: #1F6333; }
.e-Water { --el: #0F74C5; --elSoft: #C8E1FB; --glyph: #0A5E9E; }
.e-Fire { --el: #C53637; --elSoft: #FED2CE; --glyph: #B02D2E; }
.e-Earth { --el: #8F7332; --elSoft: #ECDCBD; --glyph: #82552A; }
/* 背景:角色页轮廓 */
.bg { position: absolute; left: 59px; right: 59px; top: 46px; bottom: 29px; display: flex; gap: 10px; }
.bg div { background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 10px; }
.scrim { position: absolute; inset: 0; background: rgba(22,27,34,.55); z-index: 50; }

.pop { position: absolute; left: 166px; top: 26px; width: 600px; height: 356px; box-sizing: border-box; background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 11px; padding: 14px 20px 14px; box-shadow: 0 12px 38px rgba(22,27,34,.42); display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 51; }
.x { position: absolute; right: 8px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; font-size: 20px; color: #5D646F; cursor: pointer; }
.kick { display: flex; align-items: center; gap: 10px; font-family: "Noto Serif SC", serif; font-size: 12px; font-weight: 600; letter-spacing: 8px; color: #8A6600; }
.kick::before, .kick::after { content: ""; width: 34px; height: 1px; background: #DED7C9; }
.lv { font-family: "Noto Serif SC", serif; font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.lv i { font-style: normal; font-size: 15px; font-weight: 600; color: #5D646F; margin-right: 2px; }
.inkline { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px; border-radius: 14px; background: #EFEADF; border: 1px solid #DED7C9; font-size: 11px; color: #5D646F; }
.inkline b { font-size: 14px; color: #161B22; font-variant-numeric: tabular-nums; }
.inkline .ok { font-size: 9.5px; color: #1B552C; font-weight: 700; }
.sec { width: 100%; display: flex; align-items: center; gap: 6px; }
.sec b { font-family: "Noto Serif SC", serif; font-size: 11px; font-weight: 600; color: #2C333D; }
.sec span { font-size: 9px; color: #676F7A; white-space: nowrap; }
.sec .rule { flex: 1; height: 1px; background: #EDE7DA; }
.picks { display: flex; gap: 18px; justify-content: center; }
/* 候选牌:0.8 竖版,金字 2pt 牌框。选中 = ring-selected;没选之前「收下」不可点 */
.cand { position: relative; width: 104px; height: 130px; box-sizing: border-box; border-radius: 10px; background: #FFFDF7; border: 2px solid #C9A94A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: inherit; color: inherit; padding: 0; }
.cand.on { box-shadow: 0 0 0 3px #FBF8F1, 0 0 0 5px #3D4E69; transform: translateY(-3px); }
.cand .g { font-family: "Noto Serif SC", serif; font-size: 50px; font-weight: 700; line-height: 1.05; color: var(--glyph); }
.cand .py { font-size: 9px; color: #676F7A; letter-spacing: 1px; }
.cand .el { position: absolute; left: 6px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--glyph); color: #fff; font-family: "Noto Serif SC", serif; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.cand .tag { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); height: 17px; padding: 0 8px; border-radius: 9px; font-size: 9px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; }
.tag.new { background: #F6EDD5; color: #8A6600; border: 1px solid rgba(201,169,74,.6); }
.tag.dup { background: #EFEADF; color: #5D646F; border: 1px solid #DED7C9; }
.foot { margin-top: auto; width: 100%; display: flex; align-items: center; gap: 12px; }
.foot .note { flex: 1; font-size: 9px; color: #676F7A; line-height: 1.5; }
.pill { position: relative; height: 40px; width: 150px; border: none; border-radius: 20px; cursor: pointer; font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; letter-spacing: 2px; }
.pill.cin { background: #C53637; color: #fff; box-shadow: 0 3px 10px rgba(155,30,34,.26); }
.pill.off { background: #DAD7D0; color: #676F7A; box-shadow: none; cursor: default; }
</style>
</helmet>
<div class="dev">
<div class="bg"><div style="width: 200px"></div><div style="flex: 1"></div></div>
<div class="scrim"></div>
<div class="pop">
<button class="x" aria-label="关闭">×</button>
<div class="kick serif">里 程 碑</div>
<div class="lv"><i>Lv.</i>20</div>
<div class="inkline">
<svg width="18" height="11" viewBox="0 0 56 34" aria-hidden="true"><path d="M8 0 H48 L56 17 L48 34 H8 L0 17 Z" fill="#1A1F2B"></path><path d="M14 8 H42 L47 17 L42 26 H14 L9 17 Z" fill="none" stroke="#9D7B2A" stroke-width="2.5"></path></svg>
墨锭 <b>+1,200</b>
</div>
<div class="sec"><b>金字 · 3 选 1</b><span>挑一张收下,另两张不再出现</span><span class="rule"></span></div>
<div class="picks">
<sc-for list="{{ cands }}" as="c" hint-placeholder-count="3">
<button class="{{ c.cls }}" onClick="{{ c.pick }}">
<span class="el">{{ c.elc }}</span>
<span class="g">{{ c.g }}</span>
<span class="py">{{ c.py }}</span>
<span class="{{ c.tagCls }}">{{ c.tag }}</span>
</button>
</sc-for>
</div>
<div class="foot">
<div class="note">候选在第一次打开时就定了,关掉再进还是这三张。<br>已拥有的字照样能选,算一张重复卡,留作升级材料。</div>
<button class="{{ okCls }}">收下</button>
</div>
</div>
<div class="homebar"><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":932,"height":430}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 1 }; }
  renderVals() {
    const sel = this.state.sel;
    const raw = [['炎', 'yán', 'Fire', '火', true], ['林', 'lín', 'Wood', '木', false], ['圭', 'guī', 'Earth', '土', false]];
    const cands = raw.map(([g, py, el, elc, owned], i) => ({
      g, py, elc,
      cls: 'cand e-' + el + (sel === i ? ' on' : ''),
      tagCls: 'tag ' + (owned ? 'dup' : 'new'),
      tag: owned ? '已有 · 重复卡 +1' : '新字',
      pick: () => this.setState({ sel: i })
    }));
    return { cands, okCls: 'pill ' + (sel === null ? 'off' : 'cin') };
  }
}
</script>
</body>
</html>
