<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="w_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"></feGaussianBlur>
    </filter>
  </defs>
  <!-- 墨滴:上尖下圆,将落未落 -->
  <path d="M64 8 C 64 8 82 40 82 54 C 82 66 74 74 64 74 C 54 74 46 66 46 54 C 46 40 64 8 64 8 Z"
        fill="#111622" fill-opacity="0.8"></path>
  <!-- 涟漪:墨遇水化开,外圈更淡更虚 -->
