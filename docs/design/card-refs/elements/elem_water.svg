    <path d="M30 96 C 44 86 84 86 98 96" stroke-width="6" stroke-opacity="0.5"></path>
    <path d="M16 112 C 36 98 92 98 112 112" stroke-width="5" stroke-opacity="0.28"></path>
    <path d="M8 124 C 32 108 96 108 120 124" stroke-width="4" stroke-opacity="0.15"></path>
  </g>
</svg>
