<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}

.stage { position: relative; width: 932px; height: 430px; overflow: hidden; line-height: 1.3; }
.stage * { box-sizing: border-box; }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 50; }
/* Ui.Sheet:卡 1256×745 → 600.10×355.95,屏幕正中;圆角 18、描边 1.5 PanelBorder、面 PanelPaper;没有投影 */
.sheet { position: absolute; z-index: 51; left: 50%; top: 50%; width: 600.1px; height: 355.95px; transform: translate(-50%, -50%);
  background: var(--panel-paper); border: 0.72px solid var(--panel-border); border-radius: 8.6px;
  display: flex; flex-direction: column; align-items: stretch; color: var(--text-main); }
.sheet .c { text-align: center; white-space: nowrap; }
.serif { font-family: var(--font-serif); font-weight: 600; }
.stage .homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px; display: flex; justify-content: center; z-index: 60; }
.stage .homebar > span { width: 128px; border-radius: 2px; background: rgba(255,255,255,.4); }
.ingot { display: flex; align-items: center; justify-content: center; gap: 2.87px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ingot i { display: block; background: var(--ingot-dark); clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%); }
.chip { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; border-radius: 6.69px; flex: none; }

/* 底屏:安全层(示意轮廓)—— 弹窗挂在安全层 / 登塔结算的 view 根上,遮罩盖满整屏 */
.under { position: absolute; inset: 0; background: color-mix(in srgb, var(--band-wenshan) 16%, var(--paper)); }
.under .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font-serif);
  font-weight: 600; font-size: 240px; line-height: 1; color: var(--band-wenshan); opacity: .10; }
.under .card { position: absolute; left: 50%; top: 50%; width: 640.23px; height: 296.23px; transform: translate(-50%, -50%);
  background: var(--panel-paper); border: 0.96px solid var(--panel-border); border-radius: 11.94px; }
.under .card i { position: absolute; height: 40.13px; width: 286.67px; bottom: 71.67px; border-radius: 11.47px; }
/* 内容:Sheet 的 VStack,内边距 38/38/29/29、行距 21、子项横向撑满(childForceExpandWidth) */
.lu { flex: 1; padding: 13.86px 18.16px; display: flex; flex-direction: column; gap: 10.03px; }
.lu .kick { font-size: 11.94px; color: var(--cinnabar-dark); }
.lu .lvr { font-size: 23.89px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.lu .cols { flex: 1; min-height: 0; display: flex; gap: 13.86px; }
.lu .st { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4.78px; }
.lu .h { font-family: var(--font-serif); font-weight: 600; font-size: 10.03px; color: var(--text-dim); white-space: nowrap; }
/* StatRow:高 50、间距 15;名 20 定宽 105 / 「旧 → 新」27 宋体弹性 / 增量 20 靠右。没有底色 */
.lu .sr { height: 23.89px; display: flex; align-items: center; gap: 7.17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lu .sr .k { width: 50.17px; font-size: 9.56px; color: var(--text-dim); }
.lu .sr .v { flex: 1; font-family: var(--font-serif); font-weight: 600; font-size: 12.9px; }
.lu .sr .d { font-size: 9.56px; color: var(--upgrade-text); }
.lu .ch { width: 217.87px; flex: none; display: flex; flex-direction: column; gap: 4.78px; }
.lu .crow { display: flex; align-items: center; gap: 5.73px; }
.lu .crow img { width: 40.13px; height: 40.13px; display: block; }
.lu .ok { height: 40.13px; border-radius: 11.47px; font-size: 14.81px; background: var(--cinnabar); color: #fff; width: 160.06px; align-self: center; }

</style></head><body>
