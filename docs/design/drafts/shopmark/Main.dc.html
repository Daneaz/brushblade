<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>商城 · 推荐标记</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#9B1E22}a:hover{color:#7A3F5C}
sc-for,sc-if{display:contents}
.r-White{--rar:#A19E98;--rarSoft:#EDEAE3}
.r-Green{--rar:#2E9E52;--rarSoft:#E2F2E7}
.r-Blue{--rar:#0F74C4;--rarSoft:#DEEAF7}
.r-Purple{--rar:#7945AB;--rarSoft:#EBE2F5}
.r-Gold{--rar:#C9A94A;--rarSoft:#F6EDD5}
.r-Orange{--rar:#E1791B;--rarSoft:#FAE7D3}
.r-Red{--rar:#CD262E;--rarSoft:#F9DFDF}
.e-Fire{--glyph:#B02D2E}.e-Wood{--glyph:#1F6333}.e-Water{--glyph:#0A5E9E}.e-Earth{--glyph:#82552A}.e-Metal{--glyph:#6B6449}
.serif{font-family:"Noto Serif SC","Songti SC",serif}
.card{position:relative;width:69px;height:86px;box-sizing:border-box;border-radius:6px;background:#FFFDF7;border:1.5px solid var(--rar);box-shadow:0 1px 3px rgba(22,27,34,.10);display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .g{font-family:"Noto Serif SC",serif;font-size:30px;font-weight:600;line-height:1;color:var(--glyph)}
.card .p{font-size:7px;color:#5D646F;margin-top:3px;letter-spacing:.5px}
.card .lv{position:absolute;top:3px;left:3px;height:10px;padding:0 3px;border-radius:5px;background:#EFEADF;color:#2C333D;font-size:6.5px;font-weight:700;display:flex;align-items:center}
.card .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--rar)}
.card .qty{position:absolute;bottom:3px;right:3px;height:10px;padding:0 3px;border-radius:5px;background:#11161F;color:#fff;font-size:6.5px;font-weight:700;display:flex;align-items:center}
.card .tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);height:12px;padding:0 4px;border-radius:2px;background:#B3282D;color:#fff;font-family:"Noto Serif SC",serif;font-size:8px;font-weight:700;display:flex;align-items:center;box-shadow:0 0 0 1.5px #F6F1E7;white-space:nowrap}
.card.sold{filter:grayscale(.8);opacity:.55}
.card .seal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#C53637;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-family:"Noto Serif SC",serif}
.foot{width:69px;display:flex;align-items:center;gap:3px;font-size:6.5px;color:#5D646F;font-variant-numeric:tabular-nums}
.foot .bar{flex:1;height:3px;border-radius:2px;background:#E4DDCE;overflow:hidden}
.foot .bar i{display:block;height:100%;background:#2E9E52}
.fc{width:69px;font-size:6.5px;color:#5D646F;text-align:center;white-space:nowrap}
.btn{width:69px;height:22px;box-sizing:border-box;border:none;border-radius:7px;background:#11161F;color:#fff;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0}
.btn b{font-size:10px}
.btn s{font-size:7px;color:rgba(255,255,255,.6)}
.btn.poor{background:#E7E1D4;color:#8A2A2A;font-size:8px}
.btn.sold{background:#E9E5DB;color:#696151;font-size:8px;letter-spacing:1px}
.btn.ad{background:#E3F4E6;color:#1B552C;border:1px solid #A9CDB2;font-size:8px}
.locked{width:69px;height:86px;box-sizing:border-box;border-radius:6px;border:1.5px dashed #CFC6B4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#696151;font-size:7.5px}
.locked.next{border:1.5px solid #C9A94A;color:#7A5E12}
</style>
</helmet>
<div style="position: relative; width: 932px; height: 430px; overflow: hidden; background: #F6F1E7; color: #161B22; font-family: &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, system-ui, sans-serif">
<div style="position: absolute; left: 59px; right: 59px; top: 0; bottom: 21px; display: flex; flex-direction: column">

<div style="height: 38px; flex: none; display: flex; align-items: center; gap: 10px">
<h1 class="serif" style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 3px">商城</h1>
<span style="font-size: 11px; color: #5D646F">距刷新 <b style="color: #161B22">07:42:19</b></span>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 7px; background: #EFEADF; border: 1px solid #DED7C9; border-radius: 13px; font-size: 12px; font-weight: 700">
<svg width="18" height="11" viewBox="0 0 56 34" aria-hidden="true"><path d="M8 0 H48 L56 17 L48 34 H8 L0 17 Z" fill="#1A1F2B"></path></svg>
3,260
</div>
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 15px; background: #7A3F5C; color: #fff; font-family: inherit; font-size: 12px; letter-spacing: 1px">返回</button>
</div>

<div style="flex: 1; display: flex; gap: 9px; min-height: 0">

<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px">
<span class="serif" style="font-size: 13px; font-weight: 600; letter-spacing: 3px">今日字摊</span>
<span style="font-size: 9px; color: #5D646F">每格今日各自打折 · 一份按稀有度打包</span>
<span style="flex: 1; height: 1px; background: #E4DDCE"></span>
</div>

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 10px; column-gap: 10px; padding-top: 6px; justify-items: center">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<sc-if value="{{s.isLocked}}" hint-placeholder-val="{{false}}">
<div class="{{s.lockCls}}"><span>Lv.{{s.unlock}}</span><span>解锁</span></div>
<div style="height: 41px"></div>
</sc-if>
<sc-if value="{{s.isCard}}" hint-placeholder-val="{{true}}">
<div class="{{s.cls}}">
<sc-if value="{{s.showTag}}" hint-placeholder-val="{{true}}"><span class="tag">{{s.zhe}}折</span></sc-if>
<span class="lv">Lv.{{s.lv}}</span><span class="dot"></span>
<span class="g">{{s.glyph}}</span><span class="p">{{s.py}}</span>
<span class="qty">{{s.qty}}张</span>
<sc-if value="{{s.sold}}" hint-placeholder-val="{{false}}"><span class="seal">{{s.sealText}}</span></sc-if>
</div>
<div class="foot"><div class="bar"><i style="width: {{s.pct}}"></i></div><span>{{s.have}}/{{s.need}}</span></div>
<div class="fc">{{s.fc}}</div>
<sc-if value="{{s.isBuy}}" hint-placeholder-val="{{true}}">
<button class="btn"><svg width="10" height="6" viewBox="0 0 56 34" aria-hidden="true"><path d="M8 0 H48 L56 17 L48 34 H8 L0 17 Z" fill="#fff" opacity=".85"></path></svg><b>{{s.price}}</b><s>{{s.orig}}</s></button>
</sc-if>
<sc-if value="{{s.isPoor}}" hint-placeholder-val="{{false}}"><button class="btn poor">还差 {{s.short}}</button></sc-if>
<sc-if value="{{s.isSold}}" hint-placeholder-val="{{false}}"><button class="btn sold">{{s.soldText}}</button></sc-if>
<sc-if value="{{s.isAd}}" hint-placeholder-val="{{false}}"><button class="btn ad">看广告领取</button></sc-if>
</sc-if>
</div>
</sc-for>
</div>

<div style="flex: 1"></div>
<div style="flex: none; height: 44px; border-radius: 10px; padding: 0 14px; background: #1A1F2B; display: flex; align-items: center; gap: 12px; color: #F3EEE2">
<span class="serif" style="font-size: 14px; font-weight: 600; letter-spacing: 3px; color: #E3C976">笔墨月供</span>
<span style="font-size: 9.5px; color: rgba(243,238,226,.75)">[订阅权益待定] · 不卖字、不卖强度、不卖抽卡</span>
</div>
</div>

<div style="width: 252px; flex: none; display: flex; flex-direction: column; gap: 6px; background: #FBF8F1; border: 1px solid #DED7C9; border-radius: 10px; padding: 0 10px 10px; box-sizing: border-box">
<div style="height: 26px; display: flex; align-items: center">
<span class="serif" style="font-size: 13px; font-weight: 600; letter-spacing: 3px">今日补给</span>
</div>

<div style="position: relative; background: #FFFDF7; border: 1px solid #DED7C9; border-radius: 8px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="position: absolute; top: -1px; right: 10px; height: 18px; padding: 0 6px; border-radius: 0 0 3px 3px; background: #B3282D; color: #fff; display: flex; align-items: center; font-family: &quot;Noto Serif SC&quot;, serif; font-size: 10px; font-weight: 700">6折</span>
<div style="width: 46px; height: 38px; border-radius: 6px; background: #EBE2F5; border: 1px solid #7945AB; display: flex; align-items: center; justify-content: center; font-size: 7px; color: #4D2A70">[紫檀匣立绘]</div>
<span class="serif" style="font-size: 12px; font-weight: 600; letter-spacing: 1px">紫檀匣</span>
<div style="display: flex; gap: 4px">
<span style="height: 16px; padding: 0 6px; border-radius: 8px; background: #EFEADF; display: flex; align-items: center; font-size: 8.5px; color: #2C333D"><b style="margin-right: 3px">5 捆</b><span style="color: #5D646F">约 40 张</span></span>
<span style="height: 16px; padding: 0 6px; border-radius: 8px; background: #EFEADF; display: flex; align-items: center; font-size: 8.5px; color: #5D646F">4 小时</span>
</div>
<button class="btn" style="width: 100%; height: 22px"><svg width="10" height="6" viewBox="0 0 56 34" aria-hidden="true"><path d="M8 0 H48 L56 17 L48 34 H8 L0 17 Z" fill="#fff" opacity=".85"></path></svg><b>708</b><s>1180</s></button>
</div>

<span style="font-size: 9px; color: #696151; margin-top: 2px">免费补给</span>
<div style="display: flex; align-items: center; gap: 8px; background: #FFFDF7; border: 1px solid #DED7C9; border-radius: 8px; padding: 6px 8px">
<div style="flex: 1; font-size: 10px"><b class="serif">看广告领墨锭</b><div style="font-size: 8.5px; color: #5D646F">今日 +120</div></div>
<button class="btn ad" style="width: 64px">领 取</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; background: #FFFDF7; border: 1px solid #DED7C9; border-radius: 8px; padding: 6px 8px">
<div style="flex: 1; font-size: 10px"><b class="serif">看广告刷新</b><div style="font-size: 8.5px; color: #5D646F">重掷货架与折扣</div></div>
<button class="btn ad" style="width: 64px">刷 新</button>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":932,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (o) => {
      const sold = !!o.sold;
      const ad = !!o.ad;
      const poor = !!o.poor;
      return Object.assign({
        isCard: true, isLocked: false, lockCls: '', unlock: 0,
        cls: 'card r-' + o.r + ' e-' + o.e + (sold ? ' sold' : ''),
        showTag: !sold && !ad,
        sold: sold, sealText: ad ? '已领' : '已售',
        isBuy: !sold && !ad && !poor, isPoor: !sold && poor, isSold: sold, isAd: ad && !sold,
        soldText: ad ? '今日已领' : '今日已购',
        pct: Math.min(100, Math.round(o.have / o.need * 100)) + '%',
        fc: '买下后 ' + (o.have + o.qty) + '/' + o.need + ' 张',
        short: 0, zhe: 0, price: 0, orig: 0
      }, o);
    };
    const lock = (lv, next) => ({ isCard: false, isLocked: true, unlock: lv, lockCls: next ? 'locked next' : 'locked' });
    return {
      slots: [
        card({ glyph: '藤', py: 'téng', r: 'Green', e: 'Wood', lv: 4, qty: 10, have: 6, need: 20, ad: true }),
        card({ glyph: '箭', py: 'jiàn', r: 'Blue', e: 'Wood', lv: 2, qty: 5, have: 3, need: 4, ad: true }),
        card({ glyph: '燥', py: 'zào', r: 'Purple', e: 'Fire', lv: 1, qty: 1, have: 0, need: 1, ad: true, sold: true }),
        card({ glyph: '热', py: 'rè', r: 'White', e: 'Fire', lv: 6, qty: 20, have: 22, need: 80, zhe: 5, price: 100, orig: 200 }),
        card({ glyph: '爆', py: 'bào', r: 'Green', e: 'Fire', lv: 5, qty: 10, have: 9, need: 28, zhe: 3, price: 72, orig: 240 }),
        card({ glyph: '炸', py: 'zhà', r: 'Blue', e: 'Fire', lv: 3, qty: 5, have: 1, need: 2, zhe: 7, price: 175, orig: 250 }),
        card({ glyph: '灿', py: 'càn', r: 'Gold', e: 'Fire', lv: 1, qty: 1, have: 0, need: 1, zhe: 6, price: 156, orig: 260, sold: true }),
        card({ glyph: '焚', py: 'fén', r: 'Orange', e: 'Fire', lv: 1, qty: 1, have: 0, need: 1, zhe: 8, price: 320, orig: 400 }),
        card({ glyph: '燚', py: 'yì', r: 'Red', e: 'Fire', lv: 1, qty: 1, have: 0, need: 1, zhe: 7, price: 420, orig: 600 }),
        lock(25, true), lock(35, false), lock(45, false)
      ]
    };
  }
}
</script>
</body>
</html>
