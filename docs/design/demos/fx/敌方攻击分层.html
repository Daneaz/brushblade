<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>字斗 · 敌方攻击分层</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局:顶部说明 + 控制条;九格舞台(3 列):杂兵两格作底 → 首领普攻 → 蓄力预警 → 四个大招 → 坚壁 */
:root {
  --bg: #F3EFE6;
  --fg: #11161F;
  --muted: #5C6371;
  --line: #D9D2C3;
  --card: #FBF8F1;
  --accent: #9E2B25;
  --accent-soft: #F6E1DE;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
    --accent: #E57B70; --accent-soft: #3A1E1C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
  --accent: #E57B70; --accent-soft: #3A1E1C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 74ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .toggle { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0; }
.tag { font-size: 12px; border-radius: 99px; padding: 1px 9px; white-space: nowrap; color: var(--accent); background: var(--accent-soft); }
.tag.base { color: var(--muted); background: transparent; border: 1px solid var(--line); }
.desc { margin: 0; font-size: 13px; color: var(--muted); }
.replay { justify-self: start; font-size: 13px; padding: 4px 12px; }

.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 20%, #FBF7EE 0%, #F6F1E7 55%, #E9E1D0 100%); container-type: inline-size; }
.cam { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; }
.u { position: absolute; transform: translate(-50%, -50%); }
.mob, .boss { aspect-ratio: 1; }
.mob { width: 15%; }
.boss { width: 30%; }
.mob img, .boss img, .ally img { position: absolute; inset: 0; width: 100%; height: 100%; }
.nm { position: absolute; left: 50%; bottom: -8%; transform: translateX(-50%); font-family: var(--font-display);
  font-size: 10px; color: #11161F; background: rgba(246,241,231,.85); padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.ally { width: 13%; aspect-ratio: 1; }
.ally .disc { position: absolute; inset: 0; border-radius: 50%; background: #CCE6D0; box-shadow: inset 0 0 0 2px rgba(31,99,51,.35); }
.ally .nm { color: #1F6333; font-weight: 900; bottom: -18%; }
.player { width: 26%; height: 9%; border-radius: 8px; background: #FBF8F1; box-shadow: 0 0 0 1.5px #D9D2C3; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-family: var(--font-display); font-size: 2.6cqw; color: #11161F; }
.hp { flex: 1; height: 38%; background: #E9E1D0; border-radius: 99px; overflow: hidden; position: relative; }
.hp i { position: absolute; inset: 0; width: 78%; background: #C4442B; }
.shieldbar { position: absolute; left: 0; top: -40%; height: 26%; width: 46%; background: #3F7FB8; border-radius: 99px; }
.ap { display: flex; gap: 3px; }
.ap b { width: 7px; height: 7px; border-radius: 50%; background: #C9A94A; }
.fx { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; z-index: 5; }
.dim { position: absolute; inset: 0; background: #0B0E13; z-index: 8; pointer-events: none; opacity: 0; }
.bigglyph { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none;
  font-family: var(--font-display); font-weight: 900; font-size: 36cqw; line-height: 1; color: #1A0E0E;
  -webkit-text-stroke: .012em #B3242A; text-shadow: 0 0 .08em rgba(179,36,42,.8); opacity: 0; }
.vignette { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(179,36,42,.55) 100%); }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 4.4cqw;
  text-shadow: 0 1px 0 #fff, 0 0 5px rgba(255,255,255,.9); z-index: 10; pointer-events: none; white-space: nowrap; }
.pop.s { font-size: 3cqw; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 84ch; }
</style>

<div class="wrap">
  <header>
    <h1>字斗 · 敌方攻击分层</h1>
    <p class="lede">和我方同一套思路:杂兵保持现在的样子作底;首领普攻加前摇、墨色残影和命中顿帧;首领蓄力回合有预警;首领大招先压暗全屏、用墨红写出这一阶的字,再按技能演出。坚壁是被动,演在我方打它的时候。</p>
    <div class="controls">
      <button class="primary" id="play-all" type="button">全部播放</button>
      <label class="toggle" for="slow"><input type="checkbox" id="slow"> 慢放 ×0.3</label>
      <label class="toggle" for="loop"><input type="checkbox" id="loop" checked> 自动循环</label>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note">首领这一格用的是「刀山火海」的立绘(墨团 + 四个字 + 眼)。大招压暗后写的是这一阶的字;伤害数字是示意。</p>
</div>

let speed = 1;
const T = ms => ms / speed;
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const rnd = (a, b) => a + Math.random() * (b - a);
function anim(node, frames, ms, easing = "linear", delay = 0) {
  return node.animate(frames, { duration: T(ms), delay: T(delay), easing, fill: "both" }).finished.catch(() => {});
}
const EASE_IN = "cubic-bezier(.55,0,1,.45)", EASE_OUT = "cubic-bezier(0,.55,.45,1)";
const px = v => v + "px";
const tr = (x, y, w, h, extra = "") => `translate(${x - w / 2}px, ${y - h / 2}px) ${extra}`;
function el(st, css = {}, html = "", cls = "fx") {
  const d = document.createElement("div");
  d.className = cls; d.innerHTML = html; Object.assign(d.style, css);
  st.layer.appendChild(d);
  return d;
}
function at(st, node) {
  const s = st.layer.getBoundingClientRect(), r = node.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width, h: r.height };
}

// ---------- 舞台:上面敌阵(杂兵或首领 + 两侧随从),下面我方(两只召唤物 + 玩家条) ----------
const STAGES = [];
function buildStage(v) {
  const panel = document.createElement("section");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-head"><h3>${v.title}</h3><span class="tag${v.base ? " base" : ""}">${v.tag}</span></div>
    <div class="stage"><div class="cam"><div class="layer"></div></div></div>
    <p class="desc">${v.desc}</p>
    <button class="replay" type="button">重播</button>`;
  const layer = panel.querySelector(".layer"), cam = panel.querySelector(".cam");
  const boss = !v.base;
  let foe;
  if (boss) {
    foe = document.createElement("div");
    foe.className = "u boss"; foe.style.left = "50%"; foe.style.top = "26%";
    foe.innerHTML = ["bWisp", "bC0", "bC1", "bC2", "bC3", "bHalo", "bIris", "bEyes"].map(k => `<img src="${SRC[k]}" alt="" data-k="${k}">`).join("") + `<span class="nm">刀山火海 · 刀</span>`;
    const iris = foe.querySelector('[data-k="bIris"]'); iris.style.filter = "hue-rotate(0deg)";
    layer.appendChild(foe);
    for (const [x, id] of [[.2, "m1"], [.8, "m2"]]) {
      const d = document.createElement("div");
      d.className = "u mob"; d.style.left = x * 100 + "%"; d.style.top = "22%"; d.style.width = "11%";
      d.innerHTML = `<img src="${SRC[id + "b"]}" alt=""><img src="${SRC[id + "f"]}" alt="">`;
      layer.appendChild(d);
    }
  } else {
    foe = document.createElement("div");
    foe.className = "u mob"; foe.style.left = "50%"; foe.style.top = "26%";
    foe.innerHTML = `<img src="${SRC.m1b}" alt=""><img src="${SRC.m1f}" alt=""><span class="nm">${v.id === "mobRanged" ? "灯花 · 火" : "夯土妖"}</span>`;
    layer.appendChild(foe);
  }
  const allies = [["lin", "林", .36], ["zhe", "柘", .64]].map(([id, nm, x]) => {
    const d = document.createElement("div");
    d.className = "u ally"; d.style.left = x * 100 + "%"; d.style.top = "62%";
    d.innerHTML = `<div class="disc"></div><img src="${SRC[id + "L"]}" alt=""><img src="${SRC[id + "B"]}" alt=""><span class="nm">${nm}</span>`;
    layer.appendChild(d);
    return d;
  });
  const player = document.createElement("div");
  player.className = "u player"; player.style.left = "50%"; player.style.top = "88%";
  player.innerHTML = `<span>你</span><div class="hp"><i></i><div class="shieldbar"></div></div><div class="ap"><b></b><b></b><b></b></div>`;
  layer.appendChild(player);
  const st = { v, panel, layer, cam, foe, allies, player, busy: false };
  panel.querySelector(".replay").addEventListener("click", () => play(st));
  STAGES.push(st);
  return panel;
}

// ---------- 共用 ----------
function pop(st, p, text, color, small = false, dy = 0) {
  const d = document.createElement("div");
  d.className = "pop" + (small ? " s" : ""); d.textContent = text; d.style.color = color;
  d.style.left = px(p.x + p.w * .2); d.style.top = px(p.y - p.h * .5 + dy);
  st.layer.appendChild(d);
  anim(d, [{ transform: "translate(-50%,-50%) scale(.4)", opacity: 1 }, { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 },
    { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 }, { transform: "translate(-50%,-140%) scale(1)", opacity: 0 }], 820, "ease-out").then(() => d.remove());
}
function react(st, node, dir, heavy = 1) {
  anim(node, [{ transform: "translate(-50%,-50%)", filter: "brightness(1)" },
    { transform: `translate(calc(-50% + ${dir.x * 9 * heavy}px), calc(-50% + ${dir.y * 9 * heavy}px)) scale(1.05)`, filter: "brightness(1.8)", offset: .2 },
    { transform: `translate(calc(-50% - ${dir.x * 3}px), calc(-50% - ${dir.y * 3}px))`, filter: "brightness(1)", offset: .6 },
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" }], 320, "ease-out");
}
function shake(st, dir, amp, dur = 260) {
  anim(st.layer, [{ transform: "translate(0,0)" }, { transform: `translate(${dir.x * amp}px, ${dir.y * amp}px)` },
    { transform: `translate(${-dir.x * amp * .6}px, ${-dir.y * amp * .6}px)` }, { transform: `translate(${dir.x * amp * .25}px, ${dir.y * amp * .25}px)` },
    { transform: "translate(0,0)" }], dur);
}
function ring(st, p, color, size, width = 3, dur = 400, inward = false) {
  const r = el(st, { width: px(size), height: px(size), borderRadius: "50%", border: `${width}px solid ${color}` });
  return anim(r, [{ transform: tr(p.x, p.y, size, size, `scale(${inward ? 1 : .2})`), opacity: 1 },
    { transform: tr(p.x, p.y, size, size, `scale(${inward ? .3 : 1})`), opacity: 0 }], dur, EASE_OUT).then(() => r.remove());
}
function scatter(st, p, n, make, { dist = [30, 80], dur = 600, gravity = 0, spin = 0, up = false, angle = null, spread = Math.PI } = {}) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const [node, w, h] = make(i);
    const a = angle != null ? angle + rnd(-spread, spread) : up ? rnd(-Math.PI * .95, -Math.PI * .05) : rnd(0, Math.PI * 2), d = rnd(dist[0], dist[1]), r0 = rnd(0, 360);
    const frames = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6, x = p.x + Math.cos(a) * d * t, y = p.y + Math.sin(a) * d * t + gravity * t * t;
      frames.push({ transform: tr(x, y, w, h, `rotate(${r0 + spin * t}deg) scale(${1 - t * .4})`), opacity: 1 - t * t });
    }
    all.push(anim(node, frames, dur).then(() => node.remove()));
  }
  return Promise.all(all);
}
const blot = (st, sz, color = INK) => [el(st, { width: px(sz), height: px(sz), borderRadius: "50% 45% 55% 50%", background: color }), sz, sz];
function slashEl(st, size, color) {
  return el(st, { width: px(size), height: px(size), background: color,
    WebkitMaskImage: `url(${SRC.slash})`, maskImage: `url(${SRC.slash})`, WebkitMaskSize: "contain", maskSize: "contain",
    WebkitMaskRepeat: "no-repeat", maskRepeat: "no-repeat", WebkitMaskPosition: "center", maskPosition: "center" });
}
function slashAt(st, p, size, color, rot) {
  const s = slashEl(st, size, color);
  anim(s, [{ transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(.7)`), opacity: 1 },
    { transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(1.15)`), opacity: 0 }], 280, EASE_OUT).then(() => s.remove());
}
/** 顿帧 + 镜头推近:舞台上所有动画按住一小会儿,镜头朝落点推 5% */
async function freeze(st, p, ms) {
  const running = st.layer.getAnimations({ subtree: true });
  running.forEach(a => a.pause());
  st.cam.style.transformOrigin = `${p.x}px ${p.y}px`;
  const zoom = st.cam.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)", offset: .35 }, { transform: "scale(1)" }], { duration: T(ms + 220), easing: "ease-out" });
  await new Promise(r => setTimeout(r, T(ms)));
  running.forEach(a => { try { a.play(); } catch (e) {} });
  await zoom.finished.catch(() => {});
}

/** 敌人冲脸:dash 到目标面前,命中回调,退回。ghosts:首领带墨色残影 */
async function foeDash(st, target, onHit, { ghosts = false } = {}) {
  const a = at(st, st.foe), b = at(st, target), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, stop = len - (b.w + a.w) * .32;
  st.foe.style.zIndex = 8;
  await anim(st.foe, [{ transform: "translate(-50%,-50%)" }, { transform: `translate(calc(-50% - ${ux * 12}px), calc(-50% - ${uy * 12}px))` }], 90, EASE_OUT);
  if (ghosts) for (const f of [.45, .75]) setTimeout(() => {
    const g = st.foe.cloneNode(true), w = st.foe.offsetWidth, e = f * f;
    g.style.left = "0"; g.style.top = "0"; g.style.zIndex = 7; g.style.opacity = ".3"; g.style.filter = "brightness(.2) blur(1px)";
    g.style.transform = tr(a.x + ux * stop * e, a.y + uy * stop * e, w, w);
    st.layer.appendChild(g);
    anim(g, [{ opacity: .3 }, { opacity: 0 }], 280).then(() => g.remove());
  }, T(130 * f));
  await anim(st.foe, [{ transform: `translate(calc(-50% - ${ux * 12}px), calc(-50% - ${uy * 12}px))` },
    { transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }], 130, EASE_IN);
  await onHit({ x: ux, y: uy }, b);
  await anim(st.foe, [{ transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }, { transform: "translate(-50%,-50%)" }], 260, EASE_OUT, 60);
  st.foe.style.zIndex = "";
}
/** 首领前摇:双眼亮红、墨气往身上收 */
async function bossWindup(st) {
  const p = at(st, st.foe);
  const eyes = st.foe.querySelector('[data-k="bIris"]');
  anim(eyes, [{ filter: "none" }, { filter: `drop-shadow(0 0 6px ${BLOOD}) brightness(1.6) saturate(2)` }, { filter: "none" }], 480);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2, r = p.w * .75, sz = rnd(6, 11);
    const d = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: INK });
    anim(d, [{ transform: tr(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, sz, sz), opacity: 0 },
      { transform: tr(p.x + Math.cos(a) * r * .6, p.y + Math.sin(a) * r * .6, sz, sz), opacity: .8, offset: .4 },
      { transform: tr(p.x, p.y, sz, sz, "scale(.3)"), opacity: 0 }], 280, EASE_IN, i * 10).then(() => d.remove());
  }
  ring(st, p, BLOOD, p.w * 1.2, 3, 300, true);
  await sleep(300);
}
/** 大招前奏:压暗全屏,用墨红写出这一阶的字 */
async function bossGlyph(st, ch) {
  const dim = el(st, {}, "", "dim"), g = el(st, {}, "", "bigglyph");
  g.textContent = ch;
  anim(dim, [{ opacity: 0 }, { opacity: .55 }], 140);
  await anim(g, [{ clipPath: "inset(0 0 100% 0)", opacity: 1, transform: "translate(-50%,-50%) scale(1.1)", filter: "blur(4px)" },
    { clipPath: "inset(0 0 0 0)", opacity: 1, transform: "translate(-50%,-50%) scale(1)", filter: "blur(0)" }], 340, EASE_OUT);
  scatter(st, at(st, g), 12, () => blot(st, rnd(5, 12), "#3A0D10"), { dist: [st.layer.offsetWidth * .12, st.layer.offsetWidth * .26], dur: 480 });
  shake(st, { x: 0, y: 1 }, 5, 200);
  await sleep(200);
  anim(g, [{ opacity: 1, transform: "translate(-50%,-50%) scale(1)" }, { opacity: 0, transform: "translate(-50%,-50%) scale(1.3)" }], 220, EASE_IN).then(() => g.remove());
  anim(dim, [{ opacity: .55 }, { opacity: 0 }], 260).then(() => dim.remove());
  await sleep(100);
}

// ---------- 九格 ----------
const RUN = {
  async mobMelee(st) {
    await foeDash(st, st.allies[0], async (d, b) => {
      slashAt(st, b, b.w * 1.3, "#E9E2CF", rnd(-25, 25)); react(st, st.allies[0], d); shake(st, d, 5); pop(st, b, "-14", "#6B6449");
    });
  },
  async mobRanged(st) {
    const a = at(st, st.foe), b = at(st, st.allies[0]), R = a.w * .26;
    const ball = el(st, { width: px(R), height: px(R), borderRadius: "50%", background: "radial-gradient(circle, #FFFBE6 0 18%, #FFC04A 40%, #E2552A 68%, rgba(214,72,36,0) 72%)" });
    await anim(ball, [{ transform: tr(a.x, a.y, R, R) }, { transform: tr(b.x, b.y, R, R) }], 260, "cubic-bezier(.3,0,.8,.6)");
    ball.remove(); react(st, st.allies[0], { x: 0, y: 1 }); shake(st, { x: 0, y: 1 }, 5); pop(st, b, "-12", "#C4442B");
    await scatter(st, b, 8, () => blot(st, rnd(7, 12), "#F07A30"), { dist: [20, 50], dur: 500, gravity: -20, up: true });
  },
  async bossHit(st) {
    await bossWindup(st);
    await foeDash(st, st.allies[0], async (d, b) => {
      slashAt(st, b, b.w * 1.8, "#2A1416", rnd(-25, 25)); slashAt(st, b, b.w * 1.5, "#E9E2CF", rnd(-25, 25));
      react(st, st.allies[0], d, 1.6); shake(st, d, 8, 300); pop(st, b, "-38", BLOOD);
      scatter(st, b, 12, () => blot(st, rnd(6, 13)), { dist: [30, 80], dur: 560, gravity: 60 });
      ring(st, b, BLOOD, b.w * 1.6, 3, 420);
      await freeze(st, b, 120);
    }, { ghosts: true });
  },
  async charge(st) {
    const p = at(st, st.foe);
    const vig = el(st, {}, "", "vignette");
    anim(vig, [{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 0 }], 700).then(() => vig.remove());
    for (let i = 0; i < 3; i++) setTimeout(() => ring(st, p, BLOOD, p.w * 1.3, 4, 520, true), T(i * 260));
    const aura = el(st, { width: px(p.w * 1.1), height: px(p.w * 1.1), borderRadius: "50%", background: `radial-gradient(circle, rgba(179,36,42,.35), rgba(179,36,42,0) 70%)` });
    anim(aura, [{ transform: tr(p.x, p.y, p.w * 1.1, p.w * 1.1, "scale(.9)"), opacity: .4 }, { transform: tr(p.x, p.y, p.w * 1.1, p.w * 1.1, "scale(1.1)"), opacity: 1 },
      { transform: tr(p.x, p.y, p.w * 1.1, p.w * 1.1, "scale(.9)"), opacity: .4 }, { transform: tr(p.x, p.y, p.w * 1.1, p.w * 1.1, "scale(1.1)"), opacity: 1 },
      { transform: tr(p.x, p.y, p.w * 1.1, p.w * 1.1, "scale(1)"), opacity: 0 }], 1300).then(() => aura.remove());
    pop(st, { ...p, y: p.y - p.h * .1 }, "蓄力 · 淹没", BLOOD, true);
    await sleep(1300);
  },
  async deluge(st) {
    await bossGlyph(st, "海");
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight, wh = H * .38;
    const wave = el(st, { width: px(W * 1.1), height: px(wh), borderRadius: "0 0 45% 55% / 0 0 60% 60%",
      background: "linear-gradient(180deg, rgba(26,29,36,0) 0%, rgba(26,40,60,.85) 30%, #1A2230 70%, rgba(47,111,163,.8) 100%)" });
    const targets = [...st.allies, st.player];
    await anim(wave, [{ transform: `translate(${-W * .05}px, ${H * .3 - wh}px)`, opacity: 1 }, { transform: `translate(${-W * .05}px, ${H * 1.05}px)`, opacity: .8 }], 520, EASE_IN)
      .then(() => wave.remove());
    for (const t of targets) { const p = at(st, t); react(st, t, { x: 0, y: 1 }, 1.4); pop(st, p, "-22", "#2F6FA3"); }
    shake(st, { x: 0, y: 1 }, 9, 320);
    await scatter(st, { x: W / 2, y: H * .75 }, 18, () => blot(st, rnd(6, 12), "#6FB3E0"), { dist: [40, 140], dur: 600, gravity: 120, up: true });
  },
  async impale(st) {
    await bossGlyph(st, "刀");
    const a = at(st, st.foe), f = at(st, st.allies[0]), pl = at(st, st.player);
    const len = Math.hypot(pl.x - a.x, pl.y - a.y) + 30, ang = Math.atan2(pl.y - a.y, pl.x - a.x) * 180 / Math.PI;
    const spear = el(st, { width: "0px", height: px(a.w * .12), background: `linear-gradient(90deg, ${INK}, #3A0D10 80%, ${BLOOD})`,
      clipPath: "polygon(0 30%, 88% 30%, 100% 50%, 88% 70%, 0 70%)", transformOrigin: "0 50%" });
    spear.style.transform = `translate(${a.x}px, ${a.y - a.w * .06}px) rotate(${ang}deg)`;
    await anim(spear, [{ width: "0px" }, { width: px(len * .15) }], 160, EASE_OUT);   // 凝出枪头
    await anim(spear, [{ width: px(len * .15) }, { width: px(len) }], 150, EASE_IN);    // 刺出
    const d = { x: Math.cos(ang * Math.PI / 180), y: Math.sin(ang * Math.PI / 180) };
    react(st, st.allies[0], d, 1.3); pop(st, f, "-20", BLOOD);
    await sleep(60);
    react(st, st.player, d, 2); pop(st, pl, "-44", BLOOD);
    scatter(st, pl, 12, () => blot(st, rnd(6, 12)), { dist: [20, 70], dur: 520, gravity: 60 });
    await freeze(st, pl, 120);
    anim(spear, [{ opacity: 1 }, { opacity: 0 }], 260).then(() => spear.remove());
    await sleep(300);
  },
  async topple(st) {
    await bossGlyph(st, "山");
    anim(st.cam, [{ transform: "rotate(0deg)" }, { transform: "rotate(-4deg) translateY(6px)", offset: .3 }, { transform: "rotate(2deg)", offset: .6 }, { transform: "rotate(0deg)" }], 620, "ease-out");
    const sb = st.player.querySelector(".shieldbar"), sp = at(st, sb);
    anim(sb, [{ opacity: 1, transform: "scaleX(1)" }, { opacity: 0, transform: "scaleX(.2)" }], 260);
    scatter(st, sp, 14, () => { const sz = rnd(5, 10); return [el(st, { width: px(sz), height: px(sz), clipPath: "polygon(50% 0, 100% 100%, 0 100%)", background: "#9DC6EA" }), sz, sz]; },
      { dist: [30, 90], dur: 620, gravity: 140, spin: 400 });
    const pl = at(st, st.player);
    react(st, st.player, { x: -1, y: 0 }, 1.6); pop(st, pl, "护盾清空", "#2F6FA3", true);
    const pip = st.player.querySelectorAll(".ap b")[2];
    await sleep(240);
    anim(pip, [{ background: "#C9A94A", transform: "scale(1)" }, { background: "#C9A94A", transform: "scale(1.6)", offset: .3 }, { background: "#8E8675", transform: "scale(1)" }], 420);
    pop(st, { ...at(st, pip), w: 0, h: 10 }, "AP −1", "#6B6449", true);
    await sleep(700);
    pip.getAnimations().forEach(a => a.cancel()); sb.getAnimations().forEach(a => a.cancel());
  },
  async devour(st) {
    await bossGlyph(st, "火");
    const f = at(st, st.allies[0]), jaw = f.w * 1.5;
    const top = el(st, { width: px(jaw), height: px(jaw * .5), borderRadius: `${jaw}px ${jaw}px 0 0`, background: INK, boxShadow: `inset 0 -6px 0 ${BLOOD}` });
    const bot = el(st, { width: px(jaw), height: px(jaw * .5), borderRadius: `0 0 ${jaw}px ${jaw}px`, background: INK, boxShadow: `inset 0 6px 0 ${BLOOD}` });
    const open = f.w * .9;
    anim(top, [{ transform: tr(f.x, f.y - open, jaw, jaw * .5), opacity: 0 }, { transform: tr(f.x, f.y - open, jaw, jaw * .5), opacity: 1 }], 140);
    await anim(bot, [{ transform: tr(f.x, f.y + open, jaw, jaw * .5), opacity: 0 }, { transform: tr(f.x, f.y + open, jaw, jaw * .5), opacity: 1 }], 140);
    anim(top, [{ transform: tr(f.x, f.y - open, jaw, jaw * .5) }, { transform: tr(f.x, f.y - jaw * .25, jaw, jaw * .5) }], 160, EASE_IN);
    await anim(bot, [{ transform: tr(f.x, f.y + open, jaw, jaw * .5) }, { transform: tr(f.x, f.y + jaw * .25, jaw, jaw * .5) }], 160, EASE_IN);
    anim(st.allies[0], [{ transform: "translate(-50%,-50%) scale(1)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(.2)", opacity: 0 }], 200);
    shake(st, { x: 0, y: 1 }, 8, 280);
    pop(st, f, "吞噬", BLOOD);
    await sleep(200);
    anim(top, [{ opacity: 1 }, { opacity: 0 }], 260).then(() => top.remove());
    anim(bot, [{ opacity: 1 }, { opacity: 0 }], 260).then(() => bot.remove());
    scatter(st, f, 14, () => blot(st, rnd(7, 13)), { dist: [30, 80], dur: 560, gravity: 40 });
    await sleep(700);
    st.allies[0].getAnimations().forEach(a => a.cancel());
  },
  async bulwark(st) {
    // 我方林冲上去打它:坚壁挡下 —— 金属光泽扫过、护甲片一闪、火花四溅,伤害数字压小一号
    const lin = st.allies[0], a = at(st, lin), b = at(st, st.foe), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const stop = len - b.w * .4;
    await anim(lin, [{ transform: "translate(-50%,-50%)" }, { transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }], 140, EASE_IN);
    const plate = el(st, { width: px(b.w * .9), height: px(b.w * .9), borderRadius: "22%",
      background: "repeating-linear-gradient(60deg, rgba(200,190,160,.0) 0 10px, rgba(200,190,160,.35) 10px 12px), linear-gradient(135deg, rgba(230,220,190,.55), rgba(120,110,80,.35))",
      boxShadow: "inset 0 0 0 3px rgba(201,169,74,.8)" });
    anim(plate, [{ transform: tr(b.x, b.y, b.w * .9, b.w * .9, "scale(.9)"), opacity: 0 }, { transform: tr(b.x, b.y, b.w * .9, b.w * .9, "scale(1)"), opacity: 1, offset: .2 },
      { transform: tr(b.x, b.y, b.w * .9, b.w * .9, "scale(1)"), opacity: 0 }], 520).then(() => plate.remove());
    const sheen = el(st, { width: px(b.w * .25), height: px(b.w * 1.1), background: "linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent)" });
    anim(sheen, [{ transform: tr(b.x - b.w * .5, b.y, b.w * .25, b.w * 1.1, "skewX(-20deg)"), opacity: 1 }, { transform: tr(b.x + b.w * .5, b.y, b.w * .25, b.w * 1.1, "skewX(-20deg)"), opacity: 0 }], 360).then(() => sheen.remove());
    scatter(st, { x: b.x - ux * b.w * .3, y: b.y - uy * b.w * .3 }, 12, () => { const sz = rnd(3, 6);
      return [el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "#FFE08A", boxShadow: "0 0 5px #FFC24A" }), sz, sz]; },
      { dist: [30, 80], dur: 420, gravity: 80, angle: Math.atan2(-uy, -ux), spread: 1.2 });
    const p = at(st, st.foe);
    pop(st, p, "-6", "#8E8675", true);
    pop(st, { ...p, y: p.y + 14 }, "坚壁", "#8A6600", true);
    await anim(lin, [{ transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }, { transform: `translate(calc(-50% + ${ux * stop * .7}px), calc(-50% + ${uy * stop * .7}px))`, offset: .3 },
      { transform: "translate(-50%,-50%)" }], 320, EASE_OUT);
    await sleep(300);
  },
};

async function play(st) {
  if (st.busy) return;
  st.busy = true;
  try { await RUN[st.v.id](st); await sleep(400); }
  catch (e) { console.error(st.v.id, e); }
  finally { st.busy = false; }
}
const grid = document.getElementById("grid");
for (const v of PANELS) grid.appendChild(buildStage(v));
const playAll = () => STAGES.forEach(play);
document.getElementById("play-all").addEventListener("click", playAll);
document.getElementById("slow").addEventListener("change", e => { speed = e.target.checked ? .3 : 1; });
const loopBox = document.getElementById("loop");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) loopBox.checked = false;
// 循环只靠定时器:每 0.2 秒看一眼,距上一轮满 3 秒(随慢放拉长)就再播一轮,忙着的格子自己跳过
let last = -1e9;
setInterval(() => {
  if (!loopBox.checked) return;
  const now = performance.now();
  if (now - last < T(3000)) return;
  last = now;
  playAll();
}, 200);
</script>
