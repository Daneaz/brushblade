<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>林·近战表现四选一</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局:顶部说明 + 控制条,下面 3×2 舞台网格(对照两格 + A–D 四格),窄屏单列 */
:root {
  --bg: #F3EFE6;          /* 页底:比游戏宣纸暗半档,舞台才浮得出来 */
  --fg: #11161F;          /* 墨黑 Theme.Ink */
  --muted: #5C6371;
  --line: #D9D2C3;
  --card: #FBF8F1;        /* Theme.PanelPaper */
  --accent: #1F6333;      /* 木 Theme.GlyphColor(Wood) */
  --accent-soft: #CCE6D0;
  --gold: #8A6600;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* 舞台是「游戏截图」,两套主题下都保持宣纸色,不跟随 */
  --stage-paper: #F6F1E7;
  --stage-ink: #11161F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
    --accent: #7FC08F; --accent-soft: #1E3A27; --gold: #D9B25A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
  --accent: #7FC08F; --accent-soft: #1E3A27; --gold: #D9B25A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .toggle { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel.ref { border-style: dashed; }
.panel.feature { border-color: var(--accent); grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: center; gap: 12px 20px; }
.panel.feature .panel-head { grid-column: 1 / -1; }
.panel.feature .stage { grid-row: 2 / span 2; }
.panel.feature .desc { font-size: 14px; align-self: end; }
.panel.feature .replay { align-self: start; }
@media (max-width: 760px) { .panel.feature { grid-template-columns: minmax(0, 1fr); } .panel.feature .stage { grid-row: auto; } }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.tag { font-size: 11px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.tag.rec { color: var(--accent); border-color: var(--accent); }
.desc { margin: 0; font-size: 13px; color: var(--muted); }
.panel .replay { justify-self: start; font-size: 13px; padding: 4px 12px; }

/* ---- 舞台 ---- */
.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 20%, #FBF7EE 0%, var(--stage-paper) 55%, #E9E1D0 100%); }
.stage .row-line { position: absolute; left: 6%; right: 6%; top: 54%; border-top: 1px dashed rgba(17,22,31,.14); }
.shake { position: absolute; inset: 0; }
.unit { position: absolute; transform: translate(-50%, -50%); will-change: transform; }
.enemy { left: 70%; top: 28%; width: 30%; aspect-ratio: 1; }
.enemy img { position: absolute; inset: 0; width: 100%; height: 100%; }
.enemy .name { position: absolute; left: 50%; bottom: -8%; transform: translateX(-50%); font-family: var(--font-display); font-size: 12px; color: var(--stage-ink); background: rgba(246,241,231,.85); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.lin { left: 24%; top: 74%; width: 21%; aspect-ratio: 1; z-index: 3; }
.lin .disc { position: absolute; inset: 0; border-radius: 50%; background: #CCE6D0; box-shadow: inset 0 0 0 2px rgba(31,99,51,.35); }
.lin img { position: absolute; inset: 6%; width: 88%; height: 88%; }
.lin .name { position: absolute; left: 50%; bottom: -14%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 900; font-size: 14px; color: #1F6333; }
.fx { position: absolute; pointer-events: none; transform: translate(-50%, -50%); z-index: 5; }
.ghost { z-index: 4; }
.popup { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 22px; color: #1F6333; text-shadow: 0 1px 0 #fff, 0 0 6px rgba(255,255,255,.8); z-index: 6; pointer-events: none; }
canvas.brush { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 80ch; }
</style>

<div class="wrap">
  <header>
    <h1>林 · 近战表现四选一</h1>
    <p class="lede">用游戏里的真实素材(林的立绘、刀口贴图、叶片)演示。头两格是现在游戏里的近战和远程,作对照;后面 A–D 是四个候选,最上面一格是 A、B 组合。命中端(飘字、叶片、受击抖动、震屏)四个方案共用,只有「从林到目标」这一段不同。</p>
    <div class="controls">
      <button class="primary" id="play-all" type="button">全部播放</button>
      <label class="toggle" for="slow"><input type="checkbox" id="slow"> 慢放 ×0.3</label>
      <label class="toggle" for="loop"><input type="checkbox" id="loop" checked> 自动循环</label>
    </div>
  </header>

  <div id="featured"></div>
  <div class="grid" id="grid"></div>

  <p class="note">时长都按游戏里现有的节奏取:蓄 70ms、冲 80–120ms、命中顿帧约 75ms、收招 160–240ms。慢放只是把整条时间线拉长,方便看清每一帧,不代表实际手感。</p>
</div>

let speed = 1;
const T = ms => ms / speed;
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const anim = (el, frames, ms, easing = "linear", extra = {}) =>
  el.animate(frames, { duration: T(ms), easing, fill: "forwards", ...extra }).finished.catch(() => {});
const EASE_IN = "cubic-bezier(.55,0,1,.45)";
const EASE_OUT = "cubic-bezier(0,.55,.45,1)";

function buildPanel(v) {
  const el = document.createElement("section");
  el.className = "panel" + (v.ref ? " ref" : "") + (v.feature ? " feature" : "");
  el.innerHTML = `
    <div class="panel-head"><h2>${v.title}</h2><span class="tag${v.rec ? " rec" : ""}">${v.tag}</span></div>
    <div class="stage" aria-label="${v.title} 演示">
      <div class="shake">
        <div class="row-line"></div>
        <div class="unit enemy">
          <img src="${IMG.mobWisp}" alt=""><img src="${IMG.mobBody}" alt=""><img src="${IMG.mobFace}" alt="">
          <span class="name">夯土妖 · 土</span>
        </div>
        <div class="unit lin">
          <div class="disc"></div><img src="${IMG.lin}" alt="林"><span class="name">林</span>
        </div>
      </div>
    </div>
    <p class="desc">${v.desc}</p>
    <button class="replay" type="button">重播</button>`;
  const ctx = {
    v, el,
    stage: el.querySelector(".stage"),
    layer: el.querySelector(".shake"),
    enemy: el.querySelector(".enemy"),
    lin: el.querySelector(".lin"),
    busy: false,
  };
  el.querySelector(".replay").addEventListener("click", () => play(ctx));
  return ctx;
}

// 舞台内坐标(px,相对 .shake)
function center(ctx, unit) {
  const s = ctx.layer.getBoundingClientRect(), r = unit.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width };
}
function geometry(ctx) {
  const a = center(ctx, ctx.lin), b = center(ctx, ctx.enemy);
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  return { a, b, ux: dx / len, uy: dy / len, len, angle: Math.atan2(dy, dx) * 180 / Math.PI };
}
function fxImg(ctx, src, x, y, size, cls = "fx") {
  const img = document.createElement("img");
  img.src = src; img.alt = ""; img.className = cls;
  Object.assign(img.style, { left: x + "px", top: y + "px", width: size + "px", height: size + "px" });
  ctx.layer.appendChild(img);
  return img;
}

// ---- 命中端:所有方案共用 ----
async function hit(ctx, g, { slash = true } = {}) {
  const { b } = g;
  if (slash) {
    const size = b.w * 0.95, rot = (Math.random() * 50 - 25), flip = Math.random() < .5 ? -1 : 1;
    const s = fxImg(ctx, IMG.slash, b.x, b.y, size);
    anim(s, [
      { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(${.7 * flip},.7)`, opacity: 1 },
      { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(${1.0 * flip},1.0)`, opacity: 1, offset: .4 },
      { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(${1.15 * flip},1.15)`, opacity: 0 },
    ], 240, EASE_OUT).then(() => s.remove());
  }
  // 叶片
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, d = b.w * (.35 + Math.random() * .35);
    const leaf = fxImg(ctx, IMG.leaf, b.x, b.y, b.w * .16);
    const r0 = Math.random() * 360;
    anim(leaf, [
      { transform: `translate(-50%,-50%) rotate(${r0}deg)`, opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) rotate(${r0 + 180}deg)`, opacity: 0 },
    ], 420, EASE_OUT).then(() => leaf.remove());
  }
  // 受击:沿攻击方向后仰 + 白闪
  anim(ctx.enemy, [
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
    { transform: `translate(calc(-50% + ${g.ux * 10}px), calc(-50% + ${g.uy * 10}px)) scale(1.06)`, filter: "brightness(1.9)", offset: .2 },
    { transform: `translate(calc(-50% - ${g.ux * 4}px), calc(-50% - ${g.uy * 4}px))`, filter: "brightness(1)", offset: .6 },
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
  ], 300, "ease-out");
  // 沿攻击方向震屏
  anim(ctx.layer, [
    { transform: "translate(0,0)" },
    { transform: `translate(${g.ux * 6}px, ${g.uy * 6}px)` },
    { transform: `translate(${-g.ux * 4}px, ${-g.uy * 4}px)` },
    { transform: `translate(${g.ux * 2}px, ${g.uy * 2}px)` },
    { transform: "translate(0,0)" },
  ], 220, "linear");
  // 飘字
  const p = document.createElement("div");
  p.className = "popup"; p.textContent = "-18";
  Object.assign(p.style, { left: (b.x + b.w * .28) + "px", top: (b.y - b.w * .2) + "px" });
  ctx.layer.appendChild(p);
  anim(p, [
    { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
    { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 },
    { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 },
    { transform: "translate(-50%,-140%) scale(1)", opacity: 0 },
  ], 700, "ease-out").then(() => p.remove());
  await sleep(75); // 顿帧
}

const move = (ux, uy, d) => `translate(calc(-50% + ${ux * d}px), calc(-50% + ${uy * d}px))`;
const HOME = "translate(-50%,-50%)";

// ---- 笔触:二次贝塞尔一笔,起笔重、收笔出锋带飞白;返回画好的 canvas ----
// reach:终点相对目标中心沿攻击方向的偏移(以目标宽度计,负数 = 停在目标前面)
// from:起点相对林中心的偏移(以林宽度计)
async function brushStroke(ctx, g, { bow, reach, weight, ms, from = .4 }) {
  const cv = document.createElement("canvas");
  cv.className = "brush";
  const s = ctx.layer.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = s.width * dpr; cv.height = s.height * dpr;
  ctx.layer.appendChild(cv);
  const c = cv.getContext("2d"); c.scale(dpr, dpr);
  const nx = -g.uy, ny = g.ux, bend = g.len * bow;
  const p0 = { x: g.a.x + g.ux * g.a.w * from, y: g.a.y + g.uy * g.a.w * from };
  const p2 = { x: g.b.x + g.ux * g.b.w * reach, y: g.b.y + g.uy * g.b.w * reach };
  const p1 = { x: (p0.x + p2.x) / 2 + nx * bend, y: (p0.y + p2.y) / 2 + ny * bend };
  const at = t => ({ x: (1 - t) ** 2 * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x,
                     y: (1 - t) ** 2 * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y });
  const maxW = g.a.w * weight;
  const width = t => maxW * (t < .12 ? .55 + t / .12 * .45 : 1 - (t - .12) / .88 * .92);
  const bristles = Array.from({ length: 7 }, () => ({ off: Math.random() * 2 - 1, gap: .85 + Math.random() * .15 }));
  const STEPS = 80, dur = T(ms);
  let drawn = 0;
  await new Promise(res => {
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), target = Math.floor(k * k * STEPS); // ease-in:越扫越快
      for (; drawn <= target; drawn++) {
        const t = drawn / STEPS, p = at(t), w = width(t);
        c.fillStyle = "rgba(20,48,30,.9)";
        c.beginPath(); c.arc(p.x, p.y, w / 2, 0, Math.PI * 2); c.fill();
        bristles.forEach(br => {   // 飞白:收笔段的毛丝断续
          if (t > .55 && Math.random() > br.gap) return;
          c.fillStyle = "rgba(20,48,30,.55)";
          c.beginPath(); c.arc(p.x + nx * br.off * w * .7, p.y + ny * br.off * w * .7, Math.max(.6, w * .09), 0, Math.PI * 2); c.fill();
        });
      }
      if (k < 1) requestAnimationFrame(tick); else res();
    };
    requestAnimationFrame(tick);
  });
  return cv;
}
const fadeStroke = (cv, ms) =>
  anim(cv, [{ opacity: 1, filter: "blur(0px)" }, { opacity: .5, filter: "blur(1.5px)", offset: .5 }, { opacity: 0, filter: "blur(3px)" }], ms, EASE_OUT).then(() => cv.remove());

      const dot = document.createElement("div");
      Object.assign(dot.style, { position: "absolute", left: (r.left + r.width / 2 - s.left) + "px", top: (r.top + r.height / 2 - s.top) + "px",
        width: "5px", height: "5px", borderRadius: "50%", background: "#1F6333", transform: "translate(-50%,-50%)", zIndex: 4 });
      ctx.layer.appendChild(dot);
      anim(dot, [{ opacity: .6 }, { opacity: 0 }], 200).then(() => dot.remove());
    }, T(18));
    await anim(arrow, [
      { transform: `translate(-50%,-50%) rotate(${g.angle}deg)` },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${g.angle}deg)` },
    ], 160, "cubic-bezier(.3,0,.8,.6)");
    clearInterval(trail); arrow.remove();
    await hit(ctx, g, { slash: false });
  },
  // A 残影突进
  async A(ctx, g) {
    await anim(ctx.lin, [{ transform: HOME }, { transform: move(g.ux, g.uy, -8) }], 70, EASE_OUT);
    anim(ctx.lin, [{ transform: move(g.ux, g.uy, -8) }, { transform: move(g.ux, g.uy, 12) }, { transform: HOME }], 260, EASE_OUT);
    const stop = g.len - g.b.w * .42;             // 停在目标面前,不重叠
    const make = () => {
      const c = ctx.lin.cloneNode(true);
      c.classList.add("ghost"); c.querySelector(".name")?.remove();
      c.style.opacity = ".62"; c.style.filter = "saturate(.6) brightness(1.08)";
      ctx.layer.appendChild(c); return c;
    };
    const ghost = make();
    // 路上留 3 道更淡的残影
    [0.3, 0.55, 0.8].forEach((f, i) => setTimeout(() => {
      const t = make(); t.style.transform = move(g.ux, g.uy, stop * f); t.style.opacity = ".28";
      anim(t, [{ opacity: .28 }, { opacity: 0 }], 200).then(() => t.remove());
    }, T(90 * f)));
    await anim(ghost, [{ transform: HOME, opacity: .2 }, { transform: move(g.ux, g.uy, stop), opacity: .62 }], 90, EASE_IN);
    // 挥砍
    await anim(ghost, [
      { transform: move(g.ux, g.uy, stop) + " rotate(-18deg)" },
      { transform: move(g.ux, g.uy, stop + 10) + " rotate(24deg) scale(1.08)" },
    ], 80, EASE_IN);
    const h = hit(ctx, g);
    anim(ghost, [
      { transform: move(g.ux, g.uy, stop + 10) + " rotate(24deg) scale(1.08)", opacity: .62 },
      { transform: move(g.ux, g.uy, stop - 6) + " rotate(10deg) scale(1.15)", opacity: 0 },
    ], 200, EASE_OUT).then(() => ghost.remove());
    await h;
  },
  // B 笔锋扫过
  async B(ctx, g) {
    anim(ctx.lin, [{ transform: HOME }, { transform: move(g.ux, g.uy, -6) }, { transform: move(g.ux, g.uy, 10) }, { transform: HOME }], 300, EASE_OUT);
    await sleep(60);
    const cv = await brushStroke(ctx, g, { bow: .12, reach: .15, weight: .16, ms: 100 });
    const h = hit(ctx, g);
    fadeStroke(cv, 420);
    await h;
  },
  // A+B 残影突进 + 笔锋拖尾:残影冲过去的同一时间线上落一笔,笔尖始终跟着残影
  async AB(ctx, g) {
    await anim(ctx.lin, [{ transform: HOME }, { transform: move(g.ux, g.uy, -8) }], 70, EASE_OUT);
    anim(ctx.lin, [{ transform: move(g.ux, g.uy, -8) }, { transform: move(g.ux, g.uy, 12) }, { transform: HOME }], 260, EASE_OUT);
    const stop = g.len - g.b.w * .42;
    const ghost = ctx.lin.cloneNode(true);
    ghost.classList.add("ghost"); ghost.querySelector(".name")?.remove();
    ghost.style.opacity = ".62"; ghost.style.filter = "saturate(.6) brightness(1.08)";
    ctx.layer.appendChild(ghost);
    // 笔与残影同一条 ease-in、同一时长:笔尖停在残影停下的地方(stop),不越过去
    const stroke = brushStroke(ctx, g, { bow: 0, reach: -(g.len - stop) / g.b.w, weight: .2, ms: 90, from: .1 });
    await anim(ghost, [{ transform: HOME, opacity: .2 }, { transform: move(g.ux, g.uy, stop), opacity: .62 }], 90, EASE_IN);
    const cv = await stroke;
    await anim(ghost, [
      { transform: move(g.ux, g.uy, stop) + " rotate(-18deg)" },
      { transform: move(g.ux, g.uy, stop + 10) + " rotate(24deg) scale(1.08)" },
    ], 80, EASE_IN);
    const h = hit(ctx, g);
    fadeStroke(cv, 480);
    anim(ghost, [
      { transform: move(g.ux, g.uy, stop + 10) + " rotate(24deg) scale(1.08)", opacity: .62 },
      { transform: move(g.ux, g.uy, stop - 6) + " rotate(10deg) scale(1.15)", opacity: 0 },
    ], 200, EASE_OUT).then(() => ghost.remove());
    await h;
  },
  // C 刀气弹
  async C(ctx, g) {
    await anim(ctx.lin, [{ transform: HOME }, { transform: move(g.ux, g.uy, -8) }], 70, EASE_OUT);
    anim(ctx.lin, [{ transform: move(g.ux, g.uy, -8) }, { transform: move(g.ux, g.uy, 14) }, { transform: HOME }], 240, EASE_OUT);
    const size = g.b.w * .55, dx = g.b.x - g.a.x, dy = g.b.y - g.a.y;
    const rot = g.angle - 90;  // 刀口贴图弧面朝上 → 转到朝飞行方向
    const wave = fxImg(ctx, IMG.slash, g.a.x, g.a.y, size);
    const trail = setInterval(() => {
      const r = wave.getBoundingClientRect(), s = ctx.layer.getBoundingClientRect();
      const t = fxImg(ctx, IMG.slash, r.left + r.width / 2 - s.left, r.top + r.height / 2 - s.top, size * .9);
      t.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scaleY(.6)`;
      anim(t, [{ opacity: .35 }, { opacity: 0 }], 160).then(() => t.remove());
    }, T(28));
    await anim(wave, [
      { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(.6,.4)` },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(1,.6)` },
    ], 160, "cubic-bezier(.3,0,.8,.6)");
    clearInterval(trail); wave.remove();
    await hit(ctx, g);
  },
  // D 真身冲脸
  async D(ctx, g) {
    const stop = g.len - g.b.w * .45;
    await anim(ctx.lin, [{ transform: HOME }, { transform: move(g.ux, g.uy, -10) }], 80, EASE_OUT);
    ctx.lin.style.zIndex = 6;
    await anim(ctx.lin, [{ transform: move(g.ux, g.uy, -10) }, { transform: move(g.ux, g.uy, stop) }], 120, EASE_IN);
    await hit(ctx, g);
    await sleep(60);
    await anim(ctx.lin, [{ transform: move(g.ux, g.uy, stop) }, { transform: HOME }], 240, EASE_OUT);
    ctx.lin.style.zIndex = "";
  },
};

async function play(ctx) {
  if (ctx.busy) return;
  ctx.busy = true;
  try { await RUN[ctx.v.id](ctx, geometry(ctx)); await sleep(250); }
  finally {
    ctx.lin.getAnimations().forEach(a => a.cancel());
    ctx.enemy.getAnimations().forEach(a => a.cancel());
    ctx.layer.getAnimations().forEach(a => a.cancel());
    ctx.busy = false;
  }
}

const grid = document.getElementById("grid"), featured = document.getElementById("featured");
const panels = VARIANTS.map(v => { const p = buildPanel(v); (v.feature ? featured : grid).appendChild(p.el); return p; });

document.getElementById("play-all").addEventListener("click", () => panels.forEach(play));
document.getElementById("slow").addEventListener("change", e => { speed = e.target.checked ? .3 : 1; });
const loop = document.getElementById("loop");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) loop.checked = false;
let loopTimer = null;
const schedule = () => {
  clearTimeout(loopTimer);
  if (!loop.checked) return;
  loopTimer = setTimeout(() => { panels.forEach(play); schedule(); }, T(1800));
};
loop.addEventListener("change", schedule);
window.addEventListener("load", () => setTimeout(() => { panels.forEach(play); schedule(); }, 400));
</script>
