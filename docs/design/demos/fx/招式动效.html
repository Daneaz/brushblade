<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>字斗 · 招式动效</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局:顶部说明 + 控制条;「我方出字 / 召唤物」两组舞台格,每格 = 舞台 + 说明 + 同套字 */
:root {
  --bg: #F3EFE6;
  --fg: #11161F;
  --muted: #5C6371;
  --line: #D9D2C3;
  --card: #FBF8F1;
  --accent: #8A6600;
  --accent-soft: #F6EDD5;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
    --accent: #D9B25A; --accent-soft: #2A2415; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
  --accent: #D9B25A; --accent-soft: #2A2415; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 6px 0 0; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .toggle { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.tag { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 9px; white-space: nowrap; }
.desc { margin: 0; font-size: 13px; color: var(--muted); }
.same { margin: 0; font-size: 13px; }
.same b { font-family: var(--font-display); font-weight: 600; letter-spacing: .12em; }
.replay { justify-self: start; font-size: 13px; padding: 4px 12px; }

/* ---- 舞台:游戏截图,两套主题下都保持宣纸色 ---- */
.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 20%, #FBF7EE 0%, #F6F1E7 55%, #E9E1D0 100%); container-type: inline-size; }
.layer { position: absolute; inset: 0; }
.rowline { position: absolute; left: 6%; right: 6%; top: 30%; border-top: 1px dashed rgba(17,22,31,.12); }
.u { position: absolute; transform: translate(-50%, -50%); }
.mob { width: 15%; aspect-ratio: 1; }
.mob img, .ally img { position: absolute; inset: 0; width: 100%; height: 100%; }
.nm { position: absolute; left: 50%; bottom: -10%; transform: translateX(-50%); font-family: var(--font-display);
  font-size: 11px; color: #11161F; background: rgba(246,241,231,.85); padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.ally { width: 15%; aspect-ratio: 1; }
.ally .disc { position: absolute; inset: 0; border-radius: 50%; background: #CCE6D0; box-shadow: inset 0 0 0 2px rgba(31,99,51,.35); }
.ally .nm { color: #1F6333; font-weight: 900; bottom: -16%; }
.hand { width: 8.5%; aspect-ratio: .8; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 900; color: #fff; font-size: 4.2cqw; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.fx { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; z-index: 5; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 4.4cqw;
  text-shadow: 0 1px 0 #fff, 0 0 5px rgba(255,255,255,.9); z-index: 7; pointer-events: none; white-space: nowrap; }
.pop.s { font-size: 2.9cqw; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 82ch; }
</style>

<div class="wrap">
  <header>
    <h1>字斗 · 招式动效</h1>
    <p class="lede">八种代表招式,用游戏里的真实字怪、召唤物立绘和刀光、叶片贴图演示。每格下面写着同一套动效还会用在哪些字上。命中那一下(飘字、受击、震屏)各格共用,不同的是「怎么打过去」和「落在身上什么样」。</p>
    <div class="controls">
      <button class="primary" id="play-all" type="button">全部播放</button>
      <label class="toggle" for="slow"><input type="checkbox" id="slow"> 慢放 ×0.3</label>
      <label class="toggle" for="loop"><input type="checkbox" id="loop" checked> 自动循环</label>
    </div>
  </header>
  <h2>我方出字</h2>
  <div class="grid" id="g-cast"></div>
  <h2>召唤物</h2>
  <div class="grid" id="g-sum"></div>
  <p class="note">伤害数字是示意。剁的两刀各是一次伤害,中间停一拍,与游戏里多段伤害的节拍一致。所有效果都由现有的刀光、叶片贴图加程序绘制拼成,落进 Unity 不需要新美术。</p>
</div>

// ---------- 时间与工具 ----------
let speed = 1;
const T = ms => ms / speed;
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const rnd = (a, b) => a + Math.random() * (b - a);
function anim(node, frames, ms, easing = "linear", delay = 0) {
  const a = node.animate(frames, { duration: T(ms), delay: T(delay), easing, fill: "both" });
  return a.finished.catch(() => {});
}
const EASE_IN = "cubic-bezier(.55,0,1,.45)", EASE_OUT = "cubic-bezier(0,.55,.45,1)";

/** 在舞台层上放一个特效元素(左上角在舞台原点,位置全靠 transform) */
function el(st, css = {}, html = "") {
  const d = document.createElement("div");
  d.className = "fx";
  d.innerHTML = html;
  Object.assign(d.style, css);
  st.layer.appendChild(d);
  return d;
}
function at(st, node) {
  const s = st.layer.getBoundingClientRect(), r = node.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width, h: r.height };
}
const px = v => v + "px";
/** 让宽 w、高 h 的元素以中心落在 (x, y) */
const tr = (x, y, w, h, extra = "") => `translate(${x - w / 2}px, ${y - h / 2}px) ${extra}`;

// ---------- 舞台 ----------
const STAGES = [];
function buildStage(v) {
  const panel = document.createElement("section");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-head"><h3>${v.title}</h3><span class="tag">${v.tag}</span></div>
    <div class="stage" aria-label="${v.title} 演示"><div class="layer"><div class="rowline"></div></div></div>
    <p class="desc">${v.desc}</p>
    <p class="same">同一套:<b>${v.same}</b></p>
    <button class="replay" type="button">重播</button>`;
  const layer = panel.querySelector(".layer");
  const mobs = MOBS.map(m => {
    const d = document.createElement("div");
    d.className = "u mob";
    d.style.left = m.x * 100 + "%"; d.style.top = m.y * 100 + "%";
    d.innerHTML = `<img src="${SRC[m.id + "b"]}" alt=""><img src="${SRC[m.id + "f"]}" alt=""><span class="nm">${m.name}</span>`;
    layer.appendChild(d);
    return { ...m, el: d };
  });
  const src = document.createElement("div");
  if (v.hand) {
    src.className = "u hand"; src.style.left = "50%"; src.style.top = "86%"; src.style.background = v.color; src.textContent = v.hand;
  } else {
    src.className = "u ally"; src.style.left = "24%"; src.style.top = "74%";
    src.innerHTML = `<div class="disc"></div><img src="${SRC[v.ally + "Leaf"]}" alt=""><img src="${SRC[v.ally + "Body"]}" alt=""><span class="nm">${v.allyName}</span>`;
  }
  layer.appendChild(src);
  const st = { v, panel, layer, mobs, src, busy: false };
  panel.querySelector(".replay").addEventListener("click", () => play(st));
  STAGES.push(st);
  return panel;
}

// ---------- 命中端(共用) ----------
function pop(st, p, text, color, small = false, dy = 0) {
  const d = document.createElement("div");
  d.className = "pop" + (small ? " s" : "");
  d.textContent = text; d.style.color = color;
  d.style.left = px(p.x + p.w * .28); d.style.top = px(p.y - p.w * .22 + dy);
  st.layer.appendChild(d);
  anim(d, [
    { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
    { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 },
    { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 },
    { transform: "translate(-50%,-140%) scale(1)", opacity: 0 },
  ], 780, "ease-out").then(() => d.remove());
}
function hit(st, mob, dmg, color, dir = { x: 0, y: -1 }, heavy = 1) {
  const p = at(st, mob.el);
  anim(mob.el, [
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
    { transform: `translate(calc(-50% + ${dir.x * 9 * heavy}px), calc(-50% + ${dir.y * 9 * heavy}px)) scale(1.06)`, filter: "brightness(1.9)", offset: .2 },
    { transform: `translate(calc(-50% - ${dir.x * 4}px), calc(-50% - ${dir.y * 4}px))`, filter: "brightness(1)", offset: .6 },
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
  ], 300, "ease-out");
  anim(st.layer, [
    { transform: "translate(0,0)" }, { transform: `translate(${dir.x * 5 * heavy}px, ${dir.y * 5 * heavy}px)` },
    { transform: `translate(${-dir.x * 3}px, ${-dir.y * 3}px)` }, { transform: "translate(0,0)" },
  ], 220);
  if (dmg) pop(st, p, "-" + dmg, color);
  return p;
}
const castPop = st => anim(st.src, [
  { transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-62%) scale(1.12)" },
  { transform: "translate(-50%,-50%) scale(1)" }], 220, "ease-out");
function dirOf(a, b) { const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; return { x: dx / l, y: dy / l, l }; }

/** 刀光:刀光贴图当遮罩再填色,想要什么颜色就是什么颜色 */
function slashEl(st, size, color) {
  return el(st, { width: px(size), height: px(size), background: color,
    WebkitMaskImage: `url(${SRC.slash})`, maskImage: `url(${SRC.slash})`,
    WebkitMaskSize: "contain", maskSize: "contain", WebkitMaskRepeat: "no-repeat", maskRepeat: "no-repeat",
    WebkitMaskPosition: "center", maskPosition: "center" });
}
/** 从 p 迸开一把碎片:make(i) 返回 [元素, 宽, 高];每片随机方向飞出,关键帧里算好抛物线 */
function scatter(st, p, n, make, { dist = [30, 80], dur = 600, gravity = 0, spin = 0, up = false } = {}) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const [node, w, h] = make(i);
    const a = up ? rnd(-Math.PI * .95, -Math.PI * .05) : rnd(0, Math.PI * 2), d = rnd(dist[0], dist[1]), r0 = rnd(0, 360);
    const frames = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6, x = p.x + Math.cos(a) * d * t, y = p.y + Math.sin(a) * d * t + gravity * t * t;
      frames.push({ transform: tr(x, y, w, h, `rotate(${r0 + spin * t}deg) scale(${1 - t * .4})`), opacity: 1 - t * t });
    }
    all.push(anim(node, frames, dur).then(() => node.remove()));
  }
  return Promise.all(all);
}
const dot = (st, sz, css) => [el(st, { width: px(sz), height: px(sz), ...css }), sz, sz];

// ---------- 招式 ----------
const RUN = {
  // 剑:刀光沿前排从左扫到右,经过谁打中谁
  async sweep(st) {
    await castPop(st);
    const front = st.mobs.filter(m => m.row === 0).map(m => ({ m, p: at(st, m.el) }));
    const y = front[0].p.y, W = st.layer.offsetWidth, size = front[0].p.w * 1.4, x0 = W * .06, x1 = W * .94, dur = 340;
    const sw = W * .9, sh = size * .12;
    const streak = el(st, { width: px(sw), height: px(sh), borderRadius: "99px",
      background: "linear-gradient(90deg, rgba(242,230,184,0), rgba(242,230,184,.7) 70%, rgba(255,255,255,.9))" });
    anim(streak, [{ transform: tr(W / 2, y, sw, sh, "scaleX(.05)"), opacity: 0 },
      { transform: tr(W / 2, y, sw, sh, "scaleX(1)"), opacity: 1, offset: .8 },
      { transform: tr(W / 2, y, sw, sh, "scaleX(1)"), opacity: 0 }], dur + 220, EASE_IN).then(() => streak.remove());
    const path = lag => [
      { transform: tr(x0 - lag, y, size, size, "rotate(90deg) scale(1.5,.8)"), opacity: 0 },
      { transform: tr(x0 + (x1 - x0) * .08 - lag, y, size, size, "rotate(90deg) scale(1.5,.8)"), opacity: 1, offset: .1 },
      { transform: tr(x1 - lag, y, size, size, "rotate(90deg) scale(1.5,.8)"), opacity: 1, offset: .92 },
      { transform: tr(x1 - lag, y, size, size, "rotate(90deg) scale(1.5,.8)"), opacity: 0 }];
    [.3, .5].forEach((alpha, i) => { const g = slashEl(st, size, `rgba(242,230,184,${alpha})`);
      anim(g, path((2 - i) * size * .22), dur, EASE_IN).then(() => g.remove()); });
    const blade = slashEl(st, size, "#FFF6D6");
    const done = anim(blade, path(0), dur, EASE_IN).then(() => blade.remove());
    // ease-in 下刀光到达 x 的时刻约为 sqrt(路程占比)
    for (const f of front) {
      const k = Math.sqrt(Math.max(0, (f.p.x - x0) / (x1 - x0)));
      setTimeout(() => hit(st, f.m, 36, EL.metal, { x: 1, y: 0 }), T(dur * k));
    }
    await done;
  },

  // 剁:两刀交叉,一刀一段伤害;第二刀带出血
  async double(st) {
    await castPop(st);
    const m = st.mobs[1], p = at(st, m.el), size = p.w * 1.25;
    const chop = (rot, flip) => {
      const s = slashEl(st, size, "#F2EAD3");
      return anim(s, [
        { transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(${.6 * flip}, .6)`), opacity: 1 },
        { transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(${1.05 * flip}, 1.05)`), opacity: 1, offset: .45 },
        { transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(${1.2 * flip}, 1.2)`), opacity: 0 },
      ], 260, EASE_OUT).then(() => s.remove());
    };
    chop(-35, 1); await sleep(90); hit(st, m, 28, EL.metal, { x: .7, y: -.7 });
    await sleep(260);
    const second = chop(35, -1); await sleep(90); hit(st, m, 28, EL.metal, { x: -.7, y: -.7 });
    pop(st, p, "流血", "#B0242A", true, 26);
    scatter(st, { x: p.x, y: p.y + p.w * .12 }, 9,
      () => [el(st, { width: "5px", height: "8px", borderRadius: "50% 50% 50% 50% / 60% 60% 40% 40%", background: "#B0242A" }), 5, 8],
      { dist: [10, 40], dur: 650, gravity: 60 });
    await second;
  },

  // 炎:火球拖着火星沿弧线飞过去,炸开挂灼烧
  async fireball(st) {
    await castPop(st);
    const a = at(st, st.src), m = st.mobs[1], b = at(st, m.el), R = b.w * .32, H = st.layer.offsetHeight, dur = 320;
    const ball = el(st, { width: px(R), height: px(R), borderRadius: "50%",
      background: "radial-gradient(circle, #FFFBE6 0 18%, #FFC04A 40%, #E2552A 68%, rgba(214,72,36,0) 72%)",
      boxShadow: "0 0 14px 4px rgba(255,150,60,.55)" });
    const pos = t => { const e = t * t; return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e - Math.sin(t * Math.PI) * H * .08 }; };
    const frames = [];
    for (let s = 0; s <= 10; s++) { const t = s / 10, q = pos(t); frames.push({ transform: tr(q.x, q.y, R, R, `scale(${1 + .15 * Math.sin(t * Math.PI)})`) }); }
    const flight = anim(ball, frames, dur);
    // 火星:沿同一条轨迹提前算好的点,按时间先后各落一粒,原地往上飘散
    for (let i = 1; i <= 10; i++) {
      const t = i / 11, q = pos(t), sz = rnd(4, 8);
      const e = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: i % 2 ? "#FFC24A" : "#E0582A", opacity: 0 });
      anim(e, [{ transform: tr(q.x, q.y, sz, sz), opacity: 1 }, { transform: tr(q.x + rnd(-8, 8), q.y - rnd(10, 22), sz, sz, "scale(.3)"), opacity: 0 }],
        380, "linear", dur * t).then(() => e.remove());
    }
    await flight; ball.remove();
    hit(st, m, 40, EL.fire);
    pop(st, b, "灼烧 2", EL.fire, true, 26);
    const ring = el(st, { width: px(b.w), height: px(b.w), borderRadius: "50%", border: "4px solid #F08A3C" });
    anim(ring, [{ transform: tr(b.x, b.y, b.w, b.w, "scale(.2)"), opacity: 1 }, { transform: tr(b.x, b.y, b.w, b.w, "scale(1)"), opacity: 0 }], 360, EASE_OUT).then(() => ring.remove());
    await scatter(st, b, 16, () => dot(st, rnd(8, 15), { borderRadius: "50%", background: "radial-gradient(circle, #FFE08A, #F07A30 55%, rgba(200,60,30,0) 72%)" }),
      { dist: [25, 70], dur: 620, gravity: -30, up: true });
  },

  // 焚:火墙从我方一侧卷过整个敌阵
  async firewave(st) {
    await castPop(st);
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight, n = 18, fw = W / n * 1.5, fh = H * .2, dur = 760;
    const wall = el(st, { width: px(W), height: px(fh) });
    for (let i = 0; i < n; i++) {
      const t = document.createElement("div");
      Object.assign(t.style, { position: "absolute", bottom: "0", left: px(W * (i + .5) / n - fw / 2), width: px(fw), height: px(fh * rnd(.7, 1)),
        borderRadius: "50% 50% 45% 45% / 70% 70% 30% 30%",
        background: "linear-gradient(0deg, rgba(180,40,20,0) 0%, rgba(214,72,36,.9) 22%, rgba(255,160,60,.9) 58%, rgba(255,232,150,0) 100%)",
        transformOrigin: "50% 100%" });
      wall.appendChild(t);
      t.animate([{ transform: "scaleY(.8)" }, { transform: "scaleY(1.15)" }],
        { duration: T(rnd(110, 180)), iterations: Infinity, direction: "alternate", delay: -rnd(0, 150) });
    }
    const y0 = H * .8, y1 = -fh * .2;   // 火墙底边的起止
    anim(wall, [{ transform: `translate(0, ${y0 - fh}px)`, opacity: 1 },
      { transform: `translate(0, ${y0 + (y1 - y0) * .64 - fh}px)`, opacity: 1, offset: .8 },
      { transform: `translate(0, ${y1 - fh}px)`, opacity: 0 }], dur, EASE_IN).then(() => wall.remove());
    // 火墙顶端经过谁就烧谁(ease-in:进度 ≈ sqrt(路程占比))
    for (const m of st.mobs) {
      const p = at(st, m.el), top0 = y0 - fh, top1 = y1 - fh, k = Math.sqrt(Math.max(0, Math.min(1, (top0 - p.y) / (top0 - top1))));
      setTimeout(() => hit(st, m, 22, EL.fire, { x: 0, y: -1 }, .7), T(dur * k));
    }
    await sleep(dur);
  },

  // 冰:冰棱直射 → 碎屑 + 结霜
  async ice(st) {
    await castPop(st);
    const a = at(st, st.src), m = st.mobs[1], b = at(st, m.el), d = dirOf(a, b), rot = Math.atan2(d.y, d.x) * 180 / Math.PI;
    const L = b.w * .5, Wd = L * .28;
    const shard = el(st, { width: px(L), height: px(Wd), clipPath: "polygon(100% 50%, 30% 0, 0 50%, 30% 100%)",
      background: "linear-gradient(90deg, #8CC8EC, #F4FBFF 70%, #FFFFFF)" });
    const tl = el(st, { width: px(L * 2), height: "2px", background: "linear-gradient(90deg, rgba(170,215,245,0), rgba(170,215,245,.85))" });
    const fr = (t, w, h, lag) => ({ transform: tr(a.x + (b.x - a.x) * t - d.x * lag, a.y + (b.y - a.y) * t - d.y * lag, w, h, `rotate(${rot}deg)`) });
    anim(tl, [fr(0, L * 2, 2, L), fr(1, L * 2, 2, L)], 200, EASE_IN).then(() => tl.remove());
    await anim(shard, [fr(0, L, Wd, 0), fr(1, L, Wd, 0)], 200, EASE_IN); shard.remove();
    hit(st, m, 34, EL.water, d);
    pop(st, b, "冻结", EL.water, true, 26);
    anim(m.el, [{ filter: "brightness(1.35) saturate(.25) hue-rotate(160deg)" }, { filter: "brightness(1.15) saturate(.45) hue-rotate(160deg)", offset: .8 }, { filter: "none" }], 1100);
    const fs = b.w * .95;
    const frost = el(st, { width: px(fs), height: px(fs), borderRadius: "50%", border: "2px solid rgba(191,227,247,.95)",
      background: "repeating-conic-gradient(from 15deg, rgba(191,227,247,.55) 0 2deg, transparent 2deg 60deg)" });
    anim(frost, [{ transform: tr(b.x, b.y, fs, fs, "scale(.6)"), opacity: 0 },
      { transform: tr(b.x, b.y, fs, fs, "scale(1)"), opacity: 1, offset: .15 },
      { transform: tr(b.x, b.y, fs, fs, "scale(1)"), opacity: 1, offset: .75 },
      { transform: tr(b.x, b.y, fs, fs, "scale(1.05)"), opacity: 0 }], 1000).then(() => frost.remove());
    await scatter(st, b, 10, () => dot(st, rnd(6, 11), { clipPath: "polygon(50% 0, 100% 100%, 0 100%)", background: "#DDF1FF" }),
      { dist: [25, 65], dur: 520, gravity: 40, spin: 360 });
  },

  // 碎:石块抛起砸落 → 尘土 + 碎石 + 破甲
  async rock(st) {
    await castPop(st);
    const a = at(st, st.src), m = st.mobs[1], b = at(st, m.el), H = st.layer.offsetHeight, R = b.w * .36, dur = 460;
    const shape = "polygon(50% 0, 85% 12%, 100% 48%, 82% 88%, 45% 100%, 10% 82%, 0 42%, 18% 10%)";
    const rock = el(st, { width: px(R), height: px(R), clipPath: shape, background: "linear-gradient(135deg, #B8895A, #5E3E1F)" });
    const shw = R * 1.3, shh = R * .4, sy = b.y + b.w * .38;
    const shadow = el(st, { width: px(shw), height: px(shh), borderRadius: "50%", background: "rgba(58,42,24,.28)" });
    anim(shadow, [{ transform: tr(b.x, sy, shw, shh, "scale(.2)"), opacity: 0 }, { transform: tr(b.x, sy, shw, shh, "scale(1)"), opacity: 1 }], dur).then(() => shadow.remove());
    const frames = [];
    for (let s = 0; s <= 10; s++) {
      const t = s / 10, x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t - Math.sin(t * Math.PI) * H * .3;
      frames.push({ transform: tr(x, y, R, R, `rotate(${t * 300}deg) scale(${1 + .2 * Math.sin(t * Math.PI)})`) });
    }
    await anim(rock, frames, dur); rock.remove();
    hit(st, m, 45, EL.earth, { x: 0, y: 1 }, 1.8);
    pop(st, b, "破甲", EL.earth, true, 26);
    scatter(st, { x: b.x, y: b.y + b.w * .25 }, 8, () => dot(st, rnd(14, 24), { borderRadius: "50%", background: "rgba(150,130,105,.5)" }),
      { dist: [10, 40], dur: 720, gravity: -10 });
    await scatter(st, b, 12, () => dot(st, rnd(6, 12), { clipPath: shape, background: "#7A5230" }),
      { dist: [30, 80], dur: 620, gravity: 70, spin: 400, up: true });
  },

  // 藤:藤蔓甩出(SVG 描边生长)→ 缠两圈 → 停一会儿 → 松开收回
  async vine(st) {
    const a = at(st, st.src), m = st.mobs[0], b = at(st, m.el), d = dirOf(a, b);
    anim(st.src, [{ transform: "translate(-50%,-50%)" }, { transform: "translate(-50%,-50%) rotate(-8deg)", offset: .3 }, { transform: "translate(-50%,-50%)" }], 320, "ease-out");
    await sleep(90);
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight, nx = -d.y, ny = d.x;
    const p0 = { x: a.x + d.x * a.w * .3, y: a.y + d.y * a.w * .3 }, p3 = { x: b.x - d.x * b.w * .1, y: b.y - d.y * b.w * .1 };
    const c1 = { x: p0.x + (p3.x - p0.x) * .3 + nx * d.l * .35, y: p0.y + (p3.y - p0.y) * .3 + ny * d.l * .35 };
    const c2 = { x: p0.x + (p3.x - p0.x) * .7 - nx * d.l * .25, y: p0.y + (p3.y - p0.y) * .7 - ny * d.l * .25 };
    const rx = b.w * .42, ry = b.w * .16, steps = 64;
    let coil = "";
    for (let i = 0; i <= steps; i++) {       // 两圈椭圆螺旋,从上往下缠
      const t = i / steps, ang = t * 2 * Math.PI * 2 - Math.PI / 2, dy = (t - .5) * b.w * .55;
      coil += (i ? " L" : "M") + (b.x + Math.cos(ang) * rx).toFixed(1) + " " + (b.y + dy + Math.sin(ang) * ry).toFixed(1);
    }
    const whip = `M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} C${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)} ${p3.x.toFixed(1)} ${p3.y.toFixed(1)}`;
    const svg = el(st, { width: px(W), height: px(H) },
      `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible;display:block">
        <path class="whip" d="${whip}" fill="none" stroke="#2F7A3C" stroke-width="6" stroke-linecap="round"/>
        <path class="coil" d="${coil}" fill="none" stroke="#2F7A3C" stroke-width="5" stroke-linecap="round"/>
      </svg>`);
    const whipP = svg.querySelector(".whip"), coilP = svg.querySelector(".coil");
    const wl = whipP.getTotalLength(), cl = coilP.getTotalLength();
    whipP.style.strokeDasharray = `${wl} ${wl}`; whipP.style.strokeDashoffset = wl;
    coilP.style.strokeDasharray = `${cl} ${cl}`; coilP.style.strokeDashoffset = cl;
    const s = a.w * .22;
    const leaves = [.3, .55, .8].map(t => {
      const q = whipP.getPointAtLength(wl * t), q2 = whipP.getPointAtLength(Math.min(wl, wl * t + 2));
      const ang = Math.atan2(q2.y - q.y, q2.x - q.x) * 180 / Math.PI + 60;
      const lf = el(st, { width: px(s), height: px(s), backgroundImage: `url(${SRC.tengLeaf})`, backgroundSize: "contain", backgroundRepeat: "no-repeat",
        transform: tr(q.x, q.y, s, s, `rotate(${ang}deg) scale(0)`) });
      return { lf, q, ang };
    });
    await anim(whipP, [{ strokeDashoffset: wl }, { strokeDashoffset: 0 }], 260, EASE_OUT);
    leaves.forEach(L => anim(L.lf, [{ transform: tr(L.q.x, L.q.y, s, s, `rotate(${L.ang}deg) scale(0)`) },
      { transform: tr(L.q.x, L.q.y, s, s, `rotate(${L.ang}deg) scale(1)`) }], 160, EASE_OUT));
    await anim(coilP, [{ strokeDashoffset: cl }, { strokeDashoffset: 0 }], 260, EASE_OUT);
    hit(st, m, 24, EL.wood, d, .6);
    pop(st, b, "缠住 · 冻结", EL.wood, true, 26);
    anim(m.el, [{ transform: "translate(-50%,-50%)" }, { transform: "translate(-50%,-50%) scale(.93,1.02)", offset: .3 },
      { transform: "translate(-50%,-50%) scale(.95,1.01)", offset: .8 }, { transform: "translate(-50%,-50%)" }], 800);
    await sleep(650);
    leaves.forEach(L => anim(L.lf, [{ opacity: 1 }, { opacity: 0 }], 280));
    await anim(svg, [{ opacity: 1 }, { opacity: 0 }], 280);
    svg.remove(); leaves.forEach(L => L.lf.remove());
  },

  // 楸:三片叶扇形甩出,在目标身上汇合,命中带灼烧
  async leaves(st) {
    const a = at(st, st.src), m = st.mobs[2], b = at(st, m.el), d = dirOf(a, b), nx = -d.y, ny = d.x, s = a.w * .36;
    anim(st.src, [{ transform: "translate(-50%,-50%)" }, { transform: "translate(-50%,-50%) rotate(-12deg)", offset: .3 },
      { transform: "translate(-50%,-50%) rotate(8deg)", offset: .7 }, { transform: "translate(-50%,-50%)" }], 360, "ease-out");
    await sleep(90);
    const fly = (bend, delay) => {
      const cp = { x: (a.x + b.x) / 2 + nx * d.l * bend, y: (a.y + b.y) / 2 + ny * d.l * bend };
      const lf = el(st, { width: px(s), height: px(s), backgroundImage: `url(${SRC.qiuLeaf})`, backgroundSize: "contain", backgroundRepeat: "no-repeat", opacity: 0 });
      const frames = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10, u = 1 - t, x = u * u * a.x + 2 * u * t * cp.x + t * t * b.x, y = u * u * a.y + 2 * u * t * cp.y + t * t * b.y;
        frames.push({ transform: tr(x, y, s, s, `rotate(${t * 720}deg)`), opacity: 1 });
      }
      return anim(lf, frames, 360, "linear", delay).then(() => lf.remove());
    };
    const first = fly(.45, 0); fly(0, 60); fly(-.45, 120);
    await first;
    hit(st, m, 30, EL.wood, d);
    await sleep(130);
    pop(st, b, "灼烧 1", EL.fire, true, 26);
    await scatter(st, b, 8, () => dot(st, rnd(12, 18), { backgroundImage: `url(${SRC.qiuLeaf})`, backgroundSize: "contain", backgroundRepeat: "no-repeat" }),
      { dist: [25, 60], dur: 560, gravity: 40, spin: 500, up: true });
  },
};

async function play(st) {
  if (st.busy) return;
  st.busy = true;
  try { await RUN[st.v.id](st); await sleep(300); }
  catch (e) { console.error(st.v.id, e); }
  finally { st.busy = false; }
}

const gCast = document.getElementById("g-cast"), gSum = document.getElementById("g-sum");
for (const v of VARIANTS) (v.g === "cast" ? gCast : gSum).appendChild(buildStage(v));

const playAll = () => STAGES.forEach(play);
document.getElementById("play-all").addEventListener("click", playAll);
document.getElementById("slow").addEventListener("change", e => { speed = e.target.checked ? .3 : 1; });
const loopBox = document.getElementById("loop");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) loopBox.checked = false;
// 循环:每 0.2 秒看一眼,距上一轮满 2.8 秒(随慢放拉长)就再播一轮;忙着的格子自己跳过。
// 只用定时器,不等任何加载事件
let last = -1e9;
setInterval(() => {
  if (!loopBox.checked) return;
  const now = performance.now();
  if (now - last < T(2800)) return;
  last = now;
  playAll();
}, 200);
</script>

</body></html>
