<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>字斗 · 近战召唤物出手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局:顶部说明 + 控制条;六只近战召唤物各一格(3 列),每格 = 舞台 + 招牌动作 + 档位加码 */
:root {
  --bg: #F3EFE6;
  --fg: #11161F;
  --muted: #5C6371;
  --line: #D9D2C3;
  --card: #FBF8F1;
  --accent: #1F6333;
  --accent-soft: #E3F0E4;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
    --accent: #7FC08F; --accent-soft: #1E3A27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
  --accent: #7FC08F; --accent-soft: #1E3A27; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 72ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .toggle { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
.chip { font-size: 12px; border-radius: 99px; padding: 1px 9px; white-space: nowrap; color: #fff; }
.row { margin: 0; font-size: 13px; }
.row b { font-weight: 600; }
.row.muted { color: var(--muted); }
.replay { justify-self: start; font-size: 13px; padding: 4px 12px; }

.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 20%, #FBF7EE 0%, #F6F1E7 55%, #E9E1D0 100%); container-type: inline-size; }
.layer { position: absolute; inset: 0; }
.u { position: absolute; transform: translate(-50%, -50%); }
.mob { width: 16%; aspect-ratio: 1; }
.mob img, .ally img { position: absolute; inset: 0; width: 100%; height: 100%; }
.nm { position: absolute; left: 50%; bottom: -10%; transform: translateX(-50%); font-family: var(--font-display);
  font-size: 10px; color: #11161F; background: rgba(246,241,231,.85); padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.ally { width: 17%; aspect-ratio: 1; z-index: 6; }
.ally .disc { position: absolute; inset: 0; border-radius: 50%; background: #CCE6D0; box-shadow: inset 0 0 0 2px rgba(31,99,51,.35); }
.ally .nm { color: #1F6333; font-weight: 900; bottom: -16%; }
.fx { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; z-index: 5; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 4.6cqw;
  text-shadow: 0 1px 0 #fff, 0 0 5px rgba(255,255,255,.9); z-index: 7; pointer-events: none; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 84ch; }
</style>

<div class="wrap">
  <header>
    <h1>字斗 · 近战召唤物出手</h1>
    <p class="lede">五只会出手的近战召唤物,冲脸的骨架不变,各换一个按字意来的招牌动作;柘、荆是防守型(攻 0,不主动出手),改演「嘲讽 → 挨打 → 反伤」三拍;另外按稀有度叠一层「减半版」的档位:金档光环 + 光尾,橙档再加残影和更多粒子,红档再加光环脉冲。召唤物出手频率高,所以<b>不加顿帧、不写大字</b>。</p>
    <div class="controls">
      <button class="primary" id="play-all" type="button">全部播放</button>
      <label class="toggle" for="slow"><input type="checkbox" id="slow"> 慢放 ×0.3</label>
      <label class="toggle" for="loop"><input type="checkbox" id="loop" checked> 自动循环</label>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note">藤(缠绕)已有专属动作,这里不重复。柘、荆两格里冲过来的是敌人。档位加码只加光环、光尾、残影与粒子量,节拍和现在一样,召唤物一轮连打也不会拖慢战斗。</p>
</div>

  return node.animate(frames, { duration: T(ms), delay: T(delay), easing, fill: "both" }).finished.catch(() => {});
}
const EASE_IN = "cubic-bezier(.55,0,1,.45)", EASE_OUT = "cubic-bezier(0,.55,.45,1)";
const px = v => v + "px";
const tr = (x, y, w, h, extra = "") => `translate(${x - w / 2}px, ${y - h / 2}px) ${extra}`;
function el(st, css = {}, html = "") {
  const d = document.createElement("div");
  d.className = "fx"; d.innerHTML = html; Object.assign(d.style, css);
  st.layer.appendChild(d);
  return d;
}
function at(st, node) {
  const s = st.layer.getBoundingClientRect(), r = node.getBoundingClientRect();
  return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top, w: r.width, h: r.height };
}

const STAGES = [];
function buildStage(v) {
  const rr = RARITY[v.r];
  const panel = document.createElement("section");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-head"><h3>${v.name}<span class="chip" style="background:${rr.color}">${rr.name}</span></h3><span class="row muted">${v.passive}</span></div>
    <div class="stage"><div class="layer"></div></div>
    <p class="row"><b>招牌动作</b>:${v.sig}</p>
    <p class="row muted"><b>档位加码</b>:${v.def ? TIERTXT[v.r].replace("冲刺路上留一道金色光尾", "盾面挡下时加一道金边") : TIERTXT[v.r]}</p>
    <button class="replay" type="button">重播</button>`;
  const layer = panel.querySelector(".layer");
  const mobs = MOBS.map(m => {
    const d = document.createElement("div");
    d.className = "u mob"; d.style.left = m.x * 100 + "%"; d.style.top = m.y * 100 + "%";
    d.innerHTML = `<img src="${SRC[m.id + "b"]}" alt=""><img src="${SRC[m.id + "f"]}" alt=""><span class="nm">${m.name}</span>`;
    layer.appendChild(d);
    return { ...m, el: d };
  });
  const ally = document.createElement("div");
  ally.className = "u ally"; ally.style.left = v.def ? "50%" : "30%"; ally.style.top = "74%";
  ally.innerHTML = `<div class="disc"></div><img src="${SRC[v.id + "L"]}" alt=""><img src="${SRC[v.id + "B"]}" alt=""><span class="nm">${v.name}</span>`;
  layer.appendChild(ally);
  const st = { v, panel, layer, mobs, ally, color: rr.color, busy: false };
  panel.querySelector(".replay").addEventListener("click", () => play(st));
  STAGES.push(st);
  return panel;
}

// ---------- 共用 ----------
function pop(st, p, text, color) {
  const d = document.createElement("div");
  d.className = "pop"; d.textContent = text; d.style.color = color;
  d.style.left = px(p.x + p.w * .28); d.style.top = px(p.y - p.w * .22);
  st.layer.appendChild(d);
  anim(d, [{ transform: "translate(-50%,-50%) scale(.4)", opacity: 1 }, { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 },
    { transform: "translate(-50%,-110%) scale(1)", opacity: 1, offset: .7 }, { transform: "translate(-50%,-140%) scale(1)", opacity: 0 }], 780, "ease-out").then(() => d.remove());
}
function hit(st, mob, dmg, dir, heavy = 1, push = 9) {
  const p = at(st, mob.el);
  anim(mob.el, [
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
    { transform: `translate(calc(-50% + ${dir.x * push * heavy}px), calc(-50% + ${dir.y * push * heavy}px)) scale(1.06)`, filter: "brightness(1.9)", offset: .2 },
    { transform: `translate(calc(-50% - ${dir.x * 3}px), calc(-50% - ${dir.y * 3}px))`, filter: "brightness(1)", offset: .6 },
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" }], 320, "ease-out");
  anim(st.layer, [{ transform: "translate(0,0)" }, { transform: `translate(${dir.x * 5 * heavy}px, ${dir.y * 5 * heavy}px)` },
    { transform: `translate(${-dir.x * 3 * heavy}px, ${-dir.y * 3 * heavy}px)` }, { transform: "translate(0,0)" }], 220 + 40 * heavy);
  if (dmg) pop(st, p, "-" + dmg, WOOD);
  return p;
}
function ring(st, p, color, size, width = 3, dur = 380, inward = false) {
  const r = el(st, { width: px(size), height: px(size), borderRadius: "50%", border: `${width}px solid ${color}` });
  const a = inward ? 1 : .2, b = inward ? .3 : 1;
  return anim(r, [{ transform: tr(p.x, p.y, size, size, `scale(${a})`), opacity: 1 }, { transform: tr(p.x, p.y, size, size, `scale(${b})`), opacity: 0 }], dur, EASE_OUT).then(() => r.remove());
}
function scatter(st, p, n, make, { dist = [30, 80], dur = 600, gravity = 0, spin = 0, up = false } = {}) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const [node, w, h] = make(i);
    const a = up ? rnd(-Math.PI * .95, -Math.PI * .05) : rnd(0, Math.PI * 2), d = rnd(dist[0], dist[1]), r0 = rnd(0, 360);
    const frames = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6, x = p.x + Math.cos(a) * d * t, y = p.y + Math.sin(a) * d * t + gravity * t * t;
      frames.push({ transform: tr(x, y, w, h, `rotate(${r0 + spin * t}deg) scale(${1 - t * .4})`), opacity: 1 - t * t });
    }
    all.push(anim(node, frames, dur).then(() => node.remove()));
  }
  return Promise.all(all);
}
const leafDot = (st, sz, id) => [el(st, { width: px(sz), height: px(sz), backgroundImage: `url(${SRC[id + "L"]})`, backgroundSize: "contain", backgroundRepeat: "no-repeat" }), sz, sz];
function slashEl(st, size, color) {
  return el(st, { width: px(size), height: px(size), background: color,
    WebkitMaskImage: `url(${SRC.slash})`, maskImage: `url(${SRC.slash})`, WebkitMaskSize: "contain", maskSize: "contain",
    WebkitMaskRepeat: "no-repeat", maskRepeat: "no-repeat", WebkitMaskPosition: "center", maskPosition: "center" });
}
function slashAt(st, p, size, color, rot) {
  const s = slashEl(st, size, color);
  anim(s, [{ transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(.7)`), opacity: 1 },
    { transform: tr(p.x, p.y, size, size, `rotate(${rot}deg) scale(1.15)`), opacity: 0 }], 260, EASE_OUT).then(() => s.remove());
}

/** 冲脸骨架:蓄 → 冲到目标面前(可只冲一部分)→ 回调命中 → 退回。onPath(t, x, y) 每帧给出当前位置,档位光尾/残影挂在这里 */
async function dash(st, target, { reach = 1, onPath = null } = {}) {
  const a = at(st, st.ally), b = at(st, target.el), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, stop = (len - b.w * .45) * reach;
  await anim(st.ally, [{ transform: "translate(-50%,-50%)" }, { transform: `translate(calc(-50% - ${ux * 10}px), calc(-50% - ${uy * 10}px))` }], 80, EASE_OUT);
  const steps = 8;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, e = t * t;
    setTimeout(() => onPath && onPath(t, a.x + ux * stop * e, a.y + uy * stop * e), T(120 * t));
  }
  await anim(st.ally, [{ transform: `translate(calc(-50% - ${ux * 10}px), calc(-50% - ${uy * 10}px))` },
    { transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }], 120, EASE_IN);
  const back = () => anim(st.ally, [{ transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }, { transform: "translate(-50%,-50%)" }], 240, EASE_OUT, 60);
  return { a, b, ux, uy, back };
}

// ---------- 档位加码(减半版:不顿帧) ----------
function tierTrail(st) {
  const r = st.v.r, c = st.color;
  return (t, x, y) => {
    const sz = 7;
    const d = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: c, boxShadow: `0 0 6px ${c}` });
    anim(d, [{ transform: tr(x, y + rnd(-6, 6), sz, sz), opacity: .9 }, { transform: tr(x, y + rnd(-10, 10), sz, sz, "scale(.3)"), opacity: 0 }], 360).then(() => d.remove());
    if ((r === "orange" || r === "red") && (t === .5 || t === .75)) {   // 残影:本体的一帧淡影
      const ghost = st.ally.cloneNode(true);
      ghost.style.zIndex = 5; ghost.style.left = "0"; ghost.style.top = "0";
      const w = st.ally.offsetWidth;
      ghost.style.transform = tr(x, y, w, w);
      ghost.style.opacity = ".35"; ghost.style.filter = `drop-shadow(0 0 6px ${c})`;
      st.layer.appendChild(ghost);
      anim(ghost, [{ opacity: .35 }, { opacity: 0 }], 260).then(() => ghost.remove());
    }
    if (r === "red" && (t === .25 || t === .75)) ring(st, { x, y, w: 0 }, c, st.ally.offsetWidth * 1.6, 3, 360);
  };
}
const MORE = { gold: 1, orange: 1.5, red: 2 };
function tierImpact(st, p) { ring(st, p, st.color, p.w * 1.3, 3, 420); }

// ---------- 防守型(柘 / 荆):嘲讽 → 敌人打过来 → 挨打反应 → 反伤 ----------

/** 敌人冲到召唤物面前(与游戏里敌人近战同一个真身冲脸),命中那一刻回调 onHit,再退回 */
async function enemyDash(st, mob, onHit) {
  const a = at(st, mob.el), b = at(st, st.ally), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, stop = len - b.w * .5;
  mob.el.style.zIndex = 8;
  await anim(mob.el, [{ transform: "translate(-50%,-50%)" }, { transform: `translate(calc(-50% - ${ux * 10}px), calc(-50% - ${uy * 10}px))` }], 90, EASE_OUT);
  await anim(mob.el, [{ transform: `translate(calc(-50% - ${ux * 10}px), calc(-50% - ${uy * 10}px))` },
    { transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }], 130, EASE_IN);
  await onHit({ x: ux, y: uy }, b);
  await anim(mob.el, [{ transform: `translate(calc(-50% + ${ux * stop}px), calc(-50% + ${uy * stop}px))` }, { transform: "translate(-50%,-50%)" }], 240, EASE_OUT, 60);
  mob.el.style.zIndex = "";
}

/** ① 嘲讽:挑衅光环外扩 + 敌人到召唤物之间闪一道锁定虚线 */
async function taunt(st, mob, color) {
  const a = at(st, mob.el), b = at(st, st.ally), W = st.layer.offsetWidth, H = st.layer.offsetHeight;
  ring(st, b, "#D2553A", b.w * 1.8, 3, 460);
  const d = document.createElement("div");
  d.className = "pop"; d.textContent = "嘲讽"; d.style.color = "#D2553A"; d.style.fontSize = "3cqw";
  d.style.left = px(b.x); d.style.top = px(b.y - b.w * .75);
  st.layer.appendChild(d);
  anim(d, [{ transform: "translate(-50%,-50%) scale(.5)", opacity: 0 }, { transform: "translate(-50%,-60%) scale(1)", opacity: 1, offset: .3 },
    { transform: "translate(-50%,-70%) scale(1)", opacity: 0 }], 700).then(() => d.remove());
  const line = el(st, { width: px(W), height: px(H) }, `<svg width="${W}" height="${H}" style="display:block;overflow:visible">
    <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#D2553A" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/></svg>`);
  anim(line, [{ opacity: 0 }, { opacity: .9, offset: .25 }, { opacity: .9, offset: .7 }, { opacity: 0 }], 520).then(() => line.remove());
  await sleep(360);
}

function popAt(st, p, text, color) { pop(st, p, text, color); }

// ---------- 橙档加码(参照四木,但只有三拍:小蓄势 → 招牌 → 一个收尾;不做破土生根、叶旋)----------

/** 小蓄势:make(i) 造 count 个环绕物,绕本体转半圈;返回它们(调用方决定去向) */
async function orbitCharge(st, count, make, radius = .7) {
  const a = at(st, st.ally), items = Array.from({ length: count }, (_, i) => make(i));
  ring(st, a, st.color, a.w * 1.4, 3, 360);
  const steps = 16;
  for (let f = 0; f <= steps; f++) {
    setTimeout(() => items.forEach((g, i) => {
      const t = f / steps * Math.PI + i / count * Math.PI * 2, w = g.offsetWidth, h = g.offsetHeight;
      g.style.transform = tr(a.x + Math.cos(t) * a.w * radius, a.y + Math.sin(t) * a.w * radius * .6, w, h);
    }), T(f * 12));
  }
  await sleep(steps * 12 + 20);
  return items;
}
const glyphSeed = (st, ch, size, color) => {
  const g = el(st, { fontFamily: "var(--font-display)", fontWeight: 900, fontSize: size, color, lineHeight: 1, textShadow: `0 0 5px ${st.color}`, zIndex: 8 });
  g.textContent = ch; return g;
};
const petal = (st, sz, color) => el(st, { width: px(sz), height: px(sz), background: color, zIndex: 8,
  clipPath: "polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)" });

      g.remove();
      const ox = [-.55, .55, 0][i] * b.w, oy = [.05, .05, -.35][i] * b.w, tw = b.w * .22, th = b.w * .7;
      const t2 = el(st, { width: px(tw), height: px(th), borderRadius: "40% 40% 12% 12%", background: "linear-gradient(90deg, #5A3A1E, #8B5E34 45%, #5A3A1E)" });
      anim(t2, [{ transform: tr(b.x + ox, b.y + oy - th * 1.6, tw, th), opacity: 1 }, { transform: tr(b.x + ox, b.y + oy - th * .2, tw, th), opacity: 1, offset: .5 },
        { transform: tr(b.x + ox, b.y + oy - th * .1, tw, th, "scaleY(.9)"), opacity: 0 }], 420, EASE_IN, 40 * i).then(() => t2.remove());
    });
    // 树干从天砸下
    const tw = b.w * .45, th = b.w * 1.3, trunk = el(st, { width: px(tw), height: px(th), borderRadius: "40% 40% 12% 12%",
      background: "linear-gradient(90deg, #5A3A1E, #8B5E34 45%, #5A3A1E)", boxShadow: "inset 0 0 0 3px rgba(40,25,10,.35)" });
    await anim(trunk, [{ transform: tr(b.x, b.y - th * 1.4, tw, th), opacity: 1 }, { transform: tr(b.x, b.y - th * .25, tw, th), opacity: 1 }], 140, EASE_IN);
    hit(st, m, 48, { x: 0, y: 1 }, 2.2); tierImpact(st, b);
    anim(trunk, [{ transform: tr(b.x, b.y - th * .25, tw, th), opacity: 1 }, { transform: tr(b.x, b.y - th * .15, tw, th, "scaleY(.9)"), opacity: 0 }], 260, "linear", 80).then(() => trunk.remove());
    back();
    scatter(st, { x: b.x, y: b.y + b.w * .3 }, Math.round(8 * MORE[st.v.r]), () => { const sz = rnd(14, 24);
      return [el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "rgba(150,130,105,.5)" }), sz, sz]; }, { dist: [20, 60], dur: 700, gravity: -10 });
    ring(st, b, st.color, b.w * 2.2, 5, 520);   // 收尾:一圈橙色冲击环
    await scatter(st, b, Math.round(5 * MORE[st.v.r]), () => leafDot(st, rnd(14, 20), "sen"), { dist: [30, 70], dur: 560, gravity: 60, spin: 400, up: true });
  },
  async gui(st) {
    const m = st.mobs[1], trail = tierTrail(st);
    const blooms = await orbitCharge(st, 6, i => petal(st, 10, i % 2 ? "#F2C14E" : "#FFF1C2"), .62);
    blooms.forEach(f => anim(f, [{ opacity: 1 }, { opacity: 0 }], 160).then(() => f.remove()));
    const { b, ux, uy, back } = await dash(st, m, { onPath: (t, x, y) => {
      trail(t, x, y);
      for (let i = 0; i < 2; i++) {   // 桂花香尾:黄色小花一路撒
        const sz = rnd(5, 8), f = el(st, { width: px(sz), height: px(sz), background: "#F2C14E",
          clipPath: "polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)" });
        anim(f, [{ transform: tr(x + rnd(-10, 10), y + rnd(-10, 10), sz, sz), opacity: 1 },
          { transform: tr(x + rnd(-14, 14), y + rnd(8, 22), sz, sz, "rotate(180deg)"), opacity: 0 }], 700).then(() => f.remove());
      }
    } });
    slashAt(st, b, b.w * 1.1, "#F2D58A", rnd(-25, 25));
    hit(st, m, 34, { x: ux, y: uy }); tierImpact(st, b);
    ring(st, b, "rgba(242,193,78,.8)", b.w * 1.4, 2, 520);
    // 收尾:一朵八瓣花形光环外扩
    for (let i = 0; i < 8; i++) {
      const ang = i / 8 * Math.PI * 2, sz = b.w * .32, pe = petal(st, sz, i % 2 ? "rgba(242,193,78,.85)" : "rgba(225,121,27,.8)");
      anim(pe, [{ transform: tr(b.x, b.y, sz, sz, `rotate(${ang * 180 / Math.PI}deg) scale(.2)`), opacity: 1 },
        { transform: tr(b.x + Math.cos(ang) * b.w * .8, b.y + Math.sin(ang) * b.w * .6, sz, sz, `rotate(${ang * 180 / Math.PI + 90}deg) scale(1)`), opacity: 0 }], 520, EASE_OUT).then(() => pe.remove());
    }
    back();
    // 花雨:慢慢飘落
    const all = [];
    for (let i = 0; i < Math.round(10 * MORE[st.v.r]); i++) {
      const sz = rnd(6, 10), x0 = b.x + rnd(-b.w * .7, b.w * .7), y0 = b.y - b.w * .6;
      const f = el(st, { width: px(sz), height: px(sz), background: i % 3 ? "#F2C14E" : "#FFF1C2",
        clipPath: "polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)" });
      all.push(anim(f, [{ transform: tr(x0, y0, sz, sz), opacity: 0 }, { transform: tr(x0 + rnd(-10, 10), y0 + b.w * .4, sz, sz, "rotate(120deg)"), opacity: 1, offset: .3 },
        { transform: tr(x0 + rnd(-20, 20), y0 + b.w * 1.3, sz, sz, "rotate(300deg)"), opacity: 0 }], 900, "linear", rnd(0, 200)).then(() => f.remove()));
    }
    await Promise.all(all);
  },
  async zao(st) {
    const m = st.mobs[1];
    const a0 = at(st, st.ally);
    ring(st, a0, "#6FB3E0", a0.w * 1.8, 3, 380, true);   // 小蓄势:一圈水环往身上收
    ring(st, a0, st.color, a0.w * 1.5, 2, 380, true);
    await sleep(260);
    const { a, b, ux, uy, back } = await dash(st, m, { reach: .45, onPath: tierTrail(st) });
    // 藻鞭:一道起伏的绿线从半程处甩到目标,描边生长
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight;
    const len = Math.hypot(b.x - a.x, b.y - a.y), start = { x: a.x + (b.x - a.x) * .42, y: a.y + (b.y - a.y) * .42 };
    const nx = -uy, ny = ux, pts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24, amp = Math.sin(t * Math.PI) * len * .06;
      pts.push(`${(start.x + (b.x - start.x) * t + nx * Math.sin(t * Math.PI * 3) * amp).toFixed(1)} ${(start.y + (b.y - start.y) * t + ny * Math.sin(t * Math.PI * 3) * amp).toFixed(1)}`);
    }
    const svg = el(st, { width: px(W), height: px(H) }, `<svg width="${W}" height="${H}" style="overflow:visible;display:block">
      <path d="M${pts.join(" L")}" fill="none" stroke="#2E7D5B" stroke-width="6" stroke-linecap="round"/>
      <path d="M${pts.join(" L")}" fill="none" stroke="#9FD6B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 10"/></svg>`);
    const paths = svg.querySelectorAll("path"), L = paths[0].getTotalLength();
    paths[0].style.strokeDasharray = `${L} ${L}`;
    paths[0].style.strokeDashoffset = L;
    await anim(paths[0], [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], 160, EASE_OUT);
    hit(st, m, 30, { x: ux, y: uy }); tierImpact(st, b);
    scatter(st, b, Math.round(9 * MORE[st.v.r]), () => { const sz = rnd(6, 11);
      return [el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "#6FB3E0" }), sz, sz]; },
      { dist: [25, 60], dur: 480, gravity: 120, up: true });
    anim(svg, [{ opacity: 1 }, { opacity: 0 }], 260, "linear", 80).then(() => svg.remove());
    // 收尾:反方向再抽一鞭,第二次溅水 + 橙环
    await sleep(160);
    const pts2 = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24, amp = Math.sin(t * Math.PI) * len * .07;
      pts2.push(`${(start.x + (b.x - start.x) * t - nx * Math.sin(t * Math.PI * 3) * amp).toFixed(1)} ${(start.y + (b.y - start.y) * t - ny * Math.sin(t * Math.PI * 3) * amp).toFixed(1)}`);
    }
    const svg2 = el(st, { width: px(W), height: px(H) }, `<svg width="${W}" height="${H}" style="overflow:visible;display:block">
      <path d="M${pts2.join(" L")}" fill="none" stroke="#2E7D5B" stroke-width="7" stroke-linecap="round"/></svg>`);
    const p2 = svg2.querySelector("path"), L2 = p2.getTotalLength();
    p2.style.strokeDasharray = `${L2} ${L2}`; p2.style.strokeDashoffset = L2;
    await anim(p2, [{ strokeDashoffset: L2 }, { strokeDashoffset: 0 }], 140, EASE_OUT);
    hit(st, m, 24, { x: -ux, y: uy }, 1.2);
    ring(st, b, st.color, b.w * 1.9, 4, 480);
    scatter(st, b, 12, () => { const sz = rnd(6, 12);
      return [el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "#6FB3E0" }), sz, sz]; }, { dist: [30, 75], dur: 520, gravity: 120, up: true });
    anim(svg2, [{ opacity: 1 }, { opacity: 0 }], 260, "linear", 80).then(() => svg2.remove());
    back();
    await sleep(420);
  },
  // 四木(红):四木合围,生根成林 —— 蓄势(四个「木」绕身)→ 冲刺 → 四角合围四斩 → 破土生根 + 叶旋 + 红绿双环
  async simu(st) {
    const m = st.mobs[1], red = st.color, green = "#4FA85A", trail = tierTrail(st);
    const a0 = at(st, st.ally);
    // ① 蓄势:红光一圈,四个红金「木」字绕身转
    ring(st, a0, red, a0.w * 1.6, 4, 420);
    anim(st.ally, [{ filter: "brightness(1) drop-shadow(0 0 0 transparent)" }, { filter: `brightness(1.25) drop-shadow(0 0 10px ${red})` },
      { filter: "brightness(1) drop-shadow(0 0 0 transparent)" }], 520);
    const seeds = [0, 1, 2, 3].map(i => {
      const g = el(st, { fontFamily: "var(--font-display)", fontWeight: 900, fontSize: "4.2cqw", color: "#FFD27A", lineHeight: 1,
        textShadow: `0 0 6px ${red}, 0 0 2px #fff`, zIndex: 8 });
      g.textContent = "木";
      return g;
    });
    const orbit = (cx, cy, r, phase) => seeds.forEach((g, i) => {
      const t = phase + i * Math.PI / 2, w = g.offsetWidth, h = g.offsetHeight;
      g.style.transform = tr(cx + Math.cos(t) * r, cy + Math.sin(t) * r * .6, w, h);
    });
    const spin = 26;
    for (let f = 0; f <= spin; f++) { setTimeout(() => orbit(a0.x, a0.y, a0.w * .75, f / spin * Math.PI * 1.5), T(f * 12)); }
    await sleep(spin * 12 + 20);

    // ② 冲刺:红档残影 / 光尾 / 光环脉冲,四个「木」跟着转过去
    let cur = { x: a0.x, y: a0.y };
    const { b, ux, uy, back } = await dash(st, m, { onPath: (t, x, y) => {
      trail(t, x, y); cur = { x, y };
      orbit(x, y, a0.w * .75, Math.PI * 1.5 + t * Math.PI);
      if (t === .5 || t === 1) ring(st, { x, y, w: 0 }, "#7CC47F", st.ally.offsetWidth * 2, 3, 420);
    } });

    // ③ 合围:四个「木」飞到目标四角,各化一道刀光同时向内斩,交成米字
    const R = b.w * .95, corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    await Promise.all(seeds.map((g, i) => {
      const w = g.offsetWidth, h = g.offsetHeight, [cx, cy] = corners[i];
      return anim(g, [{ transform: g.style.transform, opacity: 1 },
        { transform: tr(b.x + cx * R * .7, b.y + cy * R * .55, w, h, "scale(1.3)"), opacity: 1 }], 140, EASE_OUT);
    }));
    seeds.forEach(g => anim(g, [{ opacity: 1 }, { opacity: 0 }], 120).then(() => g.remove()));
    corners.forEach(([cx, cy], i) => slashAt(st, b, b.w * 1.5, i % 2 ? "#FFD27A" : "#A8E0A0", Math.atan2(cy, cx) * 180 / Math.PI + 90));
    slashAt(st, b, b.w * 1.6, "#FFFFFF", 0); slashAt(st, b, b.w * 1.6, "#FFFFFF", 90);
    hit(st, m, 68, { x: ux, y: uy }, 2.2); tierImpact(st, b);
    back();

    // ④ 生根:脚下破土三道粗根往上缠 + 叶片旋涡再炸开 + 红绿双环
    await sleep(120);
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight, base = b.y + b.w * .55;
    const roots = [-.35, 0, .35].map(o => {
      const x0 = b.x + o * b.w, pts = [];
      for (let i = 0; i <= 12; i++) { const t = i / 12;
        pts.push(`${(x0 + Math.sin(t * Math.PI * 2 + o * 5) * b.w * .16 * (1 - t * .3)).toFixed(1)} ${(base - t * b.w * 1.05).toFixed(1)}`); }
      return `M${pts.join(" L")}`;
    });
    const svg = el(st, { width: px(W), height: px(H), zIndex: 6 }, `<svg width="${W}" height="${H}" style="display:block;overflow:visible">
      ${roots.map((d, i) => `<path d="${d}" fill="none" stroke="${i === 1 ? "#6B4524" : "#4E7A34"}" stroke-width="${i === 1 ? 9 : 7}" stroke-linecap="round"/>`).join("")}</svg>`);
    const paths = [...svg.querySelectorAll("path")];
    paths.forEach(pa => { const L = pa.getTotalLength(); pa.style.strokeDasharray = `${L} ${L}`; pa.style.strokeDashoffset = L; pa.dataset.l = L; });
    scatter(st, { x: b.x, y: base }, 10, () => { const sz = rnd(10, 18);
      return [el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "rgba(120,95,60,.55)" }), sz, sz]; }, { dist: [20, 50], dur: 600, gravity: -20 });
    anim(st.layer, [{ transform: "translate(0,0)" }, { transform: "translate(0,6px)" }, { transform: "translate(0,-4px)" }, { transform: "translate(0,2px)" }, { transform: "translate(0,0)" }], 320);
    await Promise.all(paths.map((pa, i) => anim(pa, [{ strokeDashoffset: pa.dataset.l }, { strokeDashoffset: 0 }], 260, EASE_OUT, i * 50)));
    // 叶片旋涡:绕目标转一圈半再往外炸
    const leaves = [];
    for (let i = 0; i < 12; i++) {
      const sz = rnd(16, 24), lf = el(st, { width: px(sz), height: px(sz), backgroundImage: `url(${SRC.simuL})`, backgroundSize: "contain", backgroundRepeat: "no-repeat", zIndex: 7 });
      const ph = i / 12 * Math.PI * 2, frames = [];
      for (let s2 = 0; s2 <= 12; s2++) {
        const t = s2 / 12, ang = ph + t * Math.PI * 3, r = b.w * (.35 + t * t * .9);
        frames.push({ transform: tr(b.x + Math.cos(ang) * r, b.y + Math.sin(ang) * r * .7 - t * b.w * .2, sz, sz, `rotate(${t * 540}deg)`), opacity: t < .85 ? 1 : (1 - t) / .15 });
      }
      leaves.push(anim(lf, frames, 700).then(() => lf.remove()));
    }
    ring(st, b, red, b.w * 2.4, 5, 560);
    setTimeout(() => ring(st, b, "#7CC47F", b.w * 3, 4, 620), T(120));
    pop(st, { ...b, y: b.y - b.w * .3 }, "生根", "#4E7A34");
    await Promise.all(leaves);
    anim(svg, [{ opacity: 1 }, { opacity: 0 }], 300).then(() => svg.remove());
    await sleep(200);
  },
};

async function play(st) {
  if (st.busy) return;
  st.busy = true;
  try { await (st.v.def ? RUN_DEF[st.v.id](st) : RUN[st.v.id](st)); await sleep(300); }
  catch (e) { console.error(st.v.id, e); }
  finally { st.busy = false; }
}

const grid = document.getElementById("grid");
for (const v of SUMMONS) grid.appendChild(buildStage(v));
const playAll = () => STAGES.forEach(play);
document.getElementById("play-all").addEventListener("click", playAll);
document.getElementById("slow").addEventListener("change", e => { speed = e.target.checked ? .3 : 1; });
const loopBox = document.getElementById("loop");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) loopBox.checked = false;
// 循环只靠定时器:每 0.2 秒看一眼,距上一轮满 2.6 秒(随慢放拉长)就再播一轮,忙着的格子自己跳过
let last = -1e9;
setInterval(() => {
  if (!loopBox.checked) return;
  const now = performance.now();
  if (now - last < T(2600)) return;
  last = now;
  playAll();
}, 200);
</script>
