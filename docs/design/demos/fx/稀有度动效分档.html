<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>字斗 · 稀有度动效分档</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局:顶部说明 + 控制条;每个招式一行,五档(常规 / 精良 / 华彩 / 奥义 / 绝技)并排,从左到右逐档加码 */
:root {
  --bg: #F3EFE6;
  --fg: #11161F;
  --muted: #5C6371;
  --line: #D9D2C3;
  --card: #FBF8F1;
  --accent: #8A6600;
  --accent-soft: #F6EDD5;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
    --accent: #D9B25A; --accent-soft: #2A2415; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --fg: #E9E4D8; --muted: #9AA0A8; --line: #2B323C; --card: #1A2028;
  --accent: #D9B25A; --accent-soft: #2A2415; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
.wrap { max-width: 1360px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 6px 0 0; }
.lede { margin: 0; color: var(--muted); max-width: 72ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .toggle { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; }
.tiers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1200px) { .tiers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .tiers { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0; display: flex; align-items: center; gap: 7px; }
.chip { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sub { font-size: 12px; color: var(--muted); }
.desc { margin: 0; font-size: 12.5px; color: var(--muted); min-height: 3.2em; }
.replay { justify-self: start; font-size: 13px; padding: 3px 11px; }

/* ---- 舞台 ---- */
.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 6px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 20%, #FBF7EE 0%, #F6F1E7 55%, #E9E1D0 100%); container-type: inline-size; }
.cam { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; }
.brush { position: absolute; left: 0; z-index: 4; pointer-events: none; }
.u { position: absolute; transform: translate(-50%, -50%); }
.mob { width: 17%; aspect-ratio: 1; }
.mob img { position: absolute; inset: 0; width: 100%; height: 100%; }
.nm { position: absolute; left: 50%; bottom: -10%; transform: translateX(-50%); font-family: var(--font-display);
  font-size: 10px; color: #11161F; background: rgba(246,241,231,.85); padding: 0 5px; border-radius: 4px; white-space: nowrap; }
.hand { width: 10%; aspect-ratio: .8; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 900; color: #fff; font-size: 5cqw; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.fx { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; z-index: 5; }
.dim { position: absolute; inset: 0; background: #0B0E13; z-index: 8; pointer-events: none; opacity: 0; }
.bigglyph { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none;
  font-family: var(--font-display); font-weight: 900; font-size: 38cqw; line-height: 1; color: #F6F1E7;
  text-shadow: 0 0 .06em rgba(246,241,231,.5); opacity: 0; }
.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 900; font-size: 5cqw;
  text-shadow: 0 1px 0 #fff, 0 0 5px rgba(255,255,255,.9); z-index: 7; pointer-events: none; white-space: nowrap; }
.pop.s { font-size: 3.2cqw; }
.seal { position: absolute; z-index: 9; pointer-events: none; font-family: var(--font-display); font-weight: 900; color: #F6F1E7;
  background: #B3242A; border-radius: 6%; display: grid; place-items: center; line-height: 1; opacity: 0; }
.flash { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; max-width: 84ch; }
</style>

<div class="wrap">
  <header>
    <h1>字斗 · 稀有度动效分档</h1>
    <p class="lede">同一个招式,档位越高越隆重。常规档保持现在的样子;精良只加一点量;华彩多出手前的蓄势、金色拖尾,命中时顿帧 + 镜头推近;奥义(橙)先有一支巨笔横扫全屏,出招分身夹击;绝技(红)压暗全屏写出大字、墨溅落印,出招再大一档。每行五格从左到右逐档对比。</p>
    <div class="controls">
      <button class="primary" id="play-all" type="button">全部播放</button>
      <label class="toggle" for="slow"><input type="checkbox" id="slow"> 慢放 ×0.3</label>
      <label class="toggle" for="loop"><input type="checkbox" id="loop" checked> 自动循环</label>
    </div>
  </header>
  <h2>火球(炎 这一类)</h2>
  <div class="tiers" id="row-fire"></div>
  <h2>双刀连剁(剁 这一类)</h2>
  <div class="tiers" id="row-chop"></div>
  <p class="note">字牌上的字只是示意这一档常见的字;招式本身相同,变的只是档位。奥义与绝技在游戏里还有两条节奏保护:同一回合第二次出同一张字跳过写大字,按住加速时写大字那一段一并压缩。</p>
</div>

  panel.innerHTML = `
    <div class="panel-head"><h3><span class="chip" style="background:${tier.color}"></span>${tier.name}</h3><span class="sub">${tier.sub}</span></div>
    <div class="stage"><div class="cam"><div class="layer"></div></div></div>
    <p class="desc">${tier.desc[kind]}</p>
    <button class="replay" type="button">重播</button>`;
  const layer = panel.querySelector(".layer");
  const mobs = MOBS.map(m => {
    const d = document.createElement("div");
    d.className = "u mob"; d.style.left = m.x * 100 + "%"; d.style.top = m.y * 100 + "%";
    d.innerHTML = `<img src="${SRC[m.id + "b"]}" alt=""><img src="${SRC[m.id + "f"]}" alt=""><span class="nm">${m.name}</span>`;
    layer.appendChild(d);
    return { ...m, el: d };
  });
  const hand = document.createElement("div");
  hand.className = "u hand"; hand.style.left = "50%"; hand.style.top = "84%";
  hand.style.background = HAND_BG[kind]; hand.textContent = HANDS[kind][tier.k];
  hand.style.boxShadow = tier.k ? `0 0 0 2px ${tier.color}, 0 2px 0 rgba(0,0,0,.18)` : "";
  layer.appendChild(hand);
  const st = { kind, tier, panel, layer, cam: panel.querySelector(".cam"), mobs, hand, busy: false };
  panel.querySelector(".replay").addEventListener("click", () => play(st));
  STAGES.push(st);
  return panel;
}

// ---------- 共用:飘字 / 受击 / 光环 / 屏闪 / 碎片 ----------
function pop(st, p, text, color, small = false, dy = 0, scale = 1) {
  const d = document.createElement("div");
  d.className = "pop" + (small ? " s" : "");
  d.textContent = text; d.style.color = color;
  d.style.left = px(p.x + p.w * .28); d.style.top = px(p.y - p.w * .22 + dy);
  st.layer.appendChild(d);
  anim(d, [
    { transform: `translate(-50%,-50%) scale(${.4 * scale})`, opacity: 1 },
    { transform: `translate(-50%,-80%) scale(${1.15 * scale})`, opacity: 1, offset: .25 },
    { transform: `translate(-50%,-110%) scale(${scale})`, opacity: 1, offset: .7 },
    { transform: `translate(-50%,-140%) scale(${scale})`, opacity: 0 },
  ], 820, "ease-out").then(() => d.remove());
}
function hit(st, mob, dmg, color, dir, heavy) {
  const p = at(st, mob.el);
  anim(mob.el, [
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
    { transform: `translate(calc(-50% + ${dir.x * 9 * heavy}px), calc(-50% + ${dir.y * 9 * heavy}px)) scale(${1 + .05 * heavy})`, filter: "brightness(1.9)", offset: .2 },
    { transform: `translate(calc(-50% - ${dir.x * 4}px), calc(-50% - ${dir.y * 4}px))`, filter: "brightness(1)", offset: .6 },
    { transform: "translate(-50%,-50%)", filter: "brightness(1)" },
  ], 300 + 40 * heavy, "ease-out");
  anim(st.layer, [
    { transform: "translate(0,0)" }, { transform: `translate(${dir.x * 5 * heavy}px, ${dir.y * 5 * heavy}px)` },
    { transform: `translate(${-dir.x * 3 * heavy}px, ${-dir.y * 3 * heavy}px)` }, { transform: `translate(${dir.x * heavy}px, ${dir.y * heavy}px)` },
    { transform: "translate(0,0)" },
  ], 220 + 30 * heavy);
  if (dmg) pop(st, p, "-" + dmg, color, false, 0, 1 + .12 * st.tier.k);
  return p;
}
function ring(st, p, color, size, width = 4, dur = 380) {
  const r = el(st, { width: px(size), height: px(size), borderRadius: "50%", border: `${width}px solid ${color}` });
  return anim(r, [{ transform: tr(p.x, p.y, size, size, "scale(.2)"), opacity: 1 }, { transform: tr(p.x, p.y, size, size, "scale(1)"), opacity: 0 }], dur, EASE_OUT).then(() => r.remove());
}
function flash(st, color, alpha, dur = 220) {
  const f = el(st, { background: color }, "flash");
  anim(f, [{ opacity: alpha }, { opacity: 0 }], dur).then(() => f.remove());
}
function scatter(st, p, n, make, { dist = [30, 80], dur = 600, gravity = 0, spin = 0, up = false } = {}) {
  const all = [];
  for (let i = 0; i < n; i++) {
    const [node, w, h] = make(i);
    const a = up ? rnd(-Math.PI * .95, -Math.PI * .05) : rnd(0, Math.PI * 2), d = rnd(dist[0], dist[1]), r0 = rnd(0, 360);
    const frames = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6, x = p.x + Math.cos(a) * d * t, y = p.y + Math.sin(a) * d * t + gravity * t * t;
      frames.push({ transform: tr(x, y, w, h, `rotate(${r0 + spin * t}deg) scale(${1 - t * .4})`), opacity: 1 - t * t });
    }
    all.push(anim(node, frames, dur).then(() => node.remove()));
  }
  return Promise.all(all);
}
const dot = (st, sz, css) => [el(st, { width: px(sz), height: px(sz), ...css }), sz, sz];
function slashEl(st, size, color, glow) {
  return el(st, { width: px(size), height: px(size), background: color,
    WebkitMaskImage: `url(${SRC.slash})`, maskImage: `url(${SRC.slash})`,
    WebkitMaskSize: "contain", maskSize: "contain", WebkitMaskRepeat: "no-repeat", maskRepeat: "no-repeat",
    WebkitMaskPosition: "center", maskPosition: "center", filter: glow ? `drop-shadow(0 0 6px ${glow})` : "" });
}

// ---------- 档位加码 ----------

/** 命中顿帧 + 镜头推近(华彩起):舞台上所有动画按住一小会儿,镜头朝落点推 5% 再回来 */
async function impactFreeze(st, p) {
  const ms = FREEZE[st.tier.k];
  if (!ms) return;
  const running = st.layer.getAnimations({ subtree: true });
  running.forEach(a => a.pause());
  st.cam.style.transformOrigin = `${p.x}px ${p.y}px`;
  const zoom = st.cam.animate([{ transform: "scale(1)" }, { transform: "scale(1.06)", offset: .35 }, { transform: "scale(1)" }],
    { duration: T(ms + 220), easing: "ease-out" });
  await new Promise(r => setTimeout(r, T(ms)));
  running.forEach(a => { try { a.play(); } catch (e) {} });
  await zoom.finished.catch(() => {});
}

/** 金屑:星形小片,华彩起的落点 */
function goldBits(st, p, color, n) {
  return scatter(st, p, n, () => dot(st, rnd(6, 10), { clipPath: "polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)",
    background: color, filter: `drop-shadow(0 0 4px ${color})` }), { dist: [35, 90], dur: 620, gravity: 30, spin: 360 });
}

/** 奥义:一支巨笔从左到右横扫整个舞台,边缘泛橙光,笔尾甩出墨点 */
async function brushSwipe(st) {
  const W = st.layer.offsetWidth, H = st.layer.offsetHeight, h = H * .3, y = H * .5 - h / 2, c = st.tier.color;
  const b = el(st, { top: px(y), width: px(W), height: px(h),
    background: `linear-gradient(180deg, transparent 0%, ${c}55 8%, #11161F 18%, #1E2430 50%, #11161F 82%, ${c}55 92%, transparent 100%)`,
    WebkitMaskImage: "repeating-linear-gradient(180deg, #000 0 7px, rgba(0,0,0,.55) 7px 9px), linear-gradient(90deg, rgba(0,0,0,.25), #000 12%, #000 80%, rgba(0,0,0,.6) 100%)",
    maskImage: "repeating-linear-gradient(180deg, #000 0 7px, rgba(0,0,0,.55) 7px 9px), linear-gradient(90deg, rgba(0,0,0,.25), #000 12%, #000 80%, rgba(0,0,0,.6) 100%)",
    WebkitMaskComposite: "source-in", maskComposite: "intersect", opacity: .88 }, "brush");
  await anim(b, [{ clipPath: "inset(0 100% 0 0 round 40px)" }, { clipPath: "inset(0 0 0 0 round 40px)" }], 260, EASE_OUT);
  // 笔尾甩墨
  for (let i = 0; i < 12; i++) {
    const sz = rnd(5, 12), x0 = W * .92, y0 = H * .5 + rnd(-h * .4, h * .4);
    const d = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "#11161F", zIndex: 4 });
    anim(d, [{ transform: tr(x0, y0, sz, sz), opacity: .9 }, { transform: tr(x0 + rnd(10, 50), y0 + rnd(-40, 40), sz, sz, "scale(.6)"), opacity: 0 }], 420, EASE_OUT).then(() => d.remove());
  }
  anim(st.layer, [{ transform: "translate(0,0)" }, { transform: "translate(6px,0)" }, { transform: "translate(-3px,0)" }, { transform: "translate(0,0)" }], 200);
  anim(b, [{ opacity: .88, filter: "blur(0px)" }, { opacity: 0, filter: "blur(3px)" }], 420, "ease-in", 120).then(() => b.remove());
  await sleep(120);
}
async function charge(st) {
  const c = st.tier.color, p = at(st, st.hand);
  anim(st.hand, [{ transform: "translate(-50%,-50%) scale(1)", boxShadow: `0 0 0 2px ${c}` },
    { transform: "translate(-50%,-56%) scale(1.1)", boxShadow: `0 0 0 3px ${c}, 0 0 22px 6px ${c}` },
    { transform: "translate(-50%,-50%) scale(1)", boxShadow: `0 0 0 2px ${c}, 0 2px 0 rgba(0,0,0,.18)` }], 360, "ease-in-out");
  // 光点从四周往牌上收
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2, r = p.w * 1.3, sz = rnd(4, 7);
    const d = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: c, boxShadow: `0 0 6px ${c}` });
    anim(d, [{ transform: tr(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, sz, sz), opacity: 0 },
      { transform: tr(p.x + Math.cos(a) * r * .6, p.y + Math.sin(a) * r * .6, sz, sz), opacity: 1, offset: .4 },
      { transform: tr(p.x, p.y, sz, sz, "scale(.4)"), opacity: 0 }], 260, EASE_IN, i * 12).then(() => d.remove());
  }
  await sleep(240);
}
// 写大字。橙(奥义)是短版:压暗浅、写得快、不停顿;红(绝技)是完整版:压得更暗、写完墨点四溅、落一枚朱印
async function ultimate(st) {
  const red = st.tier.k >= 4, dark = red ? .72 : .5, write = red ? 380 : 240, hold = red ? 220 : 40;
  const dim = el(st, {}, "dim");
  const g = el(st, {}, "bigglyph");
  g.textContent = st.hand.textContent;
  g.style.textShadow = `0 0 .05em ${st.tier.color}, 0 0 .18em ${red ? "rgba(204,38,46,.5)" : "rgba(225,121,27,.45)"}`;
  anim(dim, [{ opacity: 0 }, { opacity: dark }], 140);
  await anim(g, [
    { clipPath: "inset(0 100% 0 0)", opacity: 1, transform: "translate(-50%,-50%) scale(1.12)", filter: "blur(5px)" },
    { clipPath: "inset(0 0 0 0)", opacity: 1, transform: "translate(-50%,-50%) scale(1)", filter: "blur(0px)" },
  ], write, EASE_OUT);
  if (red) {
    const W = st.layer.offsetWidth, H = st.layer.offsetHeight, cx = W / 2, cy = H * .46;
    // 墨点四溅(压在暗底上用宣纸色,读得出是墨迹炸开)
    for (let i = 0; i < 14; i++) {
      const a = rnd(0, Math.PI * 2), d = rnd(W * .14, W * .3), sz = rnd(4, 11);
      const dp = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", background: "#F6F1E7", zIndex: 9 });
      anim(dp, [{ transform: tr(cx, cy, sz, sz, "scale(.3)"), opacity: .9 },
        { transform: tr(cx + Math.cos(a) * d, cy + Math.sin(a) * d * .7, sz, sz, "scale(1)"), opacity: .9, offset: .5 },
        { transform: tr(cx + Math.cos(a) * d * 1.05, cy + Math.sin(a) * d * .75, sz, sz, "scale(1)"), opacity: 0 }], 460, EASE_OUT).then(() => dp.remove());
    }
    // 朱印:落在大字右下角
    const size = W * .09;
    const seal = el(st, { width: px(size), height: px(size), fontSize: px(size * .56) }, "seal");
    seal.textContent = "绝";
    anim(seal, [{ transform: tr(cx + W * .15, cy + H * .17, size, size, "scale(2) rotate(-12deg)"), opacity: 0 },
      { transform: tr(cx + W * .15, cy + H * .17, size, size, "scale(1) rotate(-6deg)"), opacity: 1, offset: .35 },
      { transform: tr(cx + W * .15, cy + H * .17, size, size, "scale(1) rotate(-6deg)"), opacity: 1, offset: .85 },
      { transform: tr(cx + W * .15, cy + H * .17, size, size, "scale(1.1) rotate(-6deg)"), opacity: 0 }], 520, EASE_OUT).then(() => seal.remove());
    anim(st.layer, [{ transform: "translate(0,0)" }, { transform: "translate(0,4px)" }, { transform: "translate(0,-2px)" }, { transform: "translate(0,0)" }], 180, "linear", 160);
  }
  await sleep(hold);
  anim(g, [{ opacity: 1, transform: "translate(-50%,-50%) scale(1)" }, { opacity: 0, transform: "translate(-50%,-50%) scale(1.35)" }], 220, EASE_IN).then(() => g.remove());
  anim(dim, [{ opacity: dark }, { opacity: 0 }], 260).then(() => dim.remove());
  await sleep(80);
}

// ---------- 招式 ----------
async function fire(st) {
  const k = st.tier.k, c = st.tier.color, S = SCALE[k];
  const a = at(st, st.hand), m = st.mobs[1], b = at(st, m.el), H = st.layer.offsetHeight;
  const R = b.w * .3 * S, dur = 320;
  const ball = el(st, { width: px(R), height: px(R), borderRadius: "50%",
    background: "radial-gradient(circle, #FFFBE6 0 18%, #FFC04A 40%, #E2552A 68%, rgba(214,72,36,0) 72%)",
    boxShadow: `0 0 ${14 * S}px ${4 * S}px ${k >= 2 ? c + "AA" : "rgba(255,150,60,.55)"}` });
  const pos = t => { const e = t * t; return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e - Math.sin(t * Math.PI) * H * .08 }; };
  const frames = [];
  for (let s = 0; s <= 10; s++) { const t = s / 10, q = pos(t); frames.push({ transform: tr(q.x, q.y, R, R, `scale(${1 + .15 * Math.sin(t * Math.PI)})`) }); }
  const flight = anim(ball, frames, dur);
  if (k === 3) {
    // 奥义:另两颗从左右两侧绕弧夹击,与主火球同时到
    for (const side of [-1, 1]) {
      const r2 = R * .7, sx = a.x + side * st.layer.offsetWidth * .3, sy = a.y - H * .05;
      const o = el(st, { width: px(r2), height: px(r2), borderRadius: "50%",
        background: "radial-gradient(circle, #FFF3D6 0 18%, #FFB347 42%, #E1791B 68%, rgba(225,121,27,0) 72%)", boxShadow: `0 0 12px 3px ${c}AA` });
      const fs = [];
      for (let s2 = 0; s2 <= 10; s2++) { const t = s2 / 10, e = t * t;
        const x = sx + (b.x - sx) * e + side * Math.sin(t * Math.PI) * 30, y = sy + (b.y - sy) * e - Math.sin(t * Math.PI) * H * .12;
        fs.push({ transform: tr(x, y, r2, r2) }); }
      anim(o, fs, dur).then(() => o.remove());
    }
  }
  const embers = Math.round(10 * MANY[k]);
  for (let i = 1; i <= embers; i++) {
    const t = i / (embers + 1), q = pos(t), sz = rnd(4, 8) * (k >= 2 ? 1.2 : 1);
    const gold = k >= 2 && i % 2 === 0;
    const e = el(st, { width: px(sz), height: px(sz), borderRadius: "50%", opacity: 0,
      background: gold ? c : (i % 2 ? "#FFC24A" : "#E0582A"), boxShadow: gold ? `0 0 6px ${c}` : "" });
    anim(e, [{ transform: tr(q.x, q.y, sz, sz), opacity: 1 }, { transform: tr(q.x + rnd(-8, 8), q.y - rnd(10, 26), sz, sz, "scale(.3)"), opacity: 0 }],
      420, "linear", dur * t).then(() => e.remove());
  }
  await flight; ball.remove();
  hit(st, m, [40, 46, 64, 84, 110][k], "#C4442B", { x: 0, y: -1 }, HEAVY[k]);
  pop(st, b, "灼烧 2", "#C4442B", true, 26);
  ring(st, b, "#F08A3C", b.w * S);
  if (k >= 1) ring(st, b, c, b.w * S * 1.25, 3, 460);
  if (k >= 2) {
    flash(st, "#FFF3D6", .35);
    ring(st, b, c, b.w * S * 1.7, 2, 560);
    goldBits(st, b, k === 2 ? c : "#FFC870", Math.round(10 * MANY[k] / 1.8));
    await impactFreeze(st, b);
  }
  if (k >= 3) { await sleep(90); ring(st, b, "#E1791B", b.w * 2.2, 6, 520); flash(st, "#FFE0B0", .4, 260); }
  if (k >= 4) {
    await sleep(90); ring(st, b, "#CC262E", b.w * 3, 7, 600);
    // 火雨:从顶上往整个敌阵洒一片火星
    const W = st.layer.offsetWidth;
    for (let i = 0; i < 22; i++) {
      const x = rnd(W * .1, W * .9), sz = rnd(5, 10), y0 = -10, y1 = rnd(H * .25, H * .55);
      const f = el(st, { width: px(sz), height: px(sz * 1.6), borderRadius: "50%", opacity: 0,
        background: "radial-gradient(circle, #FFE08A, #F07A30 55%, rgba(200,60,30,0) 72%)" });
      anim(f, [{ transform: tr(x, y0, sz, sz * 1.6), opacity: 1 }, { transform: tr(x - 12, y1, sz, sz * 1.6, "scale(.5)"), opacity: 0 }],
        420, EASE_IN, rnd(0, 260)).then(() => f.remove());
    }
    st.mobs.forEach(mm => { if (mm !== m) hit(st, mm, 24, "#C4442B", { x: 0, y: 1 }, 1); });
  }
  await scatter(st, b, Math.round(16 * MANY[k]), () => dot(st, rnd(8, 15) * (1 + .15 * k),
      { borderRadius: "50%", background: "radial-gradient(circle, #FFE08A, #F07A30 55%, rgba(200,60,30,0) 72%)" }),
    { dist: [25 * S, 70 * S], dur: 620 + 60 * k, gravity: -30, up: true });
}

async function chop(st) {
  const k = st.tier.k, c = st.tier.color, S = SCALE[k];
  const m = st.mobs[1], p = at(st, m.el), size = p.w * 1.25 * S;
  const edge = k >= 2 ? c : null;
  const one = (rot, flip, color = "#F2EAD3", sz = size) => {
    const s = slashEl(st, sz, color, edge);
    return anim(s, [
      { transform: tr(p.x, p.y, sz, sz, `rotate(${rot}deg) scale(${.6 * flip}, .6)`), opacity: 1 },
      { transform: tr(p.x, p.y, sz, sz, `rotate(${rot}deg) scale(${1.05 * flip}, 1.05)`), opacity: 1, offset: .45 },
      { transform: tr(p.x, p.y, sz, sz, `rotate(${rot}deg) scale(${1.2 * flip}, 1.2)`), opacity: 0 },
    ], 260 + 20 * k, EASE_OUT).then(() => s.remove());
  };
  const extras = () => {
    if (k >= 1) ring(st, p, c, p.w * S, 3, 360);
    if (k >= 2) {
      flash(st, "#FFF6DC", .3, 180);
      goldBits(st, p, c, 8);
      return impactFreeze(st, p);
    }
  };
  const dmg = [28, 32, 44, 56, 64][k];
  one(-35, 1); await sleep(90); hit(st, m, dmg, "#6B6449", { x: .7, y: -.7 }, HEAVY[k]); await extras();
  await sleep(260);
  one(35, -1); await sleep(90); hit(st, m, dmg, "#6B6449", { x: -.7, y: -.7 }, HEAVY[k]); await extras();
  pop(st, p, "流血", "#B0242A", true, 26);
  scatter(st, { x: p.x, y: p.y + p.w * .12 }, Math.round(9 * MANY[k]),
    () => [el(st, { width: "5px", height: "8px", borderRadius: "50% 50% 50% 50% / 60% 60% 40% 40%", background: "#B0242A" }), 5, 8],
    { dist: [10, 40], dur: 650, gravity: 60 });
  if (k >= 3) {
    // 绝技收尾:一道镶金的横斩,比前两刀都宽
    await sleep(280);
    const wide = size * 1.6;
    one(90, 1, "#FFF1CF", wide);
    await sleep(100);
    hit(st, m, 88, "#E1791B", { x: 1, y: 0 }, HEAVY[k] * 1.2);
    ring(st, p, c, p.w * 2, 5, 480);
    flash(st, "#FFE8C4", .45, 260);
    await impactFreeze(st, p);
  }
  if (k >= 4) {
    // 红档再补一道竖斩,与横斩收成十字
    await sleep(220);
    one(0, 1, "#FFE3E3", size * 1.7);
    await sleep(100);
    hit(st, m, 120, "#CC262E", { x: 0, y: 1 }, HEAVY[k] * 1.3);
    ring(st, p, "#CC262E", p.w * 2.6, 6, 560);
    flash(st, "#FFD9D9", .5, 280);
  }
  await sleep(300);
}

async function play(st) {
  if (st.busy) return;
  st.busy = true;
  try {
    const k = st.tier.k;
    if (k === 4) await ultimate(st);     // 绝技:压暗写大字、墨溅落印
    if (k === 3) await brushSwipe(st);   // 奥义:巨笔横扫,不写大字
    if (k === 2 || k === 4) await charge(st);
    else await anim(st.hand, [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-62%) scale(1.12)" }, { transform: "translate(-50%,-50%) scale(1)" }], 220, "ease-out");
    await (st.kind === "fire" ? fire(st) : chop(st));
    await sleep(300);
  } catch (e) { console.error(e); }
  finally { st.busy = false; }
}

const rowFire = document.getElementById("row-fire"), rowChop = document.getElementById("row-chop");
for (const t of TIERS) rowFire.appendChild(buildStage("fire", t));
for (const t of TIERS) rowChop.appendChild(buildStage("chop", t));

const playAll = () => STAGES.forEach(play);
document.getElementById("play-all").addEventListener("click", playAll);
document.getElementById("slow").addEventListener("change", e => { speed = e.target.checked ? .3 : 1; });
const loopBox = document.getElementById("loop");
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) loopBox.checked = false;
// 循环只靠定时器:每 0.2 秒看一眼,距上一轮满 3.6 秒(随慢放拉长)就再播一轮,忙着的格子自己跳过
let last = -1e9;
