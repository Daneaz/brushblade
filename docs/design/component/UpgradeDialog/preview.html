<!-- @dsCard group="字牌" height=300 subtitle="实现 · CollectionView.ShowUpgradePreview · 旧 → 新 (+差) 一条读法" -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--paper)}
.wrap{padding:14px 16px}
.scrim{background:var(--scrim);border-radius:6px;padding:11px}
/* Ui.Sheet 1088×670 → 520×320pt;此卡整体按 0.60 缩放(尺寸、圆角、内边距一并乘) */
.sheet{width:312px;height:192px;box-sizing:border-box;margin:0 auto;background:var(--panel-paper);
  border:.43px solid var(--panel-border);border-radius:5.16px;padding:6.88px;
  display:flex;flex-direction:column;gap:4.01px}
/* 头:行高 40、间距 15、底对齐 */
.head{height:11.47px;display:flex;align-items:flex-end;gap:4.30px;flex:none}
.head .t{font-family:var(--font-serif);font-weight:600;font-size:9.75px;line-height:1;color:var(--text-main);white-space:nowrap}
.head .w{font-size:5.45px;line-height:1;color:var(--text-faint);white-space:nowrap}
/* 牌行:MiniGlyphTile 130×163,间距 29 */
.step{height:46.73px;display:flex;align-items:center;justify-content:center;gap:8.31px;flex:none}
.step .ar{font-size:8.31px;color:var(--exit-pink)}
.lvchip{display:inline-flex;align-items:center;justify-content:center;height:9.46px;padding:0 2.58px;border-radius:4.01px;
  font-size:6.02px;background:var(--jade);color:#fff;white-space:nowrap}
/* 正文:两栏 gap 25,栏内 11 */
.body{flex:1;min-height:0;display:flex;gap:7.17px;align-items:flex-start}
.col{flex:1;display:flex;flex-direction:column;gap:3.15px;min-width:0}
/* CharSheetSections.Section:19 黑体 text-faint + 右侧 2 单位横线,行高 44 */
.sec{height:12.61px;display:flex;align-items:center;gap:3.73px;font-size:5.45px;color:var(--text-faint);white-space:nowrap}
.sec::after{content:"";flex:1;height:.57px;background:var(--panel-border)}
/* DeltaRow:定高 54、panel-inset 底、圆角 12、内边距 17、间距 11 */
.dr{display:flex;align-items:center;gap:3.15px;height:15.48px;box-sizing:border-box;
  padding:0 4.87px;background:var(--panel-inset);border-radius:3.44px}
.dr .nm{flex:1;font-size:5.45px;color:var(--text-dim);white-space:nowrap;overflow:hidden}
.dr .was{font-family:var(--font-serif);font-size:7.17px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.dr .ar{font-size:5.16px;color:var(--text-faint)}
.dr .now{font-family:var(--font-serif);font-size:8.31px;color:var(--upgrade-text);font-variant-numeric:tabular-nums}
.dr .dl{font-size:5.45px;color:var(--upgrade-text);white-space:nowrap}
/* 纯图标 chip:36×30(padX 18 + Icons.Size 18),图标左贴 padX/2 */
.ichip{position:relative;flex:none;width:10.32px;height:8.60px;border-radius:4.01px;color:#fff}
.ichip svg{position:absolute;left:2.58px;top:1.72px;width:5.16px;height:5.16px}
.keep{font-size:5.16px;color:var(--text-faint);line-height:1.35}
/* 钮:PillButton 高 71、圆角 24、字号 24 黑体,行距 21 */
.btns{display:flex;gap:6.02px;flex:none}
.btns .b{height:20.35px;border-radius:6.88px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-sans);font-weight:500;font-size:6.88px;white-space:nowrap}
.note{font-size:8.5px;color:var(--text-faint);line-height:1.55;margin-top:10px}
.note b{color:var(--upgrade-text)}
</style></head><body>
<svg style="position:absolute;width:0;height:0"><defs><symbol id="i-speed" viewBox="0 0 64 64"><path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M8 20h26M8 32h34M8 44h26"/><path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M40 20l14 12-14 12"/></symbol></defs></svg>
<div class="zd-root wrap">
  <div class="scrim"><div class="sheet">

    <div class="head"><span class="t">升级「冰」</span><span class="w">确认后立刻扣除材料,不可撤销</span></div>

    <div class="step">
      <div class="zd-mini zd-mini--dim zd-r-gold zd-e-water" style="--w:37.27px;--h:46.73px"><span class="zd-mini__g">冰</span></div>
      <span class="ar">→</span>
      <div class="zd-mini zd-r-gold zd-e-water" style="--w:37.27px;--h:46.73px"><span class="zd-mini__g">冰</span></div>
      <span class="lvchip">升到 Lv.4</span>
    </div>

    <div class="body">
      <div class="col">
        <div class="sec">数值提升</div>
        <div class="dr"><span class="nm">治疗</span><span class="was">188</span><span class="ar">→</span><span class="now">206</span><span class="dl">+18</span></div>
        <div class="dr"><span class="nm">攻击</span><span class="was">188</span><span class="ar">→</span><span class="now">206</span><span class="dl">+18</span></div>
      </div>
      <div class="col">
        <div class="sec">层数与特性</div>
        <div class="dr">
          <span class="ichip" style="background:var(--wood-glyph)"><svg><use href="#i-speed"></use></svg></span>
          <span class="nm">急速</span><span class="was">+124%</span><span class="ar">→</span><span class="now">+136%</span></div>
        <div class="keep">不变:克制目标 · 冻结</div>
      </div>
    </div>

    <div class="btns">
      <span class="b" style="flex:1;background:var(--cta);color:#fff">确认升级</span>
      <span class="b" style="flex:1;background:var(--locked-bg);color:var(--text-main)">再想想</span>
    </div>

  </div></div>
  <div class="note">一条读法贯穿两栏：<b>旧 → 新 (+差)</b>。新值比旧值大一号、且是全行唯一的深绿 —— 一眼扫下去就是「变了的那一列」。<b>不印重复卡与墨锭消耗</b>（2026-09-04 拍板）：不够根本走不到这一页，详情页那颗按钮就是灰的。右栏末尾那行「不变」回答的是「我会不会丢掉什么」，不是凑字数。主钮用赭金 + <b>gold-text</b>（5.47:1）—— 赭金是「花墨锭」的语义。</div>
</div>
</body></html>
