<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}
.lbl{font-size:9px;color:var(--text-dim);letter-spacing:.5px;margin-top:6px;text-align:center;white-space:nowrap}.col{display:flex;flex-direction:column;align-items:center}.wrap{padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}.row-h{width:100%;font-size:9px;color:var(--text-faint);letter-spacing:1px;margin:2px 0 -6px}</style></head><body>
<div class="zd-root wrap" style="gap:14px 12px">
<div class="col"><div class="zd-cell" style="--w:103.2px;--h:128.05px"><div class="zd-tile zd-r-blue zd-e-water" style="--w:103.2px;--h:128.05px"><div class="zd-tile__face"><span class="zd-tile__glow"></span><div class="zd-tile__content"><span class="zd-tile__g">海</span><span class="zd-tile__py">hǎi</span></div></div><span class="zd-bdg zd-bdg--lv">Lv.2</span><span class="zd-rdot"></span></div><div class="zd-foot"><span class="zd-foot__bar"><i style="width:0%;background:var(--text-faint)"></i></span><span class="zd-foot__t" style="color:var(--text-dim)">0/1</span></div></div><div class="lbl">常态</div></div>
<div class="col"><div class="zd-cell" style="--w:103.2px;--h:128.05px"><div class="zd-tile zd-r-white zd-e-water" style="--w:103.2px;--h:128.05px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">冷</span><span class="zd-tile__py">lěng</span></div></div><span class="zd-bdg zd-bdg--lv">Lv.3</span><span class="zd-rdot"></span><span class="zd-bdg zd-bdg--up">▲ 可升</span></div><div class="zd-foot"><span class="zd-foot__bar"><i style="width:100%;background:var(--jade)"></i></span><span class="zd-foot__t" style="color:var(--upgrade-text)">4/3</span></div></div><div class="lbl">可升级</div></div>
<div class="col"><div class="zd-cell" style="--w:103.2px;--h:128.05px"><div class="zd-tile zd-r-white zd-e-fire" style="--w:103.2px;--h:128.05px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">热</span><span class="zd-tile__py">rè</span></div></div><span class="zd-bdg zd-bdg--lv zd-bdg--max">MAX</span><span class="zd-rdot"></span></div><div class="zd-foot"><span class="zd-foot__bar"><i style="width:100%;background:var(--text-faint)"></i></span><span class="zd-foot__t" style="color:var(--gold-deep)">满级</span></div></div><div class="lbl">满级</div></div>
<div class="col"><div class="zd-cell" style="--w:103.2px;--h:128.05px"><div class="zd-tile zd-r-orange zd-e-fire" style="--w:103.2px;--h:128.05px"><div class="zd-tile__face"><span class="zd-tile__glow"></span><div class="zd-tile__content"><span class="zd-tile__g">焚</span><span class="zd-tile__py">fén</span></div></div><span class="zd-halo"></span><span class="zd-bdg zd-bdg--lv">Lv.1</span><span class="zd-rdot"></span><span class="zd-bdg zd-bdg--new">新</span></div><div class="zd-foot"><span class="zd-foot__bar"><i style="width:0%;background:var(--text-faint)"></i></span><span class="zd-foot__t" style="color:var(--text-dim)">0/1</span></div></div><div class="lbl">新字 · 点开即消</div></div>
<div class="col"><div class="zd-cell" style="--w:103.2px;--h:128.05px"><div class="zd-tile zd-r-orange zd-e-water zd-tile--locked" style="--w:103.2px;--h:128.05px"><div class="zd-tile__face"><span class="zd-tile__glow"></span><div class="zd-tile__content"><span class="zd-tile__g">淼</span><span class="zd-tile__py">miǎo</span></div></div><span class="zd-bdg zd-bdg--lock">锁</span><span class="zd-rdot zd-rdot--dim"></span></div><div class="zd-foot"><span class="zd-foot__t" style="color:var(--text-faint)">未拥有 · 宝箱产出</span></div></div><div class="lbl">未拥有</div></div>
</div>
</body></html>
