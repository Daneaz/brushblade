<!-- @dsCard group="字牌" height=330 subtitle="实现 · CardSheetParts.TraitRow · 字卡特性行三态:已解锁 / 未解锁 / 本场已用" -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}
.wrap{padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:3px;width:262px}
.h{font-size:9px;color:var(--text-faint);letter-spacing:1px;margin-bottom:3px}
.face{border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.face.front{background:var(--card-face);box-shadow:inset 0 0 0 1px var(--panel-border)}
.face.back{background:var(--el-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--glyph) 22%,transparent)}
.tr{box-sizing:border-box;border-radius:7px;padding:4px 8px;background:var(--card-face);box-shadow:inset 0 0 0 1px var(--panel-border)}
.face.front .tr{background:var(--panel-paper)}
.th{display:flex;align-items:center;gap:5px;height:14px}
.lvt{flex:none;height:12px;padding:0 4px;border-radius:6px;background:var(--ink);color:#fff;font-size:7.5px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.tn{font-size:11.5px;font-weight:600;letter-spacing:.5px;white-space:nowrap;color:var(--text-main)}
.tk{font-size:8px;color:var(--text-dim);white-space:nowrap}
.tx{margin-top:2px;font-size:9.5px;line-height:1.4;color:var(--text-quiet)}
.lock{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:8px;color:var(--text-faint);white-space:nowrap}
.lock svg{width:8px;height:8px}
.used{margin-left:auto;height:12px;padding:0 5px;border-radius:6px;background:var(--ink-bar);color:var(--text-warm);font-size:7.5px;display:inline-flex;align-items:center;white-space:nowrap}
.tr.off{background:transparent!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--panel-border) 80%,transparent)}
.tr.off .lvt{background:transparent;color:var(--text-faint);box-shadow:inset 0 0 0 1px var(--text-faint)}
.tr.off .tn,.tr.off .tk,.tr.off .tx{color:var(--text-faint)}
.face.back .tr.off .tn,.face.back .tr.off .tx{color:var(--text-dim);opacity:.78}
.seal{flex:none;display:inline-flex;align-items:center;justify-content:center;width:10px;height:10px;font-size:7px;border-radius:2px;font-family:var(--font-serif);font-weight:700;color:#fff;background:var(--glyph);vertical-align:-1px;margin-right:2px}
.seal.atk{background:var(--ink)}
.outer{display:flex;flex-direction:column;gap:10px}
</style></head><body>
<svg style="position:absolute;width:0;height:0"><defs><symbol id="i-lock" viewBox="0 0 64 64"><path fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" d="M21 30v-8a11 11 0 0 1 22 0v8"/><path fill="currentColor" d="M15 30h34v24H15z"/></symbol></defs></svg>
<div class="zd-root outer" style="padding:14px 16px">
<div class="wrap" style="padding:0">
 <div class="col"><div class="h">正面 · 攻击 · 杜</div><div class="face front">
  <div class="tr"><div class="th"><span class="lvt">Lv5</span><span class="tn">杜塞</span><span class="tk">主动</span></div><div class="tx">目标 2 回合内不能使用能力(Boss:下次大招 −50%)</div></div>
  <div class="tr off"><div class="th"><span class="lvt">Lv8</span><span class="tn">堵截</span><span class="tk">主动 · 招牌</span><span class="lock"><svg><use href="#i-lock"></use></svg>Lv8 解锁</span></div><div class="tx">目标跳过下一次行动(Boss:行动条后退一半)</div></div>
 </div></div>
 <div class="col zd-e-earth"><div class="h">背面 · 五行面(本系淡底)· 杜</div><div class="face back">
  <div class="tr"><div class="th"><span class="lvt">Lv6</span><span class="ic" style="display:inline-flex;width:13px;height:13px;border-radius:3.5px;background:var(--cinnabar)"></span><span class="tn">闭门</span><span class="tk">被动</span></div><div class="tx">跨场：下一场开局获得<b style="color:var(--earth-fg)">护盾</b> 60</div></div>
  <div class="tr off"><div class="th"><span class="lvt">Lv8</span><span class="tn">杜门不出</span><span class="tk">主动 · 招牌</span><span class="used">本场已用</span></div><div class="tx">本回合受伤 −60%；下回合 AP −1；每场 1 次</div></div>
 </div></div>
</div>
</div>
</body></html>
