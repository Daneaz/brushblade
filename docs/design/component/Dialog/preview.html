<!-- @dsCard group="弹窗" height=428 subtitle="实现 · Ui.Modal / Ui.Alert · 620×300 卡" -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:6px;text-align:center}.col{display:flex;flex-direction:column;align-items:center}
/* 尺寸全取 bundle.css 的 .zd-dialog*(= 实现换算值):卡 620×300、描边 1.5、圆角 18、内边距 24、行距 14;
   标题宋体 24、正文 17 text-dim;钮 .zd-btn--modal 150×52 圆角 24 字号 18(黑体 500) */
</style></head><body>
<div class="zd-root wrap" style="align-items:flex-start">
<div class="col"><div class="zd-dialog"><div class="zd-dialog__card"><div class="zd-dialog__title">离 塔</div><div class="zd-dialog__body">挂起:保留进度,下次从本层继续
弃塔:本趟到此为止;墨锭早已随赚随入账,层数纪录保留</div><div class="zd-dialog__actions"><button class="zd-btn zd-btn--modal zd-btn--shiqing">挂起离塔</button><button class="zd-btn zd-btn--modal zd-btn--danger">弃塔</button><button class="zd-btn zd-btn--modal zd-btn--quiet">继续战斗</button></div></div></div><div class="lbl">Ui.Modal · 三钮 · 正文整段 text-dim(实现无富文本)</div></div>
<div class="col"><div class="zd-dialog"><div class="zd-dialog__card"><div class="zd-dialog__title">AP 不够</div><div class="zd-dialog__body">「爆」需要 1 AP,本回合仅剩 0 AP。
结束回合可回满 3 AP 并掉落新部件。</div><div class="zd-dialog__actions"><button class="zd-btn zd-btn--modal zd-btn--cinnabar">结束回合</button><button class="zd-btn zd-btn--modal zd-btn--quiet">再想想</button></div></div></div><div class="lbl">Ui.Modal · 两钮 · 主行动在左</div></div>
<div class="col"><div class="zd-dialog"><div class="zd-dialog__card"><div class="zd-dialog__title">尚未开放</div><div class="zd-dialog__body">订阅还没接上,这里先占个位。
四条权益一条都还没生效,不会先收你钱。</div><div class="zd-dialog__actions"><button class="zd-btn zd-btn--modal zd-btn--quiet">知道了</button></div></div></div><div class="lbl">Ui.Alert · 单钮 locked-bg</div></div>
</div>
</body></html>
