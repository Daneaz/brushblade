<!-- @dsCard group="字牌" height=300 subtitle="实现 · Ui.FaceSeal · 手牌朝上面的一枚方印" -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}
.lbl{font-size:9px;color:var(--text-dim);letter-spacing:.5px;margin-top:6px;text-align:center;white-space:nowrap}.col{display:flex;flex-direction:column;align-items:center}.wrap{padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end}.row-h{width:100%;font-size:9px;color:var(--text-faint);letter-spacing:1px;margin:2px 0 -6px}
.seal{flex:none;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;line-height:1;color:#fff;background:var(--glyph)}
.seal.atk{background:var(--ink)}
.seal.xs{width:10.03px;height:10.03px;font-size:7.02px;border-radius:1.91px}
.seal.s{width:13.04px;height:13.04px;font-size:9.07px;border-radius:2.39px}
.seal.m{width:17.02px;height:17.02px;font-size:11.5px;border-radius:3px}
.seal.l{width:24px;height:24px;font-size:16px;border-radius:4px}
.zd-tile__py{align-items:center}.zd-tile--feat .zd-tile__face{background-color:var(--el-soft);background-blend-mode:multiply}
</style></head><body>
<div class="zd-root wrap">
<div class="row-h">一式实底白字 · 攻击面 ink,五行面本系字形色(&lt;el&gt;-glyph)</div>
<div class="col"><div class="zd-e-wood"><span class="seal xs atk">攻</span></div><div class="lbl">攻击</div></div>
<div class="col"><div class="zd-e-fire"><span class="seal xs fire">燃</span></div><div class="lbl">火</div></div>
<div class="col"><div class="zd-e-metal"><span class="seal xs metal">铠</span></div><div class="lbl">金</div></div>
<div class="col"><div class="zd-e-water"><span class="seal xs water">润</span></div><div class="lbl">水</div></div>
<div class="col"><div class="zd-e-earth"><span class="seal xs earth">固</span></div><div class="lbl">土</div></div>
<div class="col"><div class="zd-e-wood"><span class="seal xs wood">生</span></div><div class="lbl">木</div></div>
<div class="row-h">四档(稿 10 / 13 / 17 / 24pt;实现只用 xs,其余待详情页)</div>
<div class="col zd-e-water"><span class="seal xs ">润</span><div class="lbl">xs</div></div>
<div class="col zd-e-water"><span class="seal s ">润</span><div class="lbl">s</div></div>
<div class="col zd-e-water"><span class="seal m ">润</span><div class="lbl">m</div></div>
<div class="col zd-e-water"><span class="seal l ">润</span><div class="lbl">l</div></div>
<div class="row-h">手牌 46×56 · 面印占拼音位(0.06–0.30),朝上五行面时牌面换 &lt;el&gt;-soft</div>
<div class="col"><div class="zd-tile zd-r-white zd-e-wood" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">藤</span><span class="zd-tile__py"><span class="seal xs atk">攻</span></span></div></div></div><div class="lbl">正面 · 攻击</div></div>
<div class="col"><div class="zd-tile zd-r-white zd-e-wood zd-tile--feat" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">藤</span><span class="zd-tile__py"><span class="seal xs wood">生</span></span></div></div></div><div class="lbl">背面 · 五行面</div></div>
<div class="col"><div class="zd-tile zd-r-green zd-e-fire zd-tile--feat" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">烈</span><span class="zd-tile__py"><span class="seal xs fire">燃</span></span></div></div></div><div class="lbl">背面 · 五行面</div></div>
<div class="col"><div class="zd-tile zd-r-blue zd-e-metal zd-tile--feat" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">剑</span><span class="zd-tile__py"><span class="seal xs metal">铠</span></span></div></div></div><div class="lbl">背面 · 五行面</div></div>
<div class="col"><div class="zd-tile zd-r-blue zd-e-water zd-tile--feat" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">海</span><span class="zd-tile__py"><span class="seal xs water">润</span></span></div></div></div><div class="lbl">背面 · 五行面</div></div>
<div class="col"><div class="zd-tile zd-r-green zd-e-earth zd-tile--feat" style="--w:45.87px;--h:55.9px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">岩</span><span class="zd-tile__py"><span class="seal xs earth">固</span></span></div></div></div><div class="lbl">背面 · 五行面</div></div>
</div>
</body></html>
