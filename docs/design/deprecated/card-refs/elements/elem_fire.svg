<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="f_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"></feGaussianBlur>
    </filter>
  </defs>
  <!-- 烟:一缕上升的蜿蜒淡墨,下浓上散 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" filter="url(#f_soft)">
    <path d="M64 100 C 54 82 76 74 66 56 C 56 38 78 30 68 12" stroke-width="12" stroke-opacity="0.50"></path>
    <path d="M67 34 C 52 26 42 20 34 6" stroke-width="8" stroke-opacity="0.27"></path>
    <path d="M69 44 C 84 34 92 24 94 8" stroke-width="7" stroke-opacity="0.22"></path>
  </g>
  <!-- 火苗:飞白枯笔,只在根部一小簇 —— 缩到底,读到的才是「一缕上升的烟」而非一滴 -->
  <path d="M62 127 C 50 120 52 108 60 96 C 62 104 67 106 69 100 C 76 109 79 120 74 125 C 70 128 66 128 62 127 Z"
        fill="#FFFFFF" fill-opacity="0.8"></path>
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45" fill="none">
    <path d="M58 122 v-7 M66 118 v-6"></path>
  </g>
</svg>
