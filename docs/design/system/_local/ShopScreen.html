<!-- @dsCard group="整屏" height=430 width=932 subtitle="实现 · ShopView.cs · 字摊四摊位 + 右栏箱位与补给" -->
<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../components/bundle.css"><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}

.scr { position: relative; width: 932px; height: 430px; overflow: hidden; background: var(--paper);
  font-family: var(--font-sans); color: var(--text-main); -webkit-font-smoothing: antialiased; }
.scr * { box-sizing: border-box; }
.safe { position: absolute; left: 59px; right: 59px; top: 0; bottom: 21px; }
.top { position: absolute; left: 0; right: 0; top: 0; height: 38.22px; display: flex; align-items: center; gap: 10.03px; }
.top h1 { margin: 0; font: 600 19.11px/1 var(--font-serif); color: var(--text-main); letter-spacing: 1px; }
.top .sub { font-size: 10.99px; color: var(--text-dim); }
.top .grow { flex: 1; }
.inkc { display: flex; align-items: center; gap: 2.87px; font-size: 11.94px; color: var(--text-main); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 11.47px; border: 0;
  font-family: var(--font-sans); white-space: nowrap; }
.back { width: 62.11px; height: 30.1px; background: var(--exit-pink); color: #fff; font-size: 11.94px; }
.panel { position: absolute; background: var(--panel-paper); border: 0.96px solid var(--panel-border); border-radius: 10.03px; overflow: hidden; }
.phead { height: 25.8px; display: flex; align-items: center; gap: 5.73px; padding: 0 8.12px;
  border-bottom: 0.96px solid var(--panel-border); font-size: 9.08px; color: var(--text-faint); }
.zd-ingot { display: block; flex: none; }

/* 主区:顶栏 80 + 行距 13 = 93 → 44.43 */
.main { position: absolute; left: 0; right: 0; bottom: 0; top: 44.43px; }

/* ---- 左:今日字摊(Shelf 占满主区减右栏 527 + 间距 19)---- */
.left { position: absolute; left: 0; top: 0; bottom: 0; right: 260.87px; }
/* 段头是一行小字,没有横线、没有副标题(Ui.Row 13 里只有一个 ThemedLabel 19 LockGray) */
.shead { position: absolute; left: 0; right: 0; top: 0; height: 25.8px;
  display: flex; align-items: center; gap: 6.21px; font-size: 9.08px; color: var(--text-faint); white-space: nowrap; }
/* 摊位行:定宽 144 的四格靠左排,不铺满 —— 右侧留白是实现现状,不是再现误差 */
.shelf { position: absolute; left: 0; right: 0; top: 32.01px; height: 137.6px;
  display: flex; align-items: flex-start; justify-content: flex-start; gap: 10.03px; }
.stall { --w: 68.8px; --h: 86px; width: 68.8px; flex: none;
  display: flex; flex-direction: column; align-items: center; gap: 3.82px; }
.hint { font-size: 9.08px; line-height: 1.15; white-space: nowrap; }
.hint.up { color: var(--upgrade-text); }
.hint.dim { color: var(--text-dim); }
/* 价格钮:Ui.RoundButton 144×46 radius 14,字号 19 黑体(不是宋体、没有墨锭图标) */
.buy { width: 68.8px; height: 21.98px; border-radius: 6.69px; font-size: 9.08px;
  display: flex; align-items: center; justify-content: center; white-space: nowrap;
  font-family: var(--font-sans); font-variant-numeric: tabular-nums;
  background: var(--ink); color: #fff; }
.buy.poor { background: var(--panel-inset); color: var(--cinnabar-dark); }
.buy.sold { background: var(--locked-bg); color: var(--text-faint); }
/* 已售印:正放的一枚 Ui.Chip(朱砂实底白字),不旋转 —— uGUI 旋转会连带转裁剪矩形 */
.seal { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 28.67px; height: 15.77px; border-radius: 6.69px; background: var(--cinnabar); color: #fff;
  font-size: 10.03px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
/* 月订阅条:Ui.CardPanel(gold-soft, radius 15),无描边、无价格、无按钮;整条可点 */
.subs { position: absolute; left: 0; right: 0; bottom: 0; height: 45.87px; border-radius: 7.17px;
  background: var(--gold-soft); padding: 4.78px 10.03px;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2.87px; }
.subs b { font: 600 10.99px/1 var(--font-serif); color: var(--gold-deep); white-space: nowrap; }
.subs span { font-size: 9.08px; line-height: 1; color: var(--text-dim); white-space: nowrap; }

/* ---- 右栏 527(与收集/图鉴同宽同款)---- */
.side { right: 0; top: 0; bottom: 0; width: 251.79px; }
.sbody { position: absolute; left: 0; right: 0; top: 26.76px; bottom: 0; padding: 0 10.03px 10.03px;
  display: flex; flex-direction: column; justify-content: center; gap: 7.17px; }
/* 今日箱位卡:Ui.OutlinedPanel(CardWhite=#fff, radius 17, 边 2),固定高 258 */
.cbox { height: 123.27px; flex: none; background: #fff; border: 0.96px solid var(--panel-border);
  border-radius: 8.12px; padding: 6.21px; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start; gap: 3.82px; }
.cbox img { width: 40.13px; height: 40.13px; flex: none; display: block; }
.cname { font: 600 10.99px/1 var(--font-serif); color: var(--rarity-purple); white-space: nowrap; }
.cfacts { display: flex; justify-content: center; gap: 3.34px; }
.cfacts span { height: 14.33px; padding: 0 4.3px; border-radius: 6.69px; font-size: 8.6px;
  background: var(--panel-inset); color: var(--text-dim);
  display: flex; align-items: center; white-space: nowrap; }
.cfacts span.full { background: var(--warn-bg); color: var(--warn-text); }
.cbox .buy { width: 100%; }
/* 「免费补给」也只是一行小字,同样没有横线 */
.sec { height: 10.51px; flex: none; display: flex; align-items: center;
  font-size: 9.08px; color: var(--text-faint); white-space: nowrap; }
/* Ui.AdBadge:圆角/字号/图标由高度派生(scale = 高 64 ÷ 稿基准 63) */
.ad { height: 30.58px; flex: none; position: relative; border-radius: 14.81px; background: var(--ad-green);
  display: flex; align-items: center; justify-content: center; }
.ad .face { position: absolute; inset: 0.72px; border-radius: 14.81px; background: var(--ad-green-bg); }
.ad .row { position: relative; display: flex; align-items: center; justify-content: center; gap: 4.85px; }
.ad .row svg { width: 7.28px; height: 8.25px; display: block; flex: none; }
.ad b { font: 600 10.03px/1 var(--font-serif); color: var(--ad-green-text); white-space: nowrap; }
/* 用完只换文案:代码没有改任何颜色,变灰的只是 uGUI Button 对 face 的禁用乘色 */
.ad.done .face { opacity: .5; }

/* 成交 toast:Ui.Chip(ink, 字号 21, padX 29 / padY 17),顶部居中、顶边贴在顶栏下沿 */
.toast { position: absolute; left: 50%; top: 38.22px; transform: translateX(-50%); z-index: 5;
  width: 74.06px; height: 18.16px; border-radius: 6.69px; background: var(--ink); color: #fff;
  font-size: 10.03px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
</style></head><body>
