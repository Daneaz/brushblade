<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:6px;text-align:center}.col{display:flex;flex-direction:column;align-items:center}
/* bundle.css 里 .zd-dialog* 有两套规则，靠后那套是旧稿值（268 宽 / 13 内边距 / 标题 13 / 正文 10），
   会盖掉前面按实现换算的那套。这里用更高优先级的选择器把实现值钉回来（见报告的 bundle.css 清单）。 */
.zd-root .zd-dialog { width: auto; padding: 14.33px; border-radius: 11.47px; background: var(--scrim); }
.zd-root .zd-dialog__card { width: 296.23px; height: 143.33px; box-sizing: border-box;
  border-width: 0.72px; border-radius: 8.60px; padding: 11.47px; gap: 6.69px; justify-content: center; }
.zd-root .zd-dialog__title { font-size: 11.47px; letter-spacing: 0; }
.zd-root .zd-dialog__body { font-size: 8.12px; line-height: 1.5; }
.zd-root .zd-dialog__actions { gap: 6.69px; margin-top: 0; }
</style></head><body>
<div class="zd-root wrap" style="align-items:flex-start"><div class="col"><div class="zd-dialog"><div class="zd-dialog__card"><div class="zd-dialog__title">离 塔</div><div class="zd-dialog__body">挂起：保留进度，下次从本层继续
弃塔：本趟到此为止；墨锭早已随赚随入账</div><div class="zd-dialog__actions"><button class="zd-btn zd-btn--modal zd-btn--ink">挂起离塔</button><button class="zd-btn zd-btn--modal zd-btn--cinnabar">弃塔</button><button class="zd-btn zd-btn--modal zd-btn--quiet">取消</button></div></div></div><div class="lbl">三钮 · 正文整段 text-dim(实现无富文本)</div></div><div class="col"><div class="zd-dialog"><div class="zd-dialog__card"><div class="zd-dialog__title">AP 不够</div><div class="zd-dialog__body">「爆」需要 1 AP，本回合仅剩 0 AP。
结束回合可回满 3 AP。</div><div class="zd-dialog__actions"><button class="zd-btn zd-btn--modal zd-btn--quiet">知道了</button></div></div></div><div class="lbl">Ui.Alert · 单钮 locked-bg</div></div></div>
</body></html>
