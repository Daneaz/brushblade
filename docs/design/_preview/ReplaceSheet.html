<!-- @dsCard group="局内流程" height=212 subtitle="实现 · BattleView.DrawReplaceSheet · 四入口共用的唯一一处永久删除" -->
<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../component/bundle.css"><meta charset="utf-8"><style>
html,body{margin:0;background:var(--paper)}
.stage{position:relative;padding:14px 16px}
/* 遮罩 scrim-soft(42%)——局内浮层要看得见底下的战场 */
.scrim{position:relative;border-radius:6px;background:var(--scrim-soft);padding:10px;overflow:hidden}
/* 底下透出的战场示意,只为说明「为什么用浅遮罩」 */
.field{position:absolute;inset:0;background:var(--paper);z-index:0}
.field i{position:absolute;display:block;border-radius:3px;background:var(--ink);opacity:.10}
/* Ui.Sheet 1633×460 → 780×220pt;此卡按 1/2 缩放展示 */
.sheet{position:relative;z-index:1;width:390px;box-sizing:border-box;margin:0 auto;
  background:var(--panel-paper);border:.72px solid var(--panel-border);border-radius:8.60px;
  padding:11.47px;display:flex;flex-direction:column;align-items:center;gap:6.69px}
.h{font-family:var(--font-serif);font-weight:600;font-size:7.88px;color:var(--text-main);white-space:nowrap}
.row{display:flex;align-items:center;gap:4.54px}
.arrow{width:10.99px;text-align:center;font-size:8px;color:var(--text-faint)}
.lib{display:flex;align-items:center;gap:3.58px}
.cap{font-size:5.73px;color:var(--text-dim);white-space:nowrap;margin-left:2px}
.lbl{font-size:9px;color:var(--text-dim);letter-spacing:.5px;margin:10px 0 4px;text-align:center}
.note{font-size:8.5px;color:var(--text-faint);line-height:1.5;margin-top:8px}
.note b{color:var(--warn-text);font-weight:700}
</style></head><body>
<div class="zd-root stage">
  <div class="scrim">
    <div class="field">
      <i style="left:6%;top:12%;width:12%;height:14%"></i><i style="left:24%;top:12%;width:12%;height:14%"></i>
      <i style="left:64%;top:12%;width:12%;height:14%"></i><i style="left:82%;top:12%;width:12%;height:14%"></i>
      <i style="left:6%;top:74%;width:10%;height:12%"></i><i style="left:20%;top:74%;width:10%;height:12%"></i>
    </div>
    <div class="sheet">
      <div class="h">换掉哪一张？</div>

      <!-- 告警条:warn-bg 底 warn-text 字,定高 22pt。不是可选项 -->
      <span class="zd-chip zd-chip--warn" style="width:auto;padding:0 10.99px;height:10.99px;font-size:5.02px">字库 9/9——被换掉的字永久失去</span>

      <div class="row">
        <!-- 来牌 -->
        <div class="zd-tile zd-r-purple zd-e-fire" style="--w:31.03px;--h:38.92px">
          <div class="zd-tile__face"><span class="zd-tile__glow"></span>
            <div class="zd-tile__content"><span class="zd-tile__g">焚</span><span class="zd-tile__py">fén</span></div></div>
        </div>
        <span class="arrow">→</span>
        <!-- 字库 9 张,一横排不折行 -->
        <div class="lib">
          <div class="zd-tile zd-r-white zd-e-water" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">冷</span></div></div></div>
          <div class="zd-tile zd-r-white zd-e-wood" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">林</span></div></div></div>
          <div class="zd-tile zd-r-green zd-e-metal" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">刀</span></div></div></div>
          <div class="zd-tile zd-r-blue zd-e-water" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><span class="zd-tile__glow"></span><div class="zd-tile__content"><span class="zd-tile__g">海</span></div></div></div>
          <div class="zd-tile zd-r-white zd-e-earth" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">土</span></div></div></div>
          <div class="zd-tile zd-r-green zd-e-fire" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">炎</span></div></div></div>
          <div class="zd-tile zd-r-white zd-e-metal" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">针</span></div></div></div>
          <div class="zd-tile zd-r-purple zd-e-heart" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><span class="zd-tile__glow"></span><div class="zd-tile__content"><span class="zd-tile__g">心</span></div></div></div>
          <div class="zd-tile zd-r-white zd-e-wood" style="--w:22.5px;--h:28.2px"><div class="zd-tile__face"><div class="zd-tile__content"><span class="zd-tile__g">桤</span></div></div></div>
        </div>
      </div>

      <button class="zd-btn zd-btn--quiet" style="height:15.05px;min-width:71.67px;border-radius:11.47px;font-size:6.5px">算了，不换</button>
    </div>
  </div>
  <div class="note">遮罩是 <b style="color:var(--text-dim)">scrim-soft</b>（42%）而不是模态的 55% —— 玩家要能看见底下的战场再决定换掉哪一张。告警条<b>必现</b>：没有它，这张面板就跟战利品选字长得一样，而它做的是相反的事。</div>
</div>
</body></html>
