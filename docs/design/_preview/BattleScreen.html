<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../component/bundle.css"><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}

    
    sc-for, sc-if { display: contents; }
    a { color: var(--cinnabar-dark); } a:hover { color: var(--exit-pink); }
    /* iPhone 16 Pro Max 横屏 932×430pt。安全区 左右 59 / 下 21(Home Indicator)。
       Unity 逻辑单位换算 ×2.093(CanvasScaler 1600×900 按高匹配 → 实际画布 1950×900)。 */
    .dev {
      position: relative; width: 932px; height: 430px; box-sizing: border-box;
      background: var(--paper); color: var(--text-main); overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .safe {
      position: absolute; left: 59px; right: 59px; top: 0; bottom: 21px;
      display: flex; flex-direction: column;
    }
    /* 安全区参考线(设计稿标注,不是 UI) */
    .guide { position: absolute; inset: 0; pointer-events: none; z-index: 90; }
    .guide i { position: absolute; background: rgba(197,54,55,.20); }
    .guide .gl { left: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gr { right: 59px; top: 0; bottom: 0; width: 1px; }
    .guide .gb { left: 0; right: 0; bottom: 21px; height: 1px; }
    .guide u {
      position: absolute; font-size: 8px; font-style: normal; letter-spacing: .5px;
      color: rgba(155,30,34,.5); text-decoration: none;
    }
    .homebar { position: absolute; left: 0; right: 0; bottom: 5px; height: 4px; display: flex; justify-content: center; }
    .homebar > span { width: 128px; border-radius: 2px; background: rgba(22,27,34,.28); }

    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    .grow { flex: 1; }

    .e-Metal { --el: var(--metal); --elSoft: var(--metal-soft); --elFg: var(--metal-fg); --glyph: var(--metal-glyph); }
    .e-Wood { --el: var(--wood); --elSoft: var(--wood-soft); --elFg: var(--wood-fg); --glyph: var(--wood-glyph); }
    .e-Water { --el: var(--water); --elSoft: var(--water-soft); --elFg: var(--water-fg); --glyph: var(--water-glyph); }
    .e-Fire { --el: var(--fire); --elSoft: var(--fire-soft); --elFg: var(--fire-fg); --glyph: var(--fire-glyph); }
    .e-Earth { --el: var(--earth); --elSoft: var(--earth-soft); --elFg: var(--earth-fg); --glyph: var(--earth-glyph); }
    .e-Heart { --el: var(--heart); --elSoft: var(--heart-soft); --elFg: var(--heart-fg); --glyph: var(--heart-glyph); }
    .e-None  { --el: var(--neutral-part); --elSoft: var(--locked-bg); --elFg: var(--text-quiet); --glyph: var(--text-main); }

    .r-White { --rar: var(--rarity-white); --rarSoft: var(--rarity-white-soft); }
    .r-Green { --rar: var(--rarity-green); --rarSoft: var(--rarity-green-soft); }
    .r-Blue { --rar: var(--rarity-blue); --rarSoft: var(--rarity-blue-soft); }
    .r-Purple { --rar: var(--rarity-purple); --rarSoft: var(--rarity-purple-soft); }
    .r-Gold { --rar: var(--rarity-gold); --rarSoft: var(--rarity-gold-soft); }
    .r-Orange { --rar: var(--rarity-orange); --rarSoft: var(--rarity-orange-soft); }
    .r-Red { --rar: var(--rarity-red); --rarSoft: var(--rarity-red-soft); }

    /* 顶栏 */
    .top { height: 38px; flex: none; display: flex; align-items: center; gap: 10px; }
    .top h1 { margin: 0; font-family: "Noto Serif SC", serif; font-size: 19px; font-weight: 600; letter-spacing: 3px; }
    .top .sub { font-size: 11px; color: var(--text-dim); letter-spacing: .5px; }
    .top .sub b { color: var(--text-main); font-weight: 700; }
/* Ui.InkCounter 没有胶囊底:就是一个 Row(间距 6 → 2.87pt),墨锭图形 + TextMain 数字,
       图形按字号算(宽 = 字号×1.4、高 = 字号×0.85)。稿上的 --ink-bar 药丸只存在于设计稿。 */
    .ink {
      display: flex; align-items: center; gap: 2.87px; height: auto; padding: 0;
      background: none; border: 0; border-radius: 0;
      font-size: 8.60px; font-weight: 400; color: var(--text-main); font-variant-numeric: tabular-nums;
    }
    /* 触控目标 ≥44pt:视觉 32 高的钮靠上下各 6px 透明边扩到 44 */
    .tap { position: relative; }
    .tap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 44px; transform: translateY(-50%); }
    .btn-back {
      height: 30px; padding: 0 14px; border: none; border-radius: 15px; cursor: pointer;
      background: var(--exit-pink); color: #fff; font-family: inherit; font-size: 12px; letter-spacing: 1px;
    }
    .chip { height: 19px; padding: 0 8px; display: inline-flex; align-items: center;
      border-radius: 10px; font-size: 10px; letter-spacing: .5px; }
    .reddot { width: 7px; height: 7px; border-radius: 50%; background: var(--cinnabar);
      box-shadow: 0 0 0 1.5px var(--paper); }
    .dev { background: #EFE8DA; }
    .safe { padding-top: 3px; }

    /* ---------- 顶栏 22 ---------- */
    /* 顶栏各件的实测口径(BattleView.DrawTopBar):关卡名 20(9.56pt)、「第 N 层」13(6.21pt)、
       墨锭与回合数 18(8.6pt)。左右两组各是一个 Ui.Row,缺省间距 8 → 3.82pt。 */
    .bar { height: 22px; flex: none; display: flex; align-items: center; gap: 3.82px; font-size: 6.21px; color: var(--text-dim); }
    /* 项目没有稿上「文山」那种独立短名:_title 本来就是「「字林」第 1~30 层」这类整段描述,
       与「战斗 N」拼成一条("{title} · 战斗 {index}"),稿的 .lv + .seg 前半在实现里是同一个 Text。 */
    .bar .lv { font-family: "Noto Serif SC", serif; font-size: 9.56px; font-weight: 600; color: var(--text-main); letter-spacing: 1px; }
    .bar .seg { font-variant-numeric: tabular-nums; }
/* CoachBtnSize 46 → 21.98pt,「?」字号 22 → 10.51pt,底是 Theme.GoldSoft(不透明近似,
       Unity 这层不叠半透);命中区另有一层 44pt 高的透明子节点,溢出顶栏,见 .tap。 */
    .coachbtn { width: 21.98px; height: 21.98px; border: none; border-radius: 10.99px; padding: 0;
      background: var(--gold-soft, rgba(201,169,74,.22)); color: var(--gold-deep); font-family: "Noto Serif SC", serif;
      font-size: 10.51px; font-weight: 600; cursor: pointer; line-height: 1; }
/* 回合数是**一条纯文字**,不是药丸(BattleView.DrawTopBar 的 ThemedLabel 18 / TextDim);
       文案也是「回合 6」而不是稿上的「第 6 回合」。稿的 ink-soft 胶囊没有落地。 */
    .turn { height: auto; padding: 0; border-radius: 0; background: none; color: var(--text-dim);
      display: flex; align-items: center; font-size: 8.60px; letter-spacing: .5px; }
/* 退出钮是 Ui.PillButton(90×38 → 43×18.15pt,ExitPink 实底白字,字号 15 → 7.17pt),
       写的是「退出」两个字,不是稿上 20×20 的淡底「✕」图钮。 */
    .quit { width: 43.00px; height: 18.15px; border: none; border-radius: 9.08px; background: var(--exit-pink);
      color: #fff; font-family: inherit; font-size: 7.17px; cursor: pointer; line-height: 1; padding: 0;
      display: flex; align-items: center; justify-content: center; white-space: nowrap; }

    .arena { flex: 1; display: flex; gap: 6px; min-height: 0; }

    /* ---------- 左窄栏 ---------- */
    .rail { width: 67.85px; flex: none; display: flex; flex-direction: column; gap: 4.78px; min-height: 0; }
/* 左栏两块**都没有卡片底**:相克图是 WuxingChart.Mount 的裸 VStack,配字表是裸 VStack。
       稿的半透宣纸底没有落地 —— 左栏直接坐在 paper 上。 */
    .railbox { background: none; border-radius: 0; padding: 0; }
/* 两条小标题字号都是 16 → 7.64pt、TextMain 宋体(不是 text-faint);
       「相 克」/「配字表」的字面见 wuxing.chart.title_ke / battle.hint.recipe_panel_title。 */
    .railbox .t { font-family: "Noto Serif SC", serif; font-size: 7.64px; color: var(--text-main);
      letter-spacing: 1px; text-align: center; margin-bottom: 0.96px; }
/* 差字面板是 VStack(间距 4 → 1.91pt),最多画 HintMissingMaxRows = 12 行,多的静默截断。 */
    .missing { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1.91px; }
    .mrow { display: flex; align-items: center; gap: 2.87px; font-size: 6.21px; }
    .mrow .g { font-family: "Noto Serif SC", serif; font-size: 9.56px; font-weight: 600; color: var(--glyph); }
/* 「缺 X」在实现里是**一个 Text**,整句同色同号(CinnabarDark / 13),
       不是稿上「灰底色 + 朱砂宋体大字」的两段。 */
    .mrow .need { color: var(--cinnabar-dark); }
    .mrow .need b { color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; }

    /* ---------- 中区 ---------- */
    .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    /* 敌方贴顶、我方贴底,富余的纵向全部堆在分隔线两侧 —— 召唤物那两排不再互相压着。 */
    .field { flex: 1; min-height: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: 2px; }
    /* 敌我分界:auto margin 把 field 剩下的纵向全部堆到这一道的上下,
       两侧各留一半 —— 富余越多,敌我离得越开。 */
    .divider { position: relative; margin: auto 0; width: 74%; height: 1px;
      background: rgba(61,78,105,.3); }
/* 稿上那枚「◈」没有落地:实现只有一条 InkSoft@30% 的线(DividerH 2 → 0.96pt,
       锚在 0.13~0.87 = 74% 宽)。留着规则但关掉,免得下一个人照着画一枚不存在的菱形。 */
    .divider::after { content: none; }
    /* flex: none 是关键:field 空间一紧,默认的 flex-shrink:1 会把后排那一行压扁,
       看上去就成了「后排叠在前排上」。四排各自锁死高度,宁可 field 留白也不互相挤。 */
    .erow { flex: none; display: flex; gap: 8px; justify-content: center; align-items: flex-end; }

    /* 敌人格 = 横排:正方立绘在左,信息列在右。
       中区 602px 宽,竖排时 4 格只吃掉 229px、空着 373px —— 横向本来就是这一屏最富余的资源。
       横排后格高由立绘单独决定(信息列 36 < 立绘 60),纵向反而比竖排省 24px/排,
       省出来的全给敌我之间的留白。BattleView 2026-08-20 试过同一种排法(横排格高 140 vs 竖排 171)。
       立绘仍严格 1:1 —— mob 素材是 512×512 的方图。 */
    .foe .blk { position: relative; flex: none; }
    /* 敌人立绘 = BattleView 的 MobView:body / face / wisp 三层等大叠放,各层 preserveAspect、无底无框。
       尺寸 = EnemyPortraitFront 126 / EnemyPortraitBack 96 逻辑单位 ÷ 2.093 ≈ 60 / 46pt。
       实机三层各自呼吸漂移(周期 3.1 / 2.3 / 4.7s),这里是静帧。 */
    .foe .blk .ly { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

    /* 以下按 BattleView.DrawEnemies 再现(逻辑单位 ÷ 2.093 = 稿面 pt)。
       格子本身无底无框:Image 只做点击区,选目标态下可点的格整格压 Ink 7%(拖字悬停的主目标同为 7%、溅射 3.5%)。
       信息列宽 = 格宽 293 − 立绘 − 间距 13:前排 154、后排 184。 */
    .foe { display: flex; align-items: center; gap: 6.21px; padding: 0; border: 0; border-radius: 0;
      background: transparent; font-family: inherit; cursor: pointer; }
    .foe.front { height: 65.93px; } .foe.rear { height: 52.08px; }
    .foe.hittable { background: rgba(17,22,31,.07); }
    .foe .info { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1.91px; }
    .foe.front .info { width: 73.58px; } .foe.rear .info { width: 87.91px; }
    /* 头行只放 名字(宋体 19,吃弹性宽)+ 属性徽章(字形色底);「射程·攻」与护甲在第二行 chip 流最前 */
    .foe .hd { display: flex; align-items: center; gap: 2.87px; width: 100%; }
    .foe .nm { flex: 1 1 auto; min-width: 0; font-family: var(--font-serif); font-weight: 600; font-size: 9.08px;
      line-height: 1.15; color: var(--text-main); white-space: nowrap; overflow: hidden; text-align: left; }
    /* Ui.Chip:宽 = 字数×字号 + padX (+ 图标 18 + 间距 3),高 = 字号 + padY;图标左贴 padX/2、竖直居中 */
    .foe .hc, .foe .sc { position: relative; flex: none; box-sizing: border-box; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center; white-space: nowrap;
      font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
    /* 2026-09-19 起头行徽章与第二行 chip 同一套尺寸:字号 15、padX 10、padY 5 */
    .foe .hc, .foe .sc { height: 9.56px; font-size: 7.17px; }
    .foe .sc { color: #fff; }
    .foe .hc .ic, .foe .sc .ic, .foe .sb .ic { position: absolute; top: 50%; width: 8.60px; height: 8.60px; transform: translateY(-50%); }
    .foe .hc .ic, .foe .sc .ic { left: 2.39px; }
    .foe .hc .t, .foe .sc .t, .foe .sb .t { position: absolute; top: 0; bottom: 0; left: 10.03px; right: 0;
      display: flex; align-items: center; justify-content: center; }
    .foe .hc.el { color: #fff; }
    .foe .sc.atk { background: var(--paper-dim); color: var(--text-main); }
    .foe .sc.def { background: var(--ink-soft); color: #fff; }
    .foe .scs { display: flex; flex-wrap: wrap; gap: 1.43px 1.91px; width: 100%; }
    .foe .sc.dot { background: var(--cinnabar); } .foe .sc.inf { background: var(--ink-soft); }
    /* 血条:PaperDim 底 + 朱砂填充,血值宋体白字 + 1.2 Ink 描边;行动条 >80% 转朱砂。护盾条已移除(盾只在立绘角标上) */
    .foe .hpb { position: relative; height: 9.08px; width: 100%; border-radius: 4.78px; background: var(--paper-dim); overflow: hidden; }
    .foe .hpb > span { display: block; height: 100%; border-radius: 4.78px; background: var(--cinnabar); }
    .foe .hpb u { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-style: normal; text-decoration: none; font-family: var(--font-serif); font-weight: 600; font-size: 6.21px; color: #fff;
      text-shadow: .6px .6px 0 var(--ink), -.6px -.6px 0 var(--ink), .6px -.6px 0 var(--ink), -.6px .6px 0 var(--ink);
      font-variant-numeric: tabular-nums; }
    .foe .atb { height: 2.87px; width: 100%; border-radius: 1.43px; background: var(--paper-dim); overflow: hidden; }
    .foe .atb > span { display: block; height: 100%; background: var(--ink-soft); }
    .foe .atb.soon > span { background: var(--cinnabar); }
    /* 护盾角标:立绘左下、边距 4;Gold 底 GoldText 字,图标随前景色 */
    .foe .sb { position: absolute; left: 1.91px; bottom: 1.91px; height: 8.12px; box-sizing: border-box; border-radius: 9999px;
      background: var(--gold); color: var(--gold-text); font-size: 6.69px; font-variant-numeric: tabular-nums; z-index: 2; }
    .foe .sb .ic { left: 0.96px; }
    .foe.front .blk { width: 60px; height: 60px; }
    .foe.rear .blk { width: 46px; height: 46px; }
    /* 攻击模式 / 技能特性 / debuff / DoT 全部并进这一行,一格最多 3 枚,超出收成 +N */
    .cps { display: flex; gap: 2px; align-items: center; }
    .icdefs { position: absolute; width: 0; height: 0; overflow: hidden; }
    /* 状态 chip = 图标 + 数值。图形取自 tools/icons/build_icons.py 的同一批 SVG
       (64×64、纯白、底色由 chip 上),真机走 Icons.Get() 的 PNG,取不到再回落汉字徽章。 */
    .cp { flex: none; height: 12px; padding: 0 3px; border-radius: 6px; color: #fff;
      font-size: 7.5px; font-weight: 700; letter-spacing: .1px;
      display: flex; align-items: center; gap: 1.5px; font-variant-numeric: tabular-nums; }
    .cp .ic { width: 9px; height: 9px; flex: none; display: block; }
    .cp.more { background: var(--text-mute); font-weight: 400; }
    .foe.dead { opacity: .28; pointer-events: none; }
/* 飘字(Juice.Popup):**没有底色药丸**,是一条加粗的裸文字,颜色 = **攻击方的五行色**
       (2026-08-30,不是固定朱砂)。字号 36 → 17.20pt(群攻等 small 档 26 → 12.42pt),
       再按伤害高低整体缩放。锚在立绘上、比它高 30 个逻辑单位,水平 ±24 抖动;同一锚点
       0.55s 内连着飘的往上让 34/层,最多 4 层。0.7s 内弹出 → 悬停 → 上浮淡出。
       相克那一记不是换底色,是给字加一圈 2.5 的金色 Outline(Theme 的 gold-deep)。 */
    .foe .dmg { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); z-index: 3;
      background: none; color: var(--fire-glyph); font-size: 17.20px; font-weight: 700;
      padding: 0; border-radius: 0; white-space: nowrap; font-variant-numeric: tabular-nums;
      animation: pop .18s ease-out; }
    .foe .dmg.sm { font-size: 12.42px; }
    .foe .dmg.ke { background: none; box-shadow: none;
      -webkit-text-stroke: 1.19px var(--gold-deep); paint-order: stroke fill; }
    @keyframes pop { from { transform: translate(-50%, 5px); opacity: 0; } }
    /* 空格位:每排恒定 4 格,空的也占位 —— 贯穿/横扫按列结算,列不能因为死了怪就塌 */
/* uGUI 没有虚线:实现是 Ui.OutlinedPanel 的**实线**(SlotFrameThickness 2 → 0.96pt,
       SlotFrameRadius 12 → 5.73pt),色是 PaperDim 压到 45% alpha。 */
    .foeslot { border-radius: 5.73px; border: 0.96px solid var(--paper-dim); opacity: .45; }
    .foeslot.front { width: 140px; height: 66px; }
    .foeslot.rear { width: 140px; height: 52px; }

    /* ---------- 我方:召唤物格 + 执笔人条(按 BattleView.DrawSummons / DrawPlayerStats 再现) ---------- */
    .srow { flex: none; display: flex; gap: 8.12px; justify-content: center; align-items: center; }
    /* 格位 289 × 113(前)/ 88(后);空槽平时什么都不画,只占位(选位态才出淡墨块) */
    .sm { flex: none; width: 138.08px; display: flex; align-items: center; gap: 4.78px; }
    .sm.front { height: 53.99px; } .sm.rear { height: 42.04px; }
    /* 立绘 = RoundButton:ElementSoft 底、ElementSoftFg 字(黑体,字号 = 边长 × 0.46)、圆角 12 */
    .sm .pt { position: relative; flex: none; border-radius: 5.73px; background: var(--wood-soft); color: var(--wood-fg);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); line-height: 1; }
    .sm.front .pt { width: 47.78px; height: 47.78px; font-size: 21.98px; }
    .sm.rear .pt { width: 35.83px; height: 35.83px; font-size: 16.24px; }
    .sm .info { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1.91px; }
    .sm.front .info { width: 85.52px; } .sm.rear .info { width: 97.47px; }
    .sm .hd { width: 100%; height: 11.47px; display: flex; align-items: center; gap: 2.87px; }
    .sm .nm { flex: 1 1 auto; min-width: 0; text-align: left; font-family: var(--font-serif); font-weight: 600;
      font-size: 9.08px; line-height: 1.15; color: var(--text-main); white-space: nowrap; overflow: hidden; }
    /* 单位格 chip 与敌人格同一套:字号 15、padX 10、padY 5 */
    .sm .hc, .sm .sc, .pl .pc, .sb2 { position: relative; flex: none; box-sizing: border-box; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center; white-space: nowrap;
      font-family: var(--font-sans); font-variant-numeric: tabular-nums; color: #fff; }
    .sm .hc, .sm .sc { height: 9.56px; font-size: 7.17px; }
    .sm .ic, .pl .pc .ic, .sb2 .ic { position: absolute; top: 50%; width: 8.60px; height: 8.60px; transform: translateY(-50%); }
    .sm .hc .ic, .sm .sc .ic { left: 2.39px; }
    .sm .t, .pl .pc .t, .sb2 .t { position: absolute; top: 0; bottom: 0; left: 10.03px; right: 0;
      display: flex; align-items: center; justify-content: center; }
    .sm .sc.atk { background: var(--paper-dim); color: var(--text-main); }
    .sm .sc.def { background: var(--ink-soft); }
    .sm .sc.gold { color: var(--gold-text); }
    .sm .scs { display: flex; flex-wrap: wrap; gap: 1.43px 1.91px; width: 100%; }
    /* 血条:DoneGreen 填充(敌人是朱砂 —— 友军用红会被误读成敌方),血值叠字同敌人格 */
    .sm .hpb, .pl .hpb { position: relative; width: 100%; background: var(--paper-dim); overflow: hidden; border-radius: 4.78px; }
    .sm .hpb { height: 8.12px; }
    .sm .hpb > span { display: block; height: 100%; border-radius: 4.78px; background: var(--done-green); }
    .sm .hpb u, .sm .atb u, .pl .atb u { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-style: normal; text-decoration: none; font-family: var(--font-serif); font-weight: 600; color: #fff;
      text-shadow: .6px .6px 0 var(--ink), -.6px -.6px 0 var(--ink), .6px -.6px 0 var(--ink), -.6px .6px 0 var(--ink);
      font-variant-numeric: tabular-nums; }
    .sm .hpb u { font-size: 6.21px; }
    /* 行动条走共享 ActionBar:高 15、百分比叠字 13(2026-09-19 放大),>80% 转 DoneGreen */
    .sm .atb, .pl .atb { position: relative; width: 100%; height: 7.17px; border-radius: 4.78px; background: var(--paper-dim); overflow: visible; }
    .sm .atb > span, .pl .atb > span { display: block; height: 100%; border-radius: 4.78px; background: var(--ink-soft); }
    .sm .atb.soon > span, .pl .atb.soon > span { background: var(--done-green); }
    .sm .atb u, .pl .atb u { font-size: 6.21px; }
    /* 护盾角标:三种单位同一枚(字号 14、padX 4、padY 3),贴立绘左下、边距 4 */
    .sb2 { position: absolute; left: 1.91px; bottom: 1.91px; height: 8.12px; background: var(--gold);
      color: var(--gold-text); font-size: 6.69px; z-index: 2; }
    .sb2 .ic { left: 0.96px; }

    /* 执笔人条:定高 84、定宽 1223 居中,透明底;子项 立绘 | 信息列 | 分隔 | AP | 分隔 | 状态栏,间距 8 */
    .pl { flex: none; width: 584.33px; height: 40.13px; align-self: center; display: flex; align-items: center;
      justify-content: center; gap: 3.82px; }
    .pl .pt { position: relative; flex: none; width: 33.92px; height: 33.92px; border-radius: 7.17px; background: var(--ink);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-weight: 600; font-size: 19.11px; line-height: 1; }
    .pl .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1.91px; }
    .pl .hd { position: relative; height: 11.47px; }
    .pl .who { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center;
      font-family: var(--font-serif); font-weight: 600; font-size: 9.08px; color: var(--text-main); }
    .pl .hpn { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center;
      font-size: 7.17px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .pl .hpb { height: 8.12px; }
    .pl .hpb > span { display: block; height: 100%; border-radius: 4.78px; background: var(--cinnabar); }
    .pl .dv { flex: none; width: 0.96px; height: 33.92px; background: var(--panel-border); }
    .pl .ap { flex: none; display: flex; align-items: center; gap: 4.78px; }
    .pl .ap .k { font-size: 7.17px; color: var(--text-dim); }
    .pl .pips { display: flex; gap: 2.87px; }
    .pl .pips i { display: block; width: 8.12px; height: 20.07px; border-radius: 1.91px; background: var(--paper-dim); }
    .pl .pips i.on { background: var(--ink); }
    /* 状态栏:定宽 251,ChipFlow 与单位格同一套(字号 15、padX 10、padY 5),最多两行 */
    .pl .stt { flex: none; width: 119.92px; display: flex; flex-wrap: wrap; align-content: center; gap: 1.43px 1.91px; }
    .pl .pc { height: 9.56px; font-size: 7.17px; }
    .pl .pc .ic { left: 2.39px; }
    /* 赭金底压 GoldText(白字只有 2.3:1) */
    .pl .pc.gold { background: var(--gold); color: var(--gold-text); } .pl .pc.jade { background: #439458; }

    /* ---------- 手牌 ---------- */
    /* 宽度与对齐同 .me(见那里的说明)。justify-content 从 center 改成 flex-start
       (2026-09-01):计数标题在行首,整组居中会让标题的 x 随牌数左右漂,与下面同样带
       标题的部件池行对不齐 —— 「竖着看别扭」正是别扭在这里。 */
    .hand { flex: none; width: 584.33px; align-self: center; display: flex;
      align-items: center; justify-content: flex-start; gap: 3.82px; }
    /* 计数标题:原本是 writing-mode: vertical-rl,而「部件池 12/12」有 8 个字符,竖着
       堆起来比整条手牌带(56px)还高,一个字一个字往下读确实别扭。2026-09-01 改回横排
       一行。定宽 46px 不是为了标题自己好看,是为了让两行的第一张牌落在同一个 x 上
       ——「字库 5/9」与「部件池 12/12」的自然宽度差着一大截。 */
    .handlbl { flex: none; width: 45.87px; font-size: 6.69px; color: var(--text-dim); letter-spacing: 1.5px; }
/* 牌根那圈镶边**缺省是墨影(Theme.Shadow)不是稀有度色**:稀有度色只在「这张出得起」时
       由 CardFrameView 点亮成一圈会呼吸的边;选中态压墨色(Theme.Ink),优先于稀有度色。
       牌面本身是 CardFrames 的**稀有度框素材**(整张等比缩放的 Image),不是 CSS 描边 —— 
       下面 .tile::before 那圈内描边只是素材缺失时的近似。 */
    .tile { position: relative; width: 45.87px; height: 55.90px; border-radius: 6.69px; background: var(--card-face);
      border: 2px solid var(--text-mute); box-shadow: 0 1px 3px rgba(22,27,34,.1); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0; font-family: inherit; transition: transform .1s; }
    .tile::before { content: ""; position: absolute; inset: 3px; border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--rar) 28%, transparent); }
/* 字形字号 = 牌高 × 0.34 → round(117×0.34)=40 → 19.11pt,锚在牌面 0.30~0.95;
       拼音恒 12 → 5.73pt,锚在 0.06~0.30(Ui.GlyphTile)。 */
    .tile .g { position: relative; z-index: 2; font-family: "Noto Serif SC", serif; font-size: 19.11px;
      font-weight: 600; line-height: 1; color: var(--glyph); }
    .tile .p { position: relative; z-index: 2; font-size: 5.73px; color: var(--text-dim); margin-top: 2px; letter-spacing: .3px; }
    /* 选中 = 墨色边(Theme.Ink),不是朱砂;也没有位移与外发光 */
    .tile.on { border-color: var(--ink); box-shadow: none; transform: none; }
    .tile.dim { filter: grayscale(.75); opacity: .48; }
/* uGUI 没有虚线:Ui.OutlinedPanel 的实线 1.5 → 0.72pt,圆角 10 → 4.78pt;文案字号 11 → 5.26pt。 */
    .adslot { width: 42.04px; height: 55.90px; border-radius: 4.78px; border: 0.72px solid #A9CDB2; background: #EDF7EF;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.91px;
      font-size: 5.26px; color: var(--upgrade-text); cursor: pointer; font-family: inherit; line-height: 1.3; padding: 0; }
    /* 2026-09-02 用户拍板:**扩容之后整格撤掉,不留灰槽**,原本的 .used 持续态作废。
       原口径是「用过后转灰而不是消失」,为的是留一条「已经扩过容了」的反馈;但这两行本来
       就挤(字库满员 12 张时已要等比压缩才排得下),一个点不动的灰槽白占一格宽度,而扩容
       这件事在容量数字上已经写着(标题就是「字库 5/11」),不需要第二处反馈。 */

    /* ---------- 部件池 ---------- */
    .pool { flex: none; width: 584.33px; align-self: center; display: flex;
      align-items: center; justify-content: flex-start; gap: 3.82px; }
    .pool .lbl { flex: none; width: 45.87px; font-size: 6.69px; color: var(--text-dim); letter-spacing: 1.5px; }
/* 部件卡是手搭的(不复用 RoundButton):Theme.Rounded(12) → 圆角 5.73pt。
       **银边 = 这张还能再拆一层**(PartRimThickness 3 → 1.43pt,外面还套一圈会呼吸的银色墨晕),
       不是稿上那圈 transparent 占位边。 */
    .part { position: relative; width: 32.01px; height: 38.22px; border-radius: 5.73px; cursor: pointer;
      background: var(--elSoft); border: 1.43px solid transparent; padding: 0; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .part.splittable { border-color: var(--silver, #B8BCC2); }
    .part .pg { font-family: "Noto Serif SC", serif; font-size: 14.33px; font-weight: 600;
      line-height: 1; color: var(--elFg); }
    /* 同源变体(ComponentKin):水=水氵冫 / 木=木艹 / 金=金钅戈刂刀 / 土=土山石 / 火=火灬。
       同组任一都能顶替配方里的那一位,所以必须标在卡面上。
       2026-09-01 用户拍板还原四角设计:同组**其他全部**成员各占一个角,从右上起顺时针填。
       曾短暂改成卡面底部一行「≈氵冫」(超过 2 个用 +N 收尾),那一版读不出「具体能顶谁」
       —— 金系除自己外正好 4 个(钅戈刂刀),四角刚好占满,一个都不用省。
       再加成员就得换设计:第五个角不存在。 */
/* 四角同源徽标走 Ui.Chip(字号 10 / padX 4 / padY 4)→ 高 (10+4)/2.093 = 6.69pt、
       字号 4.78pt、左右内边距各 1.91pt;底色是 Theme.ElementColor(实色),不是 elFg。 */
    .part .kb { position: absolute; height: 6.69px; padding: 0 1.91px; border-radius: 3.34px;
      background: var(--el); color: #fff; font-size: 4.78px; line-height: 6.69px;
      letter-spacing: -.2px; white-space: nowrap; }
    .part .kb.c0 { right: 1px; top: 1px; }      /* 右上 */
    .part .kb.c1 { right: 1px; bottom: 1px; }   /* 右下 */
    .part .kb.c2 { left: 1px; bottom: 1px; }    /* 左下 */
    .part .kb.c3 { left: 1px; top: 1px; }       /* 左上 */
/* 选中不是加朱砂边:是**整张换底** —— 底 ElementSoft→ElementColor、字 ElementSoftFg→白。 */
    .part.on { background: var(--el); border-color: transparent; box-shadow: none; }
    .part.on .pg { color: #fff; }
    .part.neutral { background: #E4DFD4; }
    .part.neutral .pg { color: var(--neutral-part); }
    .adpart { width: 32.01px; height: 38.22px; border-radius: 4.78px; border: 0.72px solid #A9CDB2; background: #EDF7EF;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.96px;
      font-size: 5.26px; color: var(--upgrade-text); cursor: pointer; font-family: inherit; padding: 0; line-height: 1.2; }
    /* .adpart.used 同 .adslot.used,一并作废(2026-09-02)。 */

    /* ---------- 右栏 拆合台 ---------- */
/* 拆合台 = Ui.CardPanel(Theme.PaperCard,圆角 20 → 9.56pt),**没有描边**;
       BenchPad 15 → 7.17pt、BenchGap 10 → 4.78pt、BenchW 276 → 131.87pt。
       两条小标题(「拆 合 台」「可 合 成」)都是 13 → 6.21pt 的 TextDim 宋体。 */
    .bench { width: 131.87px; flex: none; background: rgba(255,253,247,.62); border: 0;
      border-radius: 9.56px; padding: 7.17px; display: flex; flex-direction: column; gap: 4.78px; min-height: 0; }
    .bench .t { font-family: "Noto Serif SC", serif; font-size: 6.21px; color: var(--text-dim);
      letter-spacing: 2px; text-align: center; flex: none; }
    .picked { display: flex; align-items: center; gap: 2.87px; flex: none; }
/* Ui.OutlinedPanel(纯白底 + 稀有度色描边 2 → 0.96pt,圆角 8 → 3.82pt),字形 42 → 20.07pt。 */
    .picked .pt { width: 33.92px; height: 43.00px; flex: none; border-radius: 3.82px; background: #fff;
      border: 0.96px solid var(--rar); display: flex; align-items: center; justify-content: center;
      font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 600; color: var(--glyph); }
    .picked .pi { min-width: 0; }
    .picked .pn { font-size: 5.73px; color: var(--text-dim); letter-spacing: .3px; }
    .picked .pv { font-size: 6.21px; color: var(--text-main); line-height: 1.45; margin-top: 0.96px; }
    .picked .pv b { color: var(--fire-glyph); }
    .kinrow { display: flex; align-items: center; gap: 2.87px; flex: none; }
    .kinrow .ar { font-size: 7.64px; color: var(--text-dim); }
    .kinrow .kp { width: 18.16px; height: 18.16px; border-radius: 3.82px; display: flex;
      align-items: center; justify-content: center; background: var(--el); color: #fff;
      font-family: "Noto Sans SC", sans-serif; font-size: 7.64px; font-weight: 600; }
    .kinnote { flex: none; font-size: 6.21px; color: var(--text-dim); letter-spacing: .3px; }
    .empty { flex: none; font-size: 6.69px; color: var(--text-dim); line-height: 1.7; padding: 1.91px 0.96px; }
    .acts { display: flex; gap: 3.82px; flex: none; justify-content: center; }
/* 三钮是 Ui.RoundButton **定宽** 76×52 → 36.31×24.84pt(不是 flex:1 等分),
       字号 17 → 8.12pt,圆角取 Ui.RoundButton 的缺省。 */
    .act { flex: none; width: 36.31px; height: 24.84px; border: none; border-radius: 5.73px; cursor: pointer;
      font-family: "Noto Serif SC", serif; font-size: 8.12px; font-weight: 600; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; }
    .act.cast { background: var(--cinnabar); color: #fff; }
    .act.cast.no { background: var(--node-rail); color: var(--text-warm); cursor: not-allowed; }
    .act.split { background: var(--shield-blue); color: #fff; }
/* 「弃」是 ExitPink 实底白字(Theme.ExitPink),不是稿上的灰底深字 —— 与顶栏退出同色系。 */
    .act.drop { background: var(--exit-pink); color: #fff; }
    .craft { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 3.82px; }
    .craft::-webkit-scrollbar { width: 3px; }
    .craft::-webkit-scrollbar-thumb { background: #D3CBBA; border-radius: 2px; }
    /* 只列可合成的。缺料的字归左栏「配字表」—— 拆合台是动手的地方,不是清单。 */
/* 可合成行 = Ui.CardPanel(Theme.AdGreenBg,圆角 10 → 4.78pt)+ 定高 CraftRowHeight 50 → 23.89pt,
       内层 Row 间距 6 → 2.87pt;**没有那圈 inset 描边**。 */
    .cr { display: flex; align-items: center; justify-content: center; gap: 2.87px;
      flex: none; height: 23.89px; padding: 0; border-radius: 4.78px;
      background: var(--ad-green-bg, #E9F3EB); cursor: pointer;
      border: none; font-family: inherit; width: 100%; }
    .cr .src { font-family: "Noto Serif SC", serif; font-size: 7.17px; color: var(--text-dim); }
    .cr .ar { font-size: 6.21px; color: var(--text-dim); }
    .cr .out { font-family: "Noto Serif SC", serif; font-size: 10.51px; font-weight: 600; color: var(--glyph); }
    .crempty { font-size: 6.21px; color: var(--text-dim); text-align: center; padding: 3.82px 0.96px; line-height: 1.6; }
    /* ---------- 新手引导:屏幕中央,固定故事模板 ----------
       三段恒定:一句道理(旁白) → 一个动作(指令) → 一句结果(预告)。
       遮罩只压到 38%,要看得见被点名的那张牌/那只怪。 */
    .scrim { position: absolute; inset: 0; background: rgba(22,27,34,.38); z-index: 60;
      display: flex; align-items: center; justify-content: center; }
    .coach { width: 372px; background: #FBF7EC; border: 1.5px solid var(--rarity-gold); border-radius: 12px;
      padding: 16px 20px 14px; box-shadow: 0 10px 34px rgba(22,27,34,.34); position: relative; }
    .coach .seal { position: absolute; right: 14px; top: -11px; height: 21px; padding: 0 10px;
      border-radius: 11px; background: var(--rarity-gold); color: #2B2200; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; letter-spacing: 1px; }
    .coach .tale { font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 600;
      letter-spacing: 2px; color: var(--text-main); line-height: 1.5; }
    .coach .rule { height: 1px; background: #E4DBC5; margin: 11px 0 10px; }
    .coach .doit { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-quiet); }
    .coach .doit .k { flex: none; font-size: 9px; letter-spacing: 2px; color: var(--gold-deep);
      background: #F4EAD2; border-radius: 4px; padding: 2px 6px; }
    .coach .doit b { font-family: "Noto Serif SC", serif; font-size: 15px; font-weight: 600; color: var(--cinnabar-dark); }
    .coach .then { font-size: 11px; color: var(--text-warm); line-height: 1.6; margin-top: 8px; padding-left: 2px; }
    .coach .foot { display: flex; align-items: center; gap: 9px; margin-top: 14px; }
    .coach .dots { display: flex; gap: 4px; }
    .coach .dots i { width: 6px; height: 6px; border-radius: 50%; background: #E0D5B8; display: block; }
    .coach .dots i.on { background: var(--rarity-gold); }
    .coach .dots i.done { background: #A89468; }
    .coach .skip { border: none; background: transparent; color: var(--text-warm); font-family: inherit;
      font-size: 11px; cursor: pointer; padding: 4px 2px; }
    .coach .next { margin-left: auto; height: 34px; padding: 0 20px; border: none; border-radius: 17px;
      background: var(--cinnabar); color: #fff; font-family: inherit; font-size: 13px;
      letter-spacing: 2px; cursor: pointer; }

/* 结束回合是 Ui.PillButton(190×52 → 90.78×24.84pt,**朱砂**实底白字,字号 21 → 10.03pt),
       在栏底那一行里居中,不是通栏铺满的 ink-soft 方角钮。 */
    .endturn { flex: none; align-self: center; width: 90.78px; height: 24.84px; border: none;
      border-radius: 12.42px; cursor: pointer;
      background: var(--cinnabar); color: #fff; font-family: "Noto Serif SC", serif;
      font-size: 10.03px; font-weight: 600; letter-spacing: 2px; }
  
</style></head><body>
