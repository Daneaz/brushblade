<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../component/bundle.css"><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}.lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:6px;text-align:center}
/* bundle.css 里 .zd-tab* 有两套规则，靠后那套是旧稿值（1px CSS 描边 + panel-paper 底 + 图标 20 + 副文 text-faint

.zd-root .zd-tab .zd-reddot { top: 7.64px; right: 7.64px; }
.zd-root .zd-tab--deck     { background: var(--tab-deck-border); }
.zd-root .zd-tab--bestiary { background: var(--tab-bestiary-border); }
