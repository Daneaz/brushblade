<!-- @dsCard group="操作" height=250 subtitle="实现 · Ui.PillButton / Ui.RoundButton · 黑体 · 圆角是定值" -->
<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../component/bundle.css"><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:6px;text-align:center;white-space:nowrap}.col{display:flex;flex-direction:column;align-items:center}
/* 本卡按 1× pt 画(px = 逻辑单位 ÷ 2.093),与 bundle.css 的 .zd-btn* 同一口径。bundle 没有的档在这里补。 */
/* AdBadge 72×46:圆角/字号按高度派生(31×46/63 → 23、21×46/63 → 15),播放三角 15×17×0.73,间距 10×0.73 */
.zd-root .zd-btn--ad { border-radius: 10.99px; font-size: 7.17px; gap: 3.49px; }
.zd-root .zd-btn--ad i { width: 0; height: 0; border-style: solid; border-width: 2.97px 0 2.97px 5.23px;
  border-color: transparent transparent transparent var(--ad-green); }
/* 战斗行动钮 76×52 · RoundButton 默认圆角 10 · 字号 17 */
.zd-root .zd-btn--act { width: 36.31px; height: 24.84px; border-radius: 4.78px; font-size: 8.12px; }
/* 结束回合 190×52 · 24 · 21 */
.zd-root .zd-btn--end { width: 90.78px; height: 24.84px; border-radius: 11.47px; font-size: 10.03px; }
/* 外层页顶栏「返回地图」PillButton 130×63 · 24 · 25 */
.zd-root .zd-btn--back { width: 62.11px; height: 30.10px; border-radius: 11.47px; font-size: 11.94px; }
/* 战斗顶栏 72×38 / 90×38 · 24 · 15 */
.zd-root .zd-btn--bt { height: 18.16px; border-radius: 11.47px; font-size: 7.17px; }
/* 技能节点「解锁」主钮:高 56 · 24 · 18 */
.zd-root .zd-btn--perk { width: 100.81px; height: 26.76px; border-radius: 11.47px; font-size: 8.60px; }
/* 禁用 = Unity 默认 ColorTint:原底色 ×0.78、alpha 0.5,不换底色 */
.zd-root .zd-btn.is-off { filter: brightness(.78); opacity: .5; cursor: default; }
</style></head><body>
<div class="zd-root wrap">
<div class="col"><button class="zd-btn zd-btn--cta">续 爬</button><div class="lbl">主界面续爬 · 523×109 · r24 · 38</div></div>
<div class="col"><button class="zd-btn zd-btn--modal zd-btn--shiqing">挂起离塔</button><div class="lbl">弹窗 · 石青推进</div></div>
<div class="col"><button class="zd-btn zd-btn--modal zd-btn--danger">弃塔</button><div class="lbl">弹窗 · 不可逆 · 朱砂描边</div></div>
<div class="col"><button class="zd-btn zd-btn--modal zd-btn--quiet">继续战斗</button><div class="lbl">弹窗 · 取消档</div></div>
<div class="col"><button class="zd-btn zd-btn--act zd-btn--shiqing">出</button><div class="lbl">战斗行动 · 76×52 · r10</div></div>
<div class="col"><button class="zd-btn zd-btn--end zd-btn--shiqing">结束回合</button><div class="lbl">结束回合 · 190×52 · r24</div></div>
<div class="col"><button class="zd-btn zd-btn--bt zd-btn--ink" style="width:34.40px">设置</button><div class="lbl">战斗顶栏 · 72×38</div></div>
<div class="col"><button class="zd-btn zd-btn--bt zd-btn--plum" style="width:43.00px">退出</button><div class="lbl">战斗顶栏 · 90×38</div></div>
<div class="col"><button class="zd-btn zd-btn--chest zd-btn--ink">开始开启</button><div class="lbl">宝箱 · 150×46 · r14</div></div>
<div class="col"><button class="zd-btn zd-btn--chest-open zd-btn--gold">开箱!</button><div class="lbl">宝箱 · 已就绪 · 150×50</div></div>
<div class="col"><button class="zd-btn zd-btn--chest-sm zd-btn--gold">18墨</button><div class="lbl">宝箱 · 花墨加速</div></div>
<div class="col"><button class="zd-btn zd-btn--ad"><i></i>-10m</button><div class="lbl">看广告 · 72×46 · r23/f15 · 宋体</div></div>
<div class="col"><button class="zd-btn zd-btn--perk zd-btn--gold">解锁 · 30墨</button><div class="lbl">技能解锁 · 211×56 · gold-text</div></div>
<div class="col"><button class="zd-btn zd-btn--back zd-btn--plum">返回地图</button><div class="lbl">外层页返回 · 130×63 · r24</div></div>
<div class="col"><button class="zd-btn zd-btn--top zd-btn--plum">设置</button><div class="lbl">主界面设置 · 130×63 · r16</div></div>
<div class="col"><button class="zd-btn zd-btn--chest zd-btn--ink is-off">开始开启</button><div class="lbl">禁用 · 原底 ×0.78 半透明</div></div>
</div>
</body></html>
