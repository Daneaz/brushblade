<!doctype html><html><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../component/bundle.css"><meta charset="utf-8"><style>html,body{margin:0;background:var(--paper)}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}.lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:6px;text-align:center}.col{display:flex;flex-direction:column;align-items:center}
/* AdBadge 的圆角/字号是按高度派生的（31×h/63、21×h/63），不是宝箱钮那档的 14/19。
   bundle.css 的 .zd-btn--ad 抄错成了 14/19，这里用更高优先级的选择器改回实现值。 */
.zd-root .zd-btn--ad { border-radius: 10.99px; font-size: 7.17px; }
/* 战斗行动钮吃 Ui.RoundButton 的默认圆角 10，bundle.css 没有对应档 */
.zd-root .zd-btn--act { width: 36.31px; height: 24.84px; border-radius: 4.78px; font-size: 8.12px; }
/* 顶栏返回键是 PillButton（圆角 24），与顶栏设置（RoundButton 圆角 16）不同档 */
.zd-root .zd-btn--back { width: 62.11px; height: 30.10px; border-radius: 11.47px; font-size: 11.94px; }
</style></head><body>
<div class="zd-root wrap"><div class="col"><button class="zd-btn zd-btn--cta zd-btn--cinnabar">续 爬</button><div class="lbl">主界面续爬 · 523×109 · r24</div></div><div class="col"><button class="zd-btn zd-btn--modal zd-btn--cinnabar">弃塔</button><div class="lbl">弹窗 · 朱砂</div></div><div class="col"><button class="zd-btn zd-btn--modal zd-btn--ink">挂起离塔</button><div class="lbl">弹窗 · 深灰蓝</div></div><div class="col"><button class="zd-btn zd-btn--modal zd-btn--quiet">知道了</button><div class="lbl">弹窗 · 取消档</div></div><div class="col"><button class="zd-btn zd-btn--act zd-btn--cinnabar">出</button><div class="lbl">战斗行动 · 76×52 · r10</div></div><div class="col"><button class="zd-btn zd-btn--chest zd-btn--ink">开始计时</button><div class="lbl">宝箱 · 150×46 · r14</div></div><div class="col"><button class="zd-btn zd-btn--chest-open zd-btn--gold">开箱</button><div class="lbl">宝箱 · 已就绪</div></div><div class="col"><button class="zd-btn zd-btn--chest-sm zd-btn--gold">18墨</button><div class="lbl">宝箱 · 花墨加速</div></div><div class="col"><button class="zd-btn zd-btn--ad">-10m</button><div class="lbl">看广告 · 72×46 · r23/f15</div></div><div class="col"><button class="zd-btn zd-btn--back zd-btn--plum">返回</button><div class="lbl">顶栏返回 · 130×63 · r24</div></div><div class="col"><button class="zd-btn zd-btn--top zd-btn--plum">设置</button><div class="lbl">顶栏设置 · 130×63 · r16</div></div><div class="col"><button class="zd-btn zd-btn--chest" disabled>开始计时</button><div class="lbl">禁用</div></div></div>
